# Déploiement en un clic sur Render (render.com).
# Render détecte ce fichier automatiquement quand on connecte le dépôt.
services:
  - type: web
    name: eloquence
    runtime: node
    plan: free
    rootDir: eloquence
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
    # Sur le plan gratuit, pas de disque persistant : sans DATABASE_URL, les
    # comptes et enregistrements sont réinitialisés à chaque redéploiement ou
    # redémarrage après inactivité. Pour rester sur le plan gratuit sans
    # perdre les données, créer une base Postgres gratuite sur supabase.com
    # et renseigner DATABASE_URL (+ un JWT_SECRET fixe) — voir le README,
    # section « Déploiement gratuit, sans perdre les données ».
