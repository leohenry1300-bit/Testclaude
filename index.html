titions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_angfin_39_r","deckId":"angfin","front":"Formule d’ouverture utilisée quand on ne connaît pas le nom du destinataire.","back":"To whom it may concern","hint":"Équivalent de « Madame, Monsieur » en français.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_0","deckId":"patrimoine2","front":"La holding patrimoniale","back":"Une société créée pour détenir et organiser le patrimoine familial (entreprises, immobilier, placements) de façon centralisée.","hint":"Elle facilite la transmission progressive et peut offrir des avantages fiscaux selon son régime.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_1","deckId":"patrimoine2","front":"Le pacte Dutreil","back":"Un engagement collectif de conservation des titres d’une entreprise, qui permet une exonération partielle des droits de transmission (75 % de la valeur).","hint":"Pensé pour faciliter la transmission d’entreprises familiales sans les fragiliser fiscalement.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_2","deckId":"patrimoine2","front":"Le family office","back":"Une structure dédiée à la gestion globale du patrimoine d’une famille fortunée : investissements, fiscalité, transmission, parfois biens non financiers.","hint":"Un « single family office » sert une seule famille ; un « multi family office » en sert plusieurs.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_3","deckId":"patrimoine2","front":"Le triangle de sécurité (assurance-vie luxembourgeoise)","back":"Une séparation stricte entre l’assureur, la banque dépositaire et l’autorité de contrôle, qui protège les actifs même en cas de faillite de l’assureur.","hint":"Un argument souvent mis en avant pour l’assurance-vie luxembourgeoise auprès d’une clientèle fortunée.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_4","deckId":"patrimoine2","front":"Le crédit lombard","back":"Un prêt accordé en nantissant un portefeuille de titres financiers comme garantie, sans avoir à le vendre.","hint":"Permet de financer un projet tout en gardant son portefeuille investi.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_5","deckId":"patrimoine2","front":"La multigestion","back":"Une gestion qui répartit l’épargne entre plusieurs sociétés de gestion ou plusieurs fonds, pour diversifier les styles de gestion.","hint":"Un « fonds de fonds » est une forme courante de multigestion.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_6","deckId":"patrimoine2","front":"Contrat de capitalisation vs assurance-vie","back":"Même fonctionnement financier que l’assurance-vie, mais sans clause bénéficiaire ni dénouement au décès : il entre dans la succession classique.","hint":"Souvent utilisé par une holding, qui ne peut pas souscrire d’assurance-vie.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_7","deckId":"patrimoine2","front":"Les FCPI et FIP","back":"Des fonds qui investissent dans des PME innovantes (FCPI) ou régionales (FIP), avec une réduction d’impôt à l’entrée en échange d’un risque élevé et d’un blocage des fonds.","hint":"Le risque de perte en capital est réel : ce sont des placements risqués, pas de l’épargne de précaution.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_8","deckId":"patrimoine2","front":"Le déficit foncier","back":"Quand les charges déductibles d’un bien locatif dépassent les loyers perçus, la différence peut être déduite du revenu global, dans une certaine limite.","hint":"Une stratégie classique pour réduire son impôt tout en rénovant un bien locatif.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_9","deckId":"patrimoine2","front":"La nue-propriété temporaire (investissement)","back":"Acheter uniquement la nue-propriété d’un bien pour une durée fixée à l’avance, avec une décote à l’achat, en laissant l’usufruit à un tiers (souvent un bailleur institutionnel).","hint":"À l’issue de la période, l’investisseur récupère la pleine propriété sans frais supplémentaires.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_10","deckId":"patrimoine2","front":"Le rescrit fiscal","back":"Une demande officielle à l’administration fiscale pour obtenir par écrit sa position sur une situation précise avant d’agir.","hint":"Une fois accordé, il protège le contribuable qui l’applique de bonne foi.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_11","deckId":"patrimoine2","front":"L’abus de droit fiscal","back":"Le fait d’utiliser un montage légal en apparence, mais dans le seul but d’éluder l’impôt, sans autre motif économique réel.","hint":"L’administration peut alors requalifier l’opération et appliquer des pénalités majorées.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_12","deckId":"patrimoine2","front":"Le quasi-usufruit","back":"Un usufruit portant sur une somme d’argent ou un bien consommable : l’usufruitier peut la dépenser librement, à charge de la restituer à la fin.","hint":"Fréquent dans les successions, quand le conjoint survivant hérite de l’usufruit sur des liquidités.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_13","deckId":"patrimoine2","front":"Le trust","back":"Une structure de droit anglo-saxon où un « settlor » transfère des biens à un « trustee » chargé de les gérer au profit de « bénéficiaires ». N’existe pas en droit français.","hint":"Un résident fiscal français impliqué dans un trust a des obligations déclaratives spécifiques.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_14","deckId":"patrimoine2","front":"Les critères ESG en gestion de patrimoine","back":"Environnementaux, Sociaux et de Gouvernance : des critères extra-financiers de plus en plus intégrés dans le choix des placements.","hint":"Le label ISR (Investissement Socialement Responsable) certifie qu’un fonds respecte ces critères.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_15","deckId":"patrimoine2","front":"LMP vs LMNP","back":"Loueur Meublé Professionnel (LMP) : inscription au RCS, recettes locatives supérieures à un seuil et supérieures aux autres revenus du foyer. En dessous, on reste en LMNP.","hint":"Le régime LMP a un impact different sur les déficits et les plus-values, avec des règles plus complexes.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_16","deckId":"patrimoine2","front":"Le family buy-out","back":"Le rachat d’une entreprise familiale par certains membres de la famille (souvent la génération suivante), avec l’appui d’un financement dédié.","hint":"Permet de transmettre l’entreprise à un ou plusieurs héritiers sans léser financièrement les autres.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_17","deckId":"patrimoine2","front":"Le PER obligatoire d’entreprise (PERO)","back":"Un plan d’épargne retraite mis en place par l’employeur, qui peut être alimenté par l’entreprise et parfois obligatoire pour certains salariés.","hint":"Distinct du PER individuel, qu’on ouvre soi-même sans lien avec son employeur.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_18","deckId":"patrimoine2","front":"Le forfait social","back":"Une contribution patronale sur certaines sommes d’épargne salariale (intéressement, participation, abondement), différente des cotisations sociales classiques.","hint":"Son taux réduit encourage les entreprises à mettre en place ces dispositifs.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_patrimoine2_19","deckId":"patrimoine2","front":"CIF vs courtier en assurance/crédit","back":"Le Conseiller en Investissements Financiers (CIF) est encadré par l’AMF pour le conseil en produits financiers ; le courtier en assurance ou en crédit relève d’un statut différent, encadré par l’ACPR ou l’ORIAS selon les cas.","hint":"Un même professionnel cumule parfois plusieurs statuts pour proposer une offre complète.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_0","deckId":"orthographe","front":"Ses / ces / c’est / s’est","back":"Ses : possessif (« ses affaires »). Ces : démonstratif (« ces gens »). C’est : présentateur (« c’est vrai »). S’est : verbe pronominal (« il s’est trompé »).","hint":"Astuce : remplace par « mes » (ses), « ces » reste devant un nom qu’on montre, « cela est » (c’est), « il se… » (s’est).","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_1","deckId":"orthographe","front":"Quoique / quoi que","back":"Quoique (en un mot) = bien que. Quoi que (en deux mots) = quelle que soit la chose que.","hint":"« Quoiqu’il soit tard » (bien qu’il soit tard) / « Quoi qu’il dise, je n’y crois pas » (peu importe ce qu’il dit).","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_2","deckId":"orthographe","front":"Leur / leurs","back":"Leur, pronom devant un verbe, est invariable (« je leur parle »). Leur, déterminant devant un nom, s’accorde (« leurs enfants »).","hint":"Teste : si tu peux le remplacer par « lui », c’est le pronom invariable.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_3","deckId":"orthographe","front":"Quelque / quel que","back":"Quelque (en un mot) précède un nom ou un adjectif. Quel que (en deux mots, variable) précède le verbe « être » au subjonctif, avec un sujet entre les deux.","hint":"« Quelques amis » / « Quels que soient ses efforts ».","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_4","deckId":"orthographe","front":"Sans / s’en / sens","back":"Sans : préposition de manque (« sans argent »). S’en : pronominal + « en » (« il s’en va »). Sens : du verbe sentir, ou le sens d’un mot.","hint":"« Il s’en va sans un sens précis » : les trois dans une phrase pour s’entraîner.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_5","deckId":"orthographe","front":"Peut-être / peut être","back":"Peut-être (avec trait d’union) est un adverbe de doute. Peut être (sans trait d’union) est le verbe pouvoir + être.","hint":"« Il peut-être en retard » est faux ; on écrit « il peut être en retard » (sans trait d’union) ou « il est peut-être en retard ».","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_6","deckId":"orthographe","front":"Tout / tous / toute / toutes","back":"Tout est adverbe (invariable) devant un adjectif féminin commençant par une consonne, sinon il s’accorde comme déterminant/pronom.","hint":"« Elle est toute contente » (adverbe, accord par exception) mais « elle est tout étonnée » (devant une voyelle, invariable).","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_7","deckId":"orthographe","front":"Accord du participe passé avec « avoir »","back":"Le participe passé conjugué avec « avoir » ne s’accorde pas avec le sujet, mais avec le COD s’il est placé avant le verbe.","hint":"« Les lettres que j’ai écrites » (COD « que » placé avant, accord) / « J’ai écrit des lettres » (COD après, pas d’accord).","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_8","deckId":"orthographe","front":"Accord du participe passé avec « être »","back":"Le participe passé conjugué avec « être » s’accorde toujours avec le sujet du verbe.","hint":"« Elles sont parties » : accord au féminin pluriel avec « elles ».","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_9","deckId":"orthographe","front":"Accord des verbes pronominaux","back":"Le participe passé s’accorde avec le sujet, sauf si le verbe a un COD placé après (alors pas d’accord).","hint":"« Elle s’est lavée » (accord) / « Elle s’est lavé les mains » (« les mains » est COD placé après : pas d’accord).","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_10","deckId":"orthographe","front":"Différend / différent","back":"Différend (nom) : un désaccord, un litige. Différent (adjectif) : qui n’est pas identique.","hint":"« Ils ont eu un différend » / « Ils ont des avis différents ».","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_11","deckId":"orthographe","front":"Censé / sensé","back":"Censé : supposé faire quelque chose (« censé arriver à l’heure »). Sensé : qui a du bon sens, raisonnable.","hint":"Un raisonnement sensé n’est pas forcément censé se produire.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_12","deckId":"orthographe","front":"Davantage / d’avantage","back":"Davantage (un mot) signifie « plus ». D’avantage (deux mots) vient du nom « avantage ».","hint":"« Il travaille davantage » / « Cela ne lui apporte aucun avantage ».","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_13","deckId":"orthographe","front":"Notre / nôtre, votre / vôtre","back":"Notre/votre (sans accent circonflexe) sont des déterminants devant un nom. Le nôtre/le vôtre (avec accent) sont des pronoms qui remplacent un nom.","hint":"« Notre maison » (déterminant) / « La nôtre est plus grande » (pronom, avec accent et article).","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_14","deckId":"orthographe","front":"Près / prêt","back":"Près (de) indique la proximité. Prêt (à) signifie être préparé, ou désigne un emprunt.","hint":"« Il habite près d’ici » / « Il est prêt à partir » / « Il a fait un prêt à la banque ».","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_15","deckId":"orthographe","front":"Voir / voire","back":"Voir est le verbe de la vue. Voire signifie « et même », pour renforcer une idée.","hint":"« Je vais voir un film » / « C’est difficile, voire impossible ».","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_16","deckId":"orthographe","front":"Plutôt / plus tôt","back":"Plutôt exprime une préférence ou une approximation. Plus tôt est le contraire de « plus tard », lié au temps.","hint":"« Prends plutôt celui-ci » / « Viens plus tôt demain ».","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_17","deckId":"orthographe","front":"« Malgré que » : une faute courante","back":"« Malgré que » est très critiqué en français standard ; on lui préfère « bien que » ou « quoique », suivis du subjonctif. « Malgré » seul, en revanche, est correct devant un nom.","hint":"« Bien qu’il pleuve » (recommandé) plutôt que « malgré qu’il pleuve ».","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_18","deckId":"orthographe","front":"Au temps pour moi / autant pour moi","back":"L’expression d’origine, issue du vocabulaire militaire, s’écrit « au temps pour moi ». « Autant pour moi » est une déformation très répandue, tolérée à l’oral.","hint":"À l’écrit soigné, « au temps pour moi » reste la forme recommandée par l’Académie française.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_orthographe_19","deckId":"orthographe","front":"Résonner / raisonner","back":"Résonner : produire un écho, un son qui se prolonge. Raisonner : réfléchir logiquement, ou faire entendre raison à quelqu’un.","hint":"« Sa voix résonne dans la salle » / « Il faut raisonner calmement ».","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_0","deckId":"geopolitique","front":"G7 vs G20","back":"Le G7 réunit 7 grandes puissances économiques occidentales (dont la France). Le G20 les inclut et y ajoute les grandes puissances émergentes (Chine, Inde, Brésil, Afrique du Sud…).","hint":"Le G20 représente environ 85 % du PIB mondial.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_1","deckId":"geopolitique","front":"Les BRICS","back":"Un groupe de grandes puissances émergentes né du Brésil, de la Russie, de l’Inde, de la Chine et de l’Afrique du Sud, qui s’est élargi à de nouveaux membres depuis 2024.","hint":"Le groupe cherche à peser face aux institutions dominées par les pays occidentaux.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_2","deckId":"geopolitique","front":"L’OTAN et l’article 5","back":"Une alliance militaire née en 1949 entre pays nord-américains et européens. L’article 5 pose le principe de défense collective : une attaque contre un membre est considérée comme une attaque contre tous.","hint":"Le siège de l’OTAN se trouve à Bruxelles.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_3","deckId":"geopolitique","front":"L’élargissement récent de l’OTAN","back":"La Finlande a rejoint l’OTAN en 2023 et la Suède en 2024, mettant fin à des décennies de non-alignement militaire de ces deux pays.","hint":"Une conséquence directe du changement de perception du risque en Europe du Nord.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_4","deckId":"geopolitique","front":"Le Conseil de sécurité de l’ONU","back":"15 membres, dont 5 permanents avec droit de veto : États-Unis, Russie, Chine, France, Royaume-Uni. Les 10 autres sont élus pour 2 ans.","hint":"Un seul veto d’un membre permanent suffit à bloquer une résolution, même si tous les autres votent pour.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_5","deckId":"geopolitique","front":"FMI vs Banque mondiale","back":"Le FMI aide les États en difficulté de balance des paiements avec des prêts sous conditions. La Banque mondiale finance des projets de développement à plus long terme.","hint":"Les deux ont été créées en 1944, lors des accords de Bretton Woods.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_6","deckId":"geopolitique","front":"L’OMC","back":"L’Organisation Mondiale du Commerce fixe les règles du commerce international et arbitre les différends commerciaux entre États membres.","hint":"Contrairement au FMI, elle ne prête pas d’argent : elle régule les échanges.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_7","deckId":"geopolitique","front":"La multipolarité","back":"Un monde où le pouvoir se répartit entre plusieurs grandes puissances, par opposition à un monde unipolaire dominé par une seule (les États-Unis après 1991).","hint":"La montée de la Chine et le retour de la Russie sur la scène militaire illustrent ce basculement.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_8","deckId":"geopolitique","front":"Soft power vs hard power","back":"Le hard power impose par la contrainte (militaire, économique). Le soft power influence par l’attractivité (culture, valeurs, diplomatie).","hint":"Le cinéma américain ou la gastronomie française sont souvent cités comme des outils de soft power.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_9","deckId":"geopolitique","front":"La guerre en Ukraine : repères","back":"La Russie annexe la Crimée en 2014, puis lance une invasion à grande échelle de l’Ukraine le 24 février 2022.","hint":"Cette guerre a relancé les débats sur la dépendance énergétique de l’Europe et la défense européenne.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_10","deckId":"geopolitique","front":"Taïwan et le statu quo","back":"La Chine considère Taïwan comme une province qui doit être réunifiée, y compris par la force si nécessaire. Les États-Unis maintiennent une « ambiguïté stratégique » sur leur soutien militaire en cas d’attaque.","hint":"Taïwan domine la production mondiale des semi-conducteurs les plus avancés, un enjeu économique majeur.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_11","deckId":"geopolitique","front":"Israël-Palestine : repères historiques","back":"1948 : création de l’État d’Israël. 1993 : accords d’Oslo, qui posent (sans l’achever) le principe d’une solution à deux États.","hint":"Un conflit ancien, avec de nombreux épisodes de guerre et de négociations depuis 1948.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_12","deckId":"geopolitique","front":"Le Sahel : évolution récente","back":"Plusieurs coups d’État (Mali, Burkina Faso, Niger, entre 2020 et 2023) ont conduit au retrait des forces militaires françaises de la région et à un rapprochement de ces pays avec la Russie.","hint":"Ces trois pays ont formé l’Alliance des États du Sahel (AES), en rupture avec la CEDEAO.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_13","deckId":"geopolitique","front":"Les puissances nucléaires officielles","back":"Reconnues par le traité de non-prolifération (TNP) : États-Unis, Russie, Chine, France, Royaume-Uni. D’autres possèdent l’arme sans l’avoir signé : Inde, Pakistan, Corée du Nord (qui a testé), et Israël (jamais officiellement confirmé).","hint":"Le TNP vise à limiter la prolifération, mais ne l’a jamais totalement empêchée.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_14","deckId":"geopolitique","front":"Les sanctions économiques","back":"Des mesures prises par un ou plusieurs États pour faire pression sur un autre : gel d’avoirs, interdiction d’exporter certains biens, exclusion de systèmes financiers internationaux.","hint":"Leur efficacité réelle est régulièrement débattue par les économistes.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_15","deckId":"geopolitique","front":"La cyberguerre et la guerre hybride","back":"Des actions hostiles menées sans déclaration de guerre classique : cyberattaques, désinformation, ingérence électorale, sabotage économique.","hint":"Difficile à attribuer avec certitude à un État, ce qui complique la réponse diplomatique.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_16","deckId":"geopolitique","front":"Le Sud global","back":"Une expression désignant les pays historiquement moins industrialisés (Afrique, Asie, Amérique latine), qui revendiquent une plus grande place dans la gouvernance mondiale.","hint":"Le terme ne correspond pas à une organisation formelle, plutôt à une posture diplomatique commune.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_17","deckId":"geopolitique","front":"La souveraineté numérique","back":"La capacité d’un État ou d’un bloc (comme l’UE) à maîtriser ses infrastructures, ses données et ses technologies numériques, sans dépendre entièrement d’acteurs étrangers.","hint":"Le RGPD européen est souvent cité comme un outil de souveraineté numérique.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_18","deckId":"geopolitique","front":"Un État failli","back":"Un État qui ne parvient plus à assurer ses fonctions de base : sécurité, justice, services publics sur une partie ou la totalité de son territoire.","hint":"Ce vide laisse souvent la place à des groupes armés non étatiques.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_geopolitique_19","deckId":"geopolitique","front":"Une zone d’influence","back":"Un territoire ou une région où une grande puissance exerce une influence prépondérante, sans nécessairement l’occuper militairement.","hint":"Une notion clé pour comprendre les tensions entre grandes puissances autour de certaines régions frontalières.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_biais_0","deckId":"biais","front":"L’aversion à la perte","back":"On ressent la douleur d’une perte plus fortement que le plaisir d’un gain équivalent.","hint":"Explique pourquoi beaucoup gardent trop longtemps une action qui baisse plutôt que de vendre.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_biais_1","deckId":"biais","front":"Le biais de confirmation","back":"Chercher et retenir les informations qui confirment ce qu’on pense déjà, en ignorant le reste.","hint":"Un investisseur convaincu d’un titre ne lira que les analyses qui vont dans son sens.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_biais_2","deckId":"biais","front":"Le biais d’ancrage","back":"Se fier excessivement à la première information reçue pour juger la suite.","hint":"Le prix d’achat d’une action sert souvent d’ancre, même s’il n’a plus de sens pour décider de la garder.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_biais_3","deckId":"biais","front":"L’excès de confiance (overconfidence)","back":"Surestimer sa propre capacité à prédire ou battre le marché.","hint":"La majorité des investisseurs particuliers se croient meilleurs que la moyenne, ce qui est statistiquement impossible.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_biais_4","deckId":"biais","front":"L’effet Dunning-Kruger","back":"Les moins compétents dans un domaine ont tendance à surestimer le plus leur compétence.","hint":"Plus on apprend un sujet, plus on prend conscience de tout ce qu’on ignore encore.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_biais_5","deckId":"biais","front":"La comptabilité mentale (mental accounting)","back":"Traiter différemment le même euro selon la « case mentale » où on le range (salaire, prime, gain au jeu).","hint":"Un gain « facile » est souvent dépensé plus vite qu’un salaire, alors que l’argent a la même valeur.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_biais_6","deckId":"biais","front":"L’effet de disposition","back":"Vendre trop tôt les actions gagnantes et garder trop longtemps les perdantes.","hint":"Contraire à la logique rationnelle qui voudrait couper les pertes et laisser courir les gains.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_biais_7","deckId":"biais","front":"Le biais de statu quo","back":"Préférer ne rien changer, même quand une autre option serait objectivement meilleure.","hint":"Explique pourquoi beaucoup gardent un contrat ou un placement clairement sous-optimal par simple inertie.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_biais_8","deckId":"biais","front":"Le biais de récence","back":"Accorder trop d’importance aux événements récents dans ses prévisions.","hint":"Après une forte hausse des marchés, on a tendance à croire que ça va continuer indéfiniment.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_biais_9","deckId":"biais","front":"Le biais domestique (home bias)","back":"Investir de façon disproportionnée dans les entreprises de son propre pays, par familiarité plutôt que par logique.","hint":"Réduit la diversification et donc augmente le risque global du portefeuille.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_biais_10","deckId":"biais","front":"Le comportement moutonnier (herding)","back":"Suivre les décisions de la majorité plutôt que sa propre analyse.","hint":"Amplifie les bulles spéculatives et les krachs.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_biais_11","deckId":"biais","front":"Le biais du coût irrécupérable (sunk cost fallacy)","back":"Continuer un projet ou garder un placement à cause de l’argent déjà investi, plutôt que de juger la situation actuelle.","hint":"L’argent déjà dépensé ne devrait jamais influencer une décision future.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_biais_12","deckId":"biais","front":"Le biais de disponibilité","back":"Juger la probabilité d’un événement selon la facilité avec laquelle des exemples nous viennent à l’esprit.","hint":"Un krach récent et médiatisé fait paraître un nouveau krach plus probable qu’il ne l’est réellement.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_biais_13","deckId":"biais","front":"L’illusion de contrôle","back":"Surestimer sa capacité à influencer des résultats en réalité dus au hasard ou au marché.","hint":"Fréquente chez les traders qui pensent maîtriser la volatilité à court terme.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_biais_14","deckId":"biais","front":"L’aversion au regret","back":"Éviter une décision par peur de regretter un mauvais résultat, plus que par analyse rationnelle du risque.","hint":"Peut pousser à ne jamais investir, ce qui est aussi un choix, souvent coûteux à long terme.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_biais_15","deckId":"biais","front":"L’effet de cadrage (framing effect)","back":"La même information, présentée différemment, change la décision prise.","hint":"« 90 % de survie » et « 10 % de mortalité » disent la même chose mais influencent différemment.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_biais_16","deckId":"biais","front":"L’heuristique de représentativité","back":"Juger une situation en la comparant à un stéréotype plutôt qu’aux vraies probabilités.","hint":"Penser qu’une entreprise « qui a l’air sérieuse » est forcément un bon investissement, sans vérifier les chiffres.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_immoassur_0","deckId":"immoassur","front":"Les frais de notaire","back":"En réalité surtout des taxes reversées à l’État et aux collectivités. Environ 7 à 8 % dans l’ancien, 2 à 3 % dans le neuf.","hint":"La rémunération réelle du notaire ne représente qu’une petite partie de ces frais.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_immoassur_1","deckId":"immoassur","front":"Le DPE","back":"Diagnostic de Performance Énergétique : note de A (économe) à G (passoire thermique) sur la consommation d’un logement.","hint":"Un mauvais DPE peut aujourd’hui limiter la location ou faire baisser le prix de vente.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_immoassur_2","deckId":"immoassur","front":"Crédit in fine vs amortissable","back":"Amortissable : on rembourse capital et intérêts chaque mois. In fine : on ne paie que les intérêts, le capital est remboursé en une fois à la fin.","hint":"L’in fine est surtout utilisé pour l’investissement locatif, avec un avantage fiscal potentiel.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_immoassur_3","deckId":"immoassur","front":"L’apport personnel","back":"La somme que l’emprunteur finance sans crédit, en plus du prêt.","hint":"Un apport d’au moins 10 % couvre en général les frais de notaire et de dossier.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_immoassur_4","deckId":"immoassur","front":"Le taux d’endettement maximum","back":"Recommandé à 35 % des revenus, assurance de prêt comprise, par le Haut Conseil de stabilité financière.","hint":"Au-delà, l’accès au crédit devient nettement plus difficile.","detail":"","tags":[],"repetitions" /* Answer checking for "Écrire" */
const STOP = new Set('le la les un une des de du d l et ou a au aux en dans sur par pour avec sans ce ces cet cette est sont qui que quoi dont se sa son ses leur leurs plus moins ne pas the of and or to in is are'.split(' '));
const normAnswer = s => fold(stripHtml(s)).replace(/[^a-z0-9]+/g, ' ').trim();
function checkAnswer(typed, correctHtml) {
    const t = normAnswer(typed), c = normAnswer(correctHtml);
    if (!t) return { verdict: 'bad', score: 0 };
    const cWords = c.split(' ').filter(Boolean);
    if (cWords.length <= 6) {
        const sim = 1 - levenshtein(t, c) / Math.max(t.length, c.length, 1);
        const contains = c.length >= 3 && (t.includes(c) || (t.length >= 4 && c.includes(t) && t.length / c.length > 0.6));
        const score = contains ? Math.max(sim, 0.9) : sim;
        return { verdict: score >= 0.85 ? 'ok' : score >= 0.6 ? 'close' : 'bad', score };
    }
    const keys = [...new Set(cWords.filter(w => w.length >= 4 && !STOP.has(w)))];
    if (!keys.length) return { verdict: t === c ? 'ok' : 'close', score: t === c ? 1 : 0.5 };
    const tWords = t.split(' ');
    const found = keys.filter(k => tWords.some(w => w === k || (k.length >= 5 && w.length >= 4 && levenshtein(w, k) <= 1) || (w.length >= 5 && k.startsWith(w.slice(0, 5)))));
    const score = found.length / keys.length;
    return { verdict: score >= 0.7 ? 'ok' : score >= 0.35 ? 'close' : 'bad', score, found, keys };
}

/* ============================================================
   Application
   ============================================================ */
class SuperAnki {
    constructor() {
        this.data = null;
        this.view = 'dashboard';
        this.ui = { deck: 'all', filter: 'all', search: '', sort: 'auto', limit: 60, selMode: false, sel: new Set() };
        this.session = null;
        this.modals = [];
        this.saveTimer = null;
        this.editorRange = null;
        this.imageTarget = null;
        this.saveErrorShown = false;
        this.searchCache = new Map();
        this.cfgCache = new Map();
        this.sigs = new Map(); this.dsigs = new Map();
        this.undoStack = []; this.redoStack = [];
        this.chartDefs = {};
        this.statsUi = { deck: 'all', fcRange: 31, fcCumul: true, rvRange: 30, rvTime: false, ivRange: '1m', hrRange: 30, btRange: 30, adRange: 30, calYear: new Date().getFullYear(), hidden: {} };
    }

    /* ---------- boot ---------- */
    async init() {
        injectSprite();
        this.bindGlobalEvents();
        await Storage.init();
        let data = null, source = 'seed';
        try {
            const stored = await Storage.load();
            if (stored) { data = normalizeState(stored); source = 'local'; }
        } catch (e) { console.error(e); }
        if (!data) {
            const legacy = Storage.legacy();
            if (legacy) { data = normalizeState(legacy); source = 'legacy'; }
        }
        if (!data || !data.cards.length && !data.decks.length) { data = seedState(); source = 'seed'; }
        this.data = data;
        this.applySettings();
        this.initSigs();
        this.checkStreak();
        this.writeNow();
        this.autoBackup(source);
        $('#boot').remove();
        this.go('dashboard');
        if (source === 'legacy') this.toast('Tes cartes et ta progression ont été récupérées', 'success');
        if (this.data.settings.cloudSync) Cloud.sync();
        else Cloud.setStatus('off');
    }

    serialize() {
        const { version, decks, cards, presets, stats, settings, revlog, deleted, updatedAt } = this.data;
        return JSON.stringify({ version, decks, cards, presets, stats, settings, revlog, deleted, updatedAt });
    }
    /* Change tracking: per-card modification times let two devices merge instead of overwriting each other */
    initSigs() {
        this.sigs = new Map(this.data.cards.map(c => [c.id, cardSig(c)]));
        this.dsigs = new Map([...this.data.decks.map(d => [d.id, deckSig(d)]), ...this.data.presets.map(x => [x.id, presetSig(x)])]);
    }
    detectChanges(now) {
        const d = this.data, seen = new Set();
        d.cards.forEach(c => {
            seen.add(c.id);
            const sig = cardSig(c);
            if (this.sigs.get(c.id) !== sig) { c.mod = now; this.sigs.set(c.id, sig); delete d.deleted[c.id]; }
        });
        [...this.sigs.keys()].forEach(id => { if (!seen.has(id)) { this.sigs.delete(id); d.deleted[id] = now; } });
        const seenD = new Set();
        d.decks.forEach(k => {
            seenD.add(k.id);
            const sig = deckSig(k);
            if (this.dsigs.get(k.id) !== sig) { k.mod = now; this.dsigs.set(k.id, sig); delete d.deleted[k.id]; }
        });
        d.presets.forEach(x => {
            seenD.add(x.id);
            const sig = presetSig(x);
            if (this.dsigs.get(x.id) !== sig) { x.mod = now; this.dsigs.set(x.id, sig); delete d.deleted[x.id]; }
        });
        [...this.dsigs.keys()].forEach(id => { if (!seenD.has(id)) { this.dsigs.delete(id); d.deleted[id] = now; } });
        const keys = Object.keys(d.deleted);
        if (keys.length > 6000) keys.sort((a, b) => d.deleted[a] - d.deleted[b]).slice(0, keys.length - 5000).forEach(k => delete d.deleted[k]);
    }
    save(sync = true) {
        this.data.updatedAt = Date.now();
        this.detectChanges(this.data.updatedAt);
        this.cfgCache.clear();
        clearTimeout(this.saveTimer);
        this.saveTimer = setTimeout(() => this.writeNow(), 250);
        if (sync) Cloud.schedulePush();
    }
    async writeNow() {
        clearTimeout(this.saveTimer);
        this.saveTimer = null;
        try {
            await Storage.save(this.serialize());
            this.saveErrorShown = false;
        } catch (e) {
            console.error(e);
            if (!this.saveErrorShown) {
                this.saveErrorShown = true;
                this.toast('Enregistrement impossible : stockage du navigateur plein ou bloqué. Exporte une sauvegarde.', 'error');
            }
        }
    }
    applyMerged(merged) {
        this.data = merged;
        this.searchCache.clear(); this.cfgCache.clear();
        this.initSigs();
        this.applySettings();
        this.checkStreak();
        this.writeNow();
        this.render();
    }
    replaceData(newData, sync = true) {
        this.data = newData;
        this.searchCache.clear(); this.cfgCache.clear();
        this.undoStack = []; this.redoStack = [];
        this.initSigs();
        this.applySettings();
        this.checkStreak();
        this.writeNow();
        if (sync) Cloud.schedulePush();
        if (this.session) this.endSession(false);
        this.render();
    }

    /* ---------- settings / theme ---------- */
    applySettings() {
        const s = this.data.settings;
        setRollover(s.rolloverHour);
        const resolved = s.theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'nuit' : 'clair') : s.theme;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.setProperty('--card-size', CARD_SIZES[s.cardSize] || CARD_SIZES.m);
        requestAnimationFrame(() => {
            const meta = $('meta[name="theme-color"]');
            if (meta) meta.content = getComputedStyle(document.body).getPropertyValue('--surface').trim() || '#ffffff';
        });
    }
    setSetting(key, value) {
        this.data.settings[key] = value;
        this.data.settings.settingsMod = Date.now();
        this.save();
        this.applySettings();
    }

    /* ---------- streak ---------- */
    checkStreak() {
        const st = this.data.stats, today = dayKey();
        this.rollSeen();
        if (!st.lastStudyDate || st.lastStudyDate === today) return;
        const gap = daysBetweenKeys(st.lastStudyDate, today);
        if (gap <= 1) return;
        const missed = gap - 1;
        if (st.streak > 0 && st.freezes >= missed) {
            st.freezes -= missed;
            st.lastStudyDate = dayKey(Date.now() - DAY);
            setTimeout(() => this.toast(`${plural(missed, 'gel de série utilisé')} : ta série de ${st.streak} j tient bon`, 'success', ic('snow')), 600);
        } else if (st.streak > 0) {
            setTimeout(() => this.toast(`Série de ${st.streak} j interrompue. On repart !`, 'warning', ic('flame')), 600);
            st.streak = 0;
        }
    }
    recordStudyDay() {
        const st = this.data.stats, today = dayKey();
        if (st.lastStudyDate === today) return;
        const gap = st.lastStudyDate ? daysBetweenKeys(st.lastStudyDate, today) : null;
        st.streak = gap === 1 ? st.streak + 1 : 1;
        st.lastStudyDate = today;
        st.longestStreak = Math.max(st.longestStreak, st.streak);
        if (st.streak > 0 && st.streak % 7 === 0 && st.freezes < 2) {
            st.freezes++;
            this.toast(`${st.streak} jours de suite ! +1 gel de série`, 'success', ic('snow'));
        }
        this.renderStreak();
    }
    recordReview(grade, seconds) {
        const st = this.data.stats, today = dayKey();
        st.history[today] = (st.history[today] || 0) + 1;
        st.timeByDay[today] = (st.timeByDay[today] || 0) + seconds;
        st.studySeconds += seconds;
        if (grade) st.gradeCounts[grade] = (st.gradeCounts[grade] || 0) + 1;
        st.hourly[new Date().getHours()]++;
        this.recordStudyDay();
    }

    /* ---------- data helpers ---------- */
    card(id) { return this.data.cards.find(c => c.id === id); }
    deck(id) { return this.data.decks.find(d => d.id === id); }
    descendantIds(id) {
        const out = [id];
        for (let i = 0; i < out.length; i++) this.data.decks.forEach(d => { if (d.parent === out[i] && !out.includes(d.id)) out.push(d.id); });
        return out;
    }
    deckChain(id) {
        const chain = []; let d = this.deck(id), n = 0;
        while (d && n++ < 20) { chain.unshift(d); d = d.parent ? this.deck(d.parent) : null; }
        return chain;
    }
    deckPath(id) { return this.deckChain(id).map(d => d.name).join(' › '); }
    deckDepth(id) { return Math.max(0, this.deckChain(id).length - 1); }
    deckLabel(d) { return `${d.emoji} ${this.deckPath(d.id)}`; }
    sortedDecks() {
        const by = new Map();
        this.data.decks.forEach(d => { const k = d.parent || ''; if (!by.has(k)) by.set(k, []); by.get(k).push(d); });
        const out = [], visit = k => (by.get(k) || []).sort((a, b) => a.name.localeCompare(b.name, 'fr', { sensitivity: 'base', numeric: true })).forEach(d => { out.push(d); visit(d.id); });
        visit('');
        return out;
    }
    cardsOf(deckId) {
        if (!deckId) return this.data.cards;
        const set = new Set(this.descendantIds(deckId));
        return this.data.cards.filter(c => set.has(c.deckId));
    }
    errorCards() { return this.data.cards.filter(c => c.errors > 0 && !c.suspended); }
    /* Study options: the "default" preset lives in the settings; other presets are assigned to decks
       (a deck inherits the preset of its nearest ancestor that has one). */
    presetIdFor(deckId) {
        const chain = this.deckChain(deckId);
        for (let i = chain.length - 1; i >= 0; i--) if (chain[i].preset) return chain[i].preset === '__default' ? '' : chain[i].preset;
        return '';
    }
    defaultOpts() { const o = {}; Object.keys(OPT_DEFAULTS).forEach(k => { o[k] = this.data.settings[k]; }); return o; }
    optsOfPreset(id) { const p = id && this.data.presets.find(x => x.id === id); return { ...this.defaultOpts(), ...(p ? p.opts : {}) }; }
    deckCfg(deckId) {
        let cfg = this.cfgCache.get(deckId);
        if (cfg) return cfg;
        cfg = buildCfg(this.optsOfPreset(this.presetIdFor(deckId)));
        this.cfgCache.set(deckId, cfg);
        return cfg;
    }
    defaultCfg() { return buildCfg(this.defaultOpts()); }
    cfgFor(card) { return this.deckCfg(card.deckId); }
    /* Daily limit set for one deck itself: "just today" > "this deck" > its preset */
    deckLimit(deck, key) {
        const l = deck.limits || {}, t = dayKey();
        if (l.today && l.today.date === t && l.today[key] !== undefined) return l.today[key];
        if (l[key] !== undefined) return l[key];
        return this.deckCfg(deck.id)[key];
    }
    /* Deck whose daily limit applies to this deck's cards (nearest deck with its own limit or preset), or null = global limit */
    limitOwner(deckId, key) {
        const chain = this.deckChain(deckId), t = dayKey();
        for (let i = chain.length - 1; i >= 0; i--) {
            const d = chain[i], l = d.limits || {};
            if (d.preset || l[key] !== undefined || (l.today && l.today.date === t && l.today[key] !== undefined)) return d.id;
        }
        return null;
    }
    logReview(card, grade, type, prevIvl, ms) {
        const log = this.data.revlog;
        log.push([Date.now(), card.id, grade, type, card.state === 'review' ? card.interval : 0, prevIvl || 0, Math.round(ms)]);
        if (log.length > REVLOG_MAX + 2000) log.splice(0, log.length - REVLOG_MAX);
    }
    countStatuses(cards) {
        const now = Date.now(), eod = endOfDay(now);
        const out = { new: 0, learn: 0, due: 0, mature: 0, susp: 0, buried: 0, total: cards.length };
        cards.forEach(c => { out[cardStatus(c, now, eod)]++; });
        return out;
    }
    rollSeen() {
        const st = this.data.stats, t = dayKey();
        ['newSeen', 'revSeen'].forEach(k => { if (!st[k] || st[k].date !== t) st[k] = { date: t, count: 0, by: {} }; });
    }
    newBudget() {
        this.rollSeen();
        return Math.max(0, this.data.settings.newPerDay - this.data.stats.newSeen.count);
    }
    /* Applies the global + per-deck daily limit to an ordered list of cards */
    applyLimit(list, key, seen, globalLeft) {
        const used = {}, out = [];
        for (const c of list) {
            if (out.length >= globalLeft) break;
            const owner = this.limitOwner(c.deckId, key);
            if (owner) {
                const left = this.deckLimit(this.deck(owner), key) - (seen.by[owner] || 0) - (used[owner] || 0);
                if (left <= 0) continue;
                used[owner] = (used[owner] || 0) + 1;
            }
            out.push(c);
        }
        return out;
    }
    studyPlan(deckIds, extraNew = 0) {
        const now = Date.now(), eod = endOfDay(now);
        this.rollSeen();
        const st = this.data.stats, set = deckIds ? new Set(deckIds.flatMap(id => this.descendantIds(id))) : null;
        const pool = this.data.cards.filter(c => !c.suspended && !(c.buriedUntil > now) && (!set || set.has(c.deckId)));
        const learning = pool.filter(c => c.state === 'learning' || c.state === 'relearning').map(c => ({ id: c.id, due: c.due }));
        const dueAll = pool.filter(c => c.state === 'review' && c.due <= eod).sort((a, b) => a.due - b.due);
        const reviews = this.applyLimit(dueAll, 'maxReviews', st.revSeen, Math.max(0, this.data.settings.maxReviews - st.revSeen.count));
        let fresh = pool.filter(c => c.state === 'new');
        fresh = this.data.settings.newOrder === 'random' ? shuffle(fresh) : fresh.sort((a, b) => a.created - b.created);
        const news = extraNew ? fresh.slice(0, extraNew) : this.applyLimit(fresh, 'newPerDay', st.newSeen, this.newBudget());
        return { reviews, news, learning, learningDue: learning.filter(l => l.due <= now).length, freshTotal: fresh.length, dueTotal: dueAll.length };
    }
    nextDueTime() {
        let min = Infinity;
        this.data.cards.forEach(c => { if (c.state !== 'new' && !c.suspended && c.due < min) min = c.due; });
        return min;
    }

    /* ============================================================
       Navigation & rendering
       ============================================================ */
    go(view, opts = {}) {
        if (this.session && view !== 'session') this.endSession(false);
        this.view = view;
        if (opts.deck !== undefined) { this.ui.deck = opts.deck; this.ui.limit = 60; }
        if (opts.filter !== undefined) this.ui.filter = opts.filter;
        this.render();
        window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
    }
    render() {
        ['dashboard', 'decks', 'stats', 'settings', 'session'].forEach(v => $(`#view-${v}`).classList.toggle('hidden', v !== this.view));
        $$('[data-nav]').forEach(b => b.classList.toggle('active', b.dataset.nav === this.view && !b.classList.contains('brand') && !b.classList.contains('streak-chip') && !b.classList.contains('sync-dot')));
        document.body.classList.toggle('in-session', this.view === 'session');
        this.renderStreak();
        this.renderSyncIndicator();
        if (this.view === 'dashboard') this.renderDashboard();
        else if (this.view === 'decks') this.renderDecks();
        else if (this.view === 'stats') this.renderStats();
        else if (this.view === 'settings') this.renderSettings();
    }
    renderStreak() {
        if (!this.data) return;
        const st = this.data.stats;
        const alive = st.lastStudyDate === dayKey();
        $('#streak-value').textContent = st.streak;
        const chip = $('#streak-chip');
        chip.classList.toggle('cold', !alive);
        chip.title = alive ? `Série : ${st.streak} j (révision du jour faite)` : `Série : ${st.streak} j. Révise aujourd'hui pour la prolonger !`;
    }
    renderSyncIndicator() {
        const el = $('#sync-indicator');
        if (!el || !this.data) return;
        const on = this.data.settings.cloudSync;
        el.classList.toggle('hidden', !on);
        el.classList.remove('ok', 'busy', 'err');
        if (on && ['ok', 'busy', 'err'].includes(Cloud.status)) el.classList.add(Cloud.status);
        el.title = { ok: 'Synchronisé avec le cloud', busy: 'Synchronisation...', err: 'Synchronisation impossible (hors ligne ?)', off: 'Synchronisation désactivée' }[Cloud.status] || 'Synchronisation cloud';
        if (this.view === 'settings') { const st = $('#sync-status'); if (st) st.textContent = el.title + (Cloud.status === 'err' && Cloud.lastError ? ` : ${Cloud.lastError}` : '') + (Cloud.lastSync ? ` · dernière synchro ${fmtAgo(Cloud.lastSync)}` : ''); }
    }

    /* ---------- Dashboard ---------- */
    renderDashboard() {
        const d = this.data, now = Date.now();
        const counts = this.countStatuses(d.cards);
        const plan = this.studyPlan(null);
        const dueCount = plan.reviews.length + plan.learningDue;
        const toStudy = dueCount + plan.news.length;
        const h = new Date().getHours();
        const hello = h < 5 ? 'Bonne nuit' : h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir';
        let sub;
        if (toStudy > 0) {
            const parts = [];
            if (dueCount) parts.push(`<b>${plural(dueCount, 'carte')} à revoir</b>`);
            if (plan.news.length) parts.push(`<b>${plural(plan.news.length, 'nouvelle carte', 'nouvelles cartes')}</b>`);
            sub = `Au programme aujourd'hui : ${parts.join(' et ')}.`;
        } else {
            const next = this.nextDueTime();
            sub = `Tout est à jour, bravo ! 🎉 ${next < Infinity ? `Prochaine révision ${fmtRelativeFuture(next, now)}.` : ''}`;
        }
        const extra = toStudy === 0 && plan.freshTotal > 0
            ? `<button class="btn btn-hero-ghost" data-action="extra-new">${ic('plus')}10 nouvelles de plus</button>` : '';
        const pct = k => (counts.total ? Math.round(counts[k] / counts.total * 100) : 0);
        const chronoBest = d.stats.chronoBest[d.settings.chronoDuration] || 0;

        $('#view-dashboard').innerHTML = `
        <div class="stack">
            <div class="hero">
                <div class="hero-inner">
                    <div>
                        <span class="hero-kicker">${hello} 👋</span>
                        <h2 class="hero-title">Prêt pour ta révision ?</h2>
                        <p class="hero-sub">${sub}</p>
                    </div>
                    <div class="hero-actions">
                        ${toStudy > 0
                            ? `<button class="btn btn-lg btn-hero" data-action="study" data-deck="">${ic('play')}Réviser (${toStudy})</button>`
                            : `<button class="btn btn-lg btn-hero" data-action="practice-all">${ic('repeat')}S'entraîner</button>`}
                        ${extra || `<button class="btn btn-lg btn-hero-ghost" data-action="new-card">${ic('plus')}Nouvelle carte</button>`}
                    </div>
                </div>
            </div>

            <div class="status-grid">
                ${['new', 'learn', 'due', 'mature'].map(k => `
                <button class="panel status-tile" style="--c:${STATUS[k].color}" data-action="goto-filter" data-filter="${k}">
                    <div class="top"><span class="status-ico">${ic(STATUS[k].icon)}</span><span class="tiny faint">${pct(k)}%</span></div>
                    <div><div class="status-num">${counts[k]}</div><div class="status-label">${STATUS[k].label}</div></div>
                    <div class="bar"><i style="width:${pct(k)}%"></i></div>
                </button>`).join('')}
            </div>

            <div>
                <div class="section-head"><h3 class="section-title">Modes d'entraînement</h3><button class="link" data-action="custom-study">${ic('sliders')}Révisions personnalisées</button></div>
                <div class="mode-grid">
                    <button class="panel mode-tile" style="--c:#0ea5e9" data-action="mode" data-mode="write">
                        <span class="mode-ico">${ic('keyboard')}</span>
                        <span><h4>Écrire</h4><p>Tape la réponse, correction automatique</p></span>${ic('chevronRight', 'chev')}
                    </button>
                    <button class="panel mode-tile" style="--c:#8b5cf6" data-action="mode" data-mode="quiz">
                        <span class="mode-ico">${ic('quiz')}</span>
                        <span><h4>Quiz</h4><p>QCM à 4 choix${d.stats.quizBest ? ` · record ${d.stats.quizBest}%` : ''}</p></span>${ic('chevronRight', 'chev')}
                    </button>
                    <button class="panel mode-tile" style="--c:#f97316" data-action="mode" data-mode="chrono">
                        <span class="mode-ico">${ic('timer')}</span>
                        <span><h4>Chrono</h4><p>${chronoBest ? `Record : ${chronoBest} pts en ${d.settings.chronoDuration} s` : 'Un max de bonnes réponses, vite !'}</p></span>${ic('chevronRight', 'chev')}
                    </button>
                </div>
            </div>

            <div>
                <div class="section-head">
                    <h3 class="section-title">Tes paquets</h3>
                    <button class="link" data-nav="decks">Gérer ${ic('chevronRight')}</button>
                </div>
                ${d.decks.length ? `<div class="deck-grid">${this.dashboardDeckCards()}</div>`
                    : `<div class="panel empty">${ic('layers')}<p>Aucun paquet pour l'instant.</p><button class="btn btn-primary" style="margin-top:14px" data-action="new-deck">${ic('folderPlus')}Créer un paquet</button></div>`}
            </div>
        </div>`;
    }
    dashboardDeckCards() {
        const now = Date.now(), eod = endOfDay(now);
        const budget = this.newBudget();
        const rows = this.sortedDecks().filter(d => !d.parent).map(deck => {
            const cards = this.cardsOf(deck.id);
            const c = { new: 0, learn: 0, due: 0, mature: 0 };
            cards.forEach(x => { c[cardStatus(x, now, eod)]++; });
            return { deck, cards, c, todo: c.due + Math.min(c.new, budget) };
        }).sort((a, b) => (b.c.due > 0) - (a.c.due > 0) || 0);
        return rows.map(({ deck, cards, c, todo }) => {
            const total = cards.length || 1;
            const mastery = Math.round(c.mature / total * 100);
            return `
            <div class="panel deck-card" data-action="open-deck" data-deck="${esc(deck.id)}">
                <div class="deck-head">

    /* Search: accent-insensitive, AND between words, "exact phrase", -exclude, typo tolerant,
       plus Anki-style filters (deck:, tag:, is:, flag:, prop:, added:, rated:, front:, back:, type:) */
    parseQuery(q) {
        const out = { terms: [], phrases: [], excludes: [], filters: [] };
        const KEYS = ['deck', 'tag', 'is', 'flag', 'prop', 'added', 'rated', 'front', 'back', 'type', 'kind'];
        const re = /(-?)(?:(\w+):)?(?:"([^"]*)"?|(\S+))/g;
        let m;
        while ((m = re.exec(q))) {
            const neg = !!m[1], key = m[2] ? m[2].toLowerCase() : null, quoted = m[3], bare = m[4];
            if (key && KEYS.includes(key)) { const val = quoted !== undefined ? quoted : bare; if (val) out.filters.push({ neg, key, val: fold(val) }); continue; }
            if (quoted !== undefined && !key) { const p = fold(quoted).trim(); if (p) (neg ? out.excludes : out.phrases).push(p); continue; }
            const t = fold((key ? `${key}:` : '') + (quoted !== undefined ? quoted : bare)).replace(/^[^\p{L}\p{N}#]+|[^\p{L}\p{N}]+$/gu, '');
            if (!t) continue;
            (neg ? out.excludes : out.terms).push(t.replace(/^#/, ''));
        }
        out.empty = !out.terms.length && !out.phrases.length && !out.excludes.length && !out.filters.length;
        return out;
    }
    matchFilter(c, f, ctx) {
        const v = f.val;
        let ok = false;
        switch (f.key) {
            case 'deck': ok = fold(this.deckPath(c.deckId)).includes(v); break;
            case 'tag': ok = v === 'none' ? !c.tags.length : c.tags.some(t => fold(t) === v || fold(t).startsWith(v)); break;
            case 'flag': ok = c.flag === Number(v); break;
            case 'type': case 'kind': ok = c.kind === v || (v === 'reversed' && c.kind === 'rev'); break;
            case 'front': ok = fold(stripHtml(c.front)).includes(v); break;
            case 'back': ok = fold(stripHtml(c.back)).includes(v); break;
            case 'added': ok = c.created >= ctx.now - Number(v) * DAY; break;
            case 'rated': { const n = Number(v); ctx.rated[n] = ctx.rated[n] || new Set(this.data.revlog.filter(r => r[0] >= ctx.now - n * DAY).map(r => r[1])); ok = ctx.rated[n].has(c.id); break; }
            case 'is': {
                const st = cardStatus(c, ctx.now, ctx.eod);
                ok = ({
                    due: st === 'due', new: c.state === 'new', learn: c.state === 'learning' || c.state === 'relearning', learning: c.state === 'learning' || c.state === 'relearning',
                    review: c.state === 'review', suspended: c.suspended, buried: c.buriedUntil > ctx.now, marked: c.marked, leech: c.tags.some(t => fold(t) === 'leech'),
                    mature: c.state === 'review' && c.interval >= MATURE_IVL, young: c.state === 'review' && c.interval < MATURE_IVL, flagged: c.flag > 0, error: c.errors > 0, errors: c.errors > 0
                })[v] === true;
                break;
            }
            case 'prop': {
                const m = /^(ivl|ease|lapses|reps|due|errors|s|d)(<=|>=|!=|=|<|>)(-?\d+(?:[.,]\d+)?)$/.exec(v.replace(/\s/g, ''));
                if (!m) { ok = false; break; }
                let x, y = parseFloat(m[3].replace(',', '.'));
                if (m[1] === 'ivl') x = c.state === 'new' ? null : c.interval;
                else if (m[1] === 'ease') { x = c.ease; if (y > 10) y /= 100; }
                else if (m[1] === 'due') x = c.state === 'new' ? null : daysBetweenKeys(dayKey(ctx.now), dayKey(c.due));
                else if (m[1] === 's' || m[1] === 'd') { const fs = fsrsFromCard(c); x = fs ? fs[m[1]] : null; }
                else x = c[m[1] === 'lapses' ? 'lapses' : m[1]];
                if (x === null || x === undefined) { ok = false; break; }
                ok = { '<': x < y, '>': x > y, '<=': x <= y, '>=': x >= y, '=': x === y, '!=': x !== y }[m[2]];
                break;
            }
            default: ok = false;
        }
        return f.neg ? !ok : ok;
    }
    searchIndex(c) {
        const deck = this.deck(c.deckId);
        const key = `${c.front}\u0001${c.back}\u0001${c.hint}\u0001${c.detail}\u0001${c.tags.join(',')}\u0001${deck ? deck.name : ''}`;
        const hit = this.searchCache.get(c.id);
        if (hit && hit.key === key) return hit;
        const front = fold(stripHtml(c.front)), back = fold(stripHtml(c.back));
        const extra = fold(`${stripHtml(c.hint)} ${stripHtml(c.detail)} ${c.tags.join(' ')} ${deck ? deck.name : ''}`);
        const words = [...new Set(`${front} ${back} ${extra}`.split(/[^\p{L}\p{N}]+/u).filter(w => w.length >= 3))];
        const idx = { key, front, back, extra, all: `${front} \u0001 ${back} \u0001 ${extra}`, words };
        this.searchCache.set(c.id, idx);
        return idx;
    }
    matchCard(c, q, ctx) {
        const x = this.searchIndex(c);
        if (q.excludes.some(t => x.all.includes(t))) return null;
        if (q.phrases.some(p => !x.all.includes(p))) return null;
        if (q.filters.some(f => !this.matchFilter(c, f, ctx))) return null;
        let score = q.phrases.length * 4;
        const fuzzy = [];
        for (const t of q.terms) {
            const wordStart = new RegExp(`(^|[^\\p{L}\\p{N}])${t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`, 'u');
            if (x.front.includes(t)) score += 3 + (wordStart.test(x.front) ? 1 : 0);
            else if (x.back.includes(t)) score += 2 + (wordStart.test(x.back) ? 1 : 0);
            else if (x.extra.includes(t)) score += 1;
            else if (t.length >= 4) {
                const tol = t.length >= 7 ? 2 : 1;
                const w = x.words.find(w => (Math.abs(w.length - t.length) <= tol && levenshtein(w, t) <= tol)
                    || (t.length >= 5 && w.length > t.length && levenshtein(w.slice(0, t.length), t) <= 1));
                if (!w) return null;
                fuzzy.push(w);
                score += 0.5;
            } else return null;
        }
        return { score, fuzzy };
    }
    /* Returns Map(cardId -> match) for the current query over ALL cards, or null when no query */
    searchMatches() {
        const raw = this.ui.search.trim();
        if (!raw) return null;
        if (this._sm && this._sm.raw === raw && this._sm.n === this.data.cards.length && this._sm.at === this.data.updatedAt) return this._sm.map;
        const q = this.parseQuery(raw);
        const map = new Map();
        const ctx = { now: Date.now(), eod: endOfDay(), rated: {} };
        if (!q.empty) this.data.cards.forEach(c => { const m = this.matchCard(c, q, ctx); if (m) map.set(c.id, m); });
        else this.data.cards.forEach(c => map.set(c.id, { score: 0, fuzzy: [] }));
        this._sm = { raw, n: this.data.cards.length, at: this.data.updatedAt, map, q };
        return map;
    }
    filteredCards() {
        const ui = this.ui, now = Date.now(), eod = endOfDay(now);
        let list = ui.deck === 'all' ? this.data.cards : ui.deck === 'errors' ? this.errorCards() : this.cardsOf(ui.deck);
        const matches = this.searchMatches();
        const globalHits = matches ? matches.size : 0;
        if (matches) list = list.filter(c => matches.has(c.id));
        const statusCounts = { all: list.length, new: 0, learn: 0, due: 0, mature: 0, susp: 0, buried: 0 };
        const withStatus = list.map(c => { const s = cardStatus(c, now, eod); statusCounts[s]++; return { c, s }; });
        let rows = ui.filter === 'all' ? withStatus : withStatus.filter(r => r.s === ui.filter);
        const txt = c => { const x = this.searchIndex(c); return x.front.replace(/^[^\p{L}\p{N}]+/u, ''); };
        const cmp = (a, b) => a.localeCompare(b, 'fr', { ignorePunctuation: true });
        const sortKey = ui.sort === 'auto' ? (matches ? 'relevance' : 'recent') : ui.sort;
        const sorters = {
            relevance: (a, b) => matches.get(b.c.id).score - matches.get(a.c.id).score || cmp(txt(a.c), txt(b.c)),
            recent: (a, b) => b.c.created - a.c.created,
            alpha: (a, b) => cmp(txt(a.c), txt(b.c)),
            'alpha-rev': (a, b) => cmp(txt(b.c), txt(a.c)),
            due: (a, b) => (a.c.state === 'new') - (b.c.state === 'new') || a.c.due - b.c.due,
            hard: (a, b) => b.c.errors - a.c.errors || b.c.lapses - a.c.lapses || a.c.ease - b.c.ease
        };
        rows = [...rows].sort(sorters[sortKey] || sorters.recent);
        return { rows, statusCounts, globalHits, searching: !!matches };
    }
    highlightResults() {
        const sm = this._sm;
        if (!this.ui.search.trim() || !sm) return;
        const tokens = [...sm.q.terms, ...sm.q.phrases];
        sm.map.forEach(m => m.fuzzy.forEach(w => tokens.push(w)));
        const uniq = [...new Set(tokens.filter(t => t.length >= 1))].sort((a, b) => b.length - a.length);
        if (!uniq.length) return;
        const ACC = { a: 'aàâäáãå', e: 'eéèêë', i: 'iîïíì', o: 'oôöóòõ', u: 'uùûüú', c: 'cç', y: 'yÿ', n: 'nñ', "'": "'’" };
        const rx = new RegExp(uniq.map(t => [...t].map(ch => (ACC[ch] ? `[${ACC[ch]}]` : ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))).join('')).join('|'), 'giu');
        $$('#card-list .q, #card-list .a').forEach(root => {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) nodes.push(walker.currentNode);
            nodes.forEach(node => {
                const text = node.nodeValue;
                rx.lastIndex = 0;
                if (!rx.test(text)) return;
                rx.lastIndex = 0;
                const frag = document.createDocumentFragment();
                let last = 0, m;
                while ((m = rx.exec(text))) {
                    if (!m[0]) { rx.lastIndex++; continue; }
                    frag.append(text.slice(last, m.index));
                    const mk = document.createElement('mark'); mk.className = 'hl'; mk.textContent = m[0];
                    frag.append(mk);
                    last = m.index + m[0].length;
                }
                frag.append(text.slice(last));
                node.replaceWith(frag);
            });
        });
    }
