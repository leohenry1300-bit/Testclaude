titions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_hist_17","deckId":"hist","front":"Colonisation et décolonisation","back":"Les Européens dominent une grande partie du monde du XVe au XXe siècle. La plupart des colonies deviennent indépendantes entre 1945 et 1975.","hint":"Exemple : indépendance de l’Algérie en 1962.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_hist_18","deckId":"hist","front":"La naissance de l’islam","back":"622 : l’Hégire (départ de Mahomet de La Mecque vers Médine), début du calendrier musulman. Expansion rapide aux VIIe et VIIIe siècles.","hint":"Le calendrier hégirien compte à partir de 622.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_hist_19","deckId":"hist","front":"La christianisation de l’Europe","back":"Le christianisme devient religion officielle de l’Empire romain en 380, puis structure l’Europe médiévale (églises, monastères, calendrier).","hint":"Explique pourquoi tant de fêtes et de monuments sont chrétiens.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_0","deckId":"sci","front":"Masse vs poids","back":"Masse = quantité de matière (kg), elle ne change jamais. Poids = force de la gravité sur cette masse (newtons).","hint":"Sur la Lune, tu gardes ta masse mais ton poids est environ 6 fois plus faible.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_1","deckId":"sci","front":"Formule de la vitesse","back":"Vitesse = distance ÷ temps.","hint":"120 km en 2 h = 60 km/h.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_2","deckId":"sci","front":"Température vs chaleur","back":"Température = agitation moyenne des particules (°C). Chaleur = énergie transférée (joules).","hint":"Une baignoire tiède contient plus de chaleur qu’une tasse de café bouillant.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_3","deckId":"sci","front":"Watt, volt, ampère, wattheure","back":"Watt = puissance. Volt = tension. Ampère = intensité du courant. Wattheure = énergie (puissance × temps).","hint":"Image du tuyau d’eau : volt = pression, ampère = débit, watt = les deux combinés.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_4","deckId":"sci","front":"Formule de la puissance électrique","back":"Puissance (W) = tension (V) × intensité (A).","hint":"Prise 230 V × 10 A = 2 300 W, la limite d’un circuit standard.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_5","deckId":"sci","front":"La pression","back":"Force répartie sur une surface : pascal, bar. 1 bar ≈ pression atmosphérique.","hint":"Un pneu de voiture est gonflé autour de 2,2 à 2,5 bars.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_6","deckId":"sci","front":"Atome, molécule, élément","back":"Atome : brique de matière. Molécule : atomes liés (H₂O). Élément : type d’atome (hydrogène, oxygène).","hint":"L’eau est faite de molécules H₂O : 2 atomes d’hydrogène, 1 d’oxygène.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_7","deckId":"sci","front":"L’échelle du pH","back":"De 0 à 14 : 7 = neutre, moins de 7 = acide (citron ≈ 2), plus de 7 = basique (savon, eau de Javel).","hint":"pH signifie potentiel hydrogène.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_8","deckId":"sci","front":"Combustion vs oxydation","back":"Combustion : réaction rapide avec l’oxygène qui dégage chaleur et lumière. Oxydation : réaction avec l’oxygène, souvent lente (rouille, pomme qui brunit).","hint":"La rouille est une oxydation lente du fer.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_9","deckId":"sci","front":"La cellule","back":"La plus petite unité du vivant. Le corps humain en compte des dizaines de milliers de milliards.","hint":"Toutes les cellules (sauf certaines comme les globules rouges) contiennent de l’ADN.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_10","deckId":"sci","front":"ADN, gène, chromosome","back":"ADN : la molécule qui porte l’information. Gène : portion d’ADN qui code une fonction. Chromosome : ADN enroulé en paquet (23 paires chez l’humain).","hint":"Poupées russes : chromosome > ADN > gène.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_11","deckId":"sci","front":"Virus vs bactérie","back":"Bactérie : organisme vivant à une cellule, sensible aux antibiotiques. Virus : parasite qui a besoin d’une cellule hôte, insensible aux antibiotiques.","hint":"Angine bactérienne → antibiotique. Grippe (virus) → pas d’antibiotique.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_12","deckId":"sci","front":"Le système immunitaire","back":"L’armée du corps : globules blancs, anticorps, et une « mémoire » des microbes déjà rencontrés.","hint":"Le vaccin entraîne cette armée sans danger.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_13","deckId":"sci","front":"Hormones vs neurotransmetteurs","back":"Hormones : messagers chimiques par le sang, lents et durables (insuline, cortisol). Neurotransmetteurs : messagers entre neurones, très rapides (dopamine, sérotonine).","hint":"Hormone = courrier postal, neurotransmetteur = SMS.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_14","deckId":"sci","front":"Rôle du cœur et des poumons","back":"Le cœur pompe le sang. Les poumons apportent l’oxygène au sang et évacuent le CO₂.","hint":"Le cœur bat environ 70 fois par minute au repos.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_15","deckId":"sci","front":"Les trois états de la matière","back":"Solide, liquide, gaz (et le plasma comme 4e état).","hint":"Fusion = solide → liquide. Ébullition = liquide → gaz.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_16","deckId":"sci","front":"Vitesse de la lumière vs vitesse du son","back":"Lumière ≈ 300 000 km/s. Son ≈ 340 m/s.","hint":"C’est pourquoi on voit l’éclair avant d’entendre le tonnerre.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sci_17","deckId":"sci","front":"Énergie renouvelable ou non ?","back":"Renouvelables : solaire, éolien, hydraulique. Non renouvelables : pétrole, gaz, charbon, uranium.","hint":"En France, le nucléaire fournit environ les deux tiers de l’électricité.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sante_0","deckId":"sante","front":"Fréquence cardiaque au repos (adulte)","back":"60 à 100 battements par minute (les sportifs peuvent être plus bas).","hint":"Se prend au poignet ou au cou pendant 15 secondes × 4.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sante_1","deckId":"sante","front":"Tension artérielle normale","back":"Environ 12/8 (120/80 mmHg). Au-dessus de 14/9 : hypertension.","hint":"Le premier chiffre est la pression quand le cœur se contracte.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sante_2","deckId":"sante","front":"Température du corps","back":"Environ 37 °C. La fièvre commence vers 38 °C.","hint":"Variation normale dans la journée.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sante_3","deckId":"sante","front":"Combien dormir ?","back":"Un adulte a besoin de 7 à 9 heures par nuit.","hint":"Pendant le sommeil, le corps se répare et le cerveau consolide la mémoire.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sante_4","deckId":"sante","front":"Protéines, glucides, lipides : rôles","back":"Protéines : construire (muscles). Glucides : carburant rapide. Lipides : réserves d’énergie, hormones.","hint":"Les trois sont nécessaires, il ne faut pas en supprimer un.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sante_5","deckId":"sante","front":"Calories par gramme","back":"Glucides : 4 kcal/g. Protéines : 4. Lipides : 9. Alcool : 7.","hint":"Les lipides sont deux fois plus caloriques.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sante_6","deckId":"sante","front":"Ce que « calorie » désigne sur un emballage","back":"La kilocalorie (kcal) : 1 kcal = 1 000 calories. Besoin adulte moyen : 2 000 à 2 500 kcal par jour.","hint":"Ces valeurs varient selon la taille, le poids, l’activité.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sante_7","deckId":"sante","front":"Combien boire par jour ?","back":"Environ 1,5 L d’eau (plus en cas de sport ou de chaleur).","hint":"Quand tu as soif, tu es déjà légèrement déshydraté.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sante_8","deckId":"sante","front":"Repères de santé publique sur l’alcool","back":"Au maximum 2 verres par jour, 10 par semaine, et des jours sans.","hint":"Un verre standard contient environ 10 g d’alcool pur.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sante_9","deckId":"sante","front":"Nicotine et caféine","back":"Nicotine : très addictive (tabac, vapotage). Caféine : stimulant qui reste 5 à 6 h dans le corps.","hint":"Un café tardif peut abîmer le sommeil.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sante_10","deckId":"sante","front":"Symptôme, maladie, diagnostic","back":"Symptôme : ce que tu ressens. Maladie : le problème sous-jacent. Diagnostic : l’identification de la maladie par un médecin.","hint":"Ne pas confondre : la fièvre est un symptôme, pas une maladie.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sante_11","deckId":"sante","front":"Les antibiotiques soignent quoi ?","back":"Uniquement les infections bactériennes. Ils sont inutiles contre les virus (rhume, grippe, Covid).","hint":"Mal utilisés, ils créent des résistances.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sante_12","deckId":"sante","front":"Pourquoi les vaccins fonctionnent","back":"Ils montrent au corps une version inoffensive d’un microbe : le système immunitaire garde la mémoire pour réagir vite ensuite.","hint":"Comme un entraînement avant le match.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sante_13","deckId":"sante","front":"Activité physique : la recommandation OMS","back":"Au moins 150 minutes par semaine d’activité modérée pour un adulte.","hint":"Bénéfices : cœur, sommeil, humeur, mémoire.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_sante_14","deckId":"sante","front":"L’IMC","back":"Poids (kg) ÷ taille² (m²). Entre 18,5 et 25 = corpulence « normale ».","hint":"Un indicateur grossier : il ne distingue pas muscle et graisse.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_auto_0","deckId":"auto","front":"Contrôler la pression des pneus","back":"Une fois par mois, pneus FROIDS. La valeur idéale est indiquée sur l’étiquette (montant de porte ou trappe à carburant).","hint":"Ordre de grandeur : 2,2 à 2,5 bars.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_auto_1","deckId":"auto","front":"Voyant rouge vs orange","back":"Rouge : danger, arrête-toi dès que possible. Orange : alerte, à faire vérifier bientôt.","hint":"Comme un feu de circulation.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_auto_2","deckId":"auto","front":"Voyant d’huile allumé","back":"Pression d’huile insuffisante : coupe le moteur immédiatement, sinon risque de casse moteur.","hint":"Vérifie ensuite le niveau avec la jauge, voiture à plat et moteur froid.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_auto_3","deckId":"auto","front":"Voyant batterie","back":"Problème de charge (alternateur, courroie, batterie) : tu roules sur la réserve de la batterie.","hint":"Rends-toi vite dans un garage.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_auto_4","deckId":"auto","front":"Voyant de température rouge","back":"Surchauffe du moteur : arrête-toi, coupe, attends. N’ouvre jamais le bouchon du liquide de refroidissement à chaud.","hint":"Un moteur qui surchauffe peut casser le joint de culasse.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_auto_5","deckId":"auto","front":"Voyant moteur orange","back":"Défaut dans l’injection ou l’antipollution. Fixe : à vérifier vite. Clignotant : arrête-toi, urgence.","hint":"Ne pas ignorer, ça peut devenir cher.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_auto_6","deckId":"auto","front":"Changer une roue : les grandes étapes","back":"Frein à main, gilet et triangle → desserrer les écrous AVANT de lever → lever au cric sur le point d’appui → changer → resserrer en étoile → vérifier au sol.","hint":"Les écrous se desserrent quand la roue est encore au sol.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_auto_7","deckId":"auto","front":"Démarrer avec des câbles","back":"Rouge sur + (batterie à plat) → rouge sur + (donneuse) → noir sur − (donneuse) → noir sur une masse métallique de la voiture en panne.","hint":"La dernière connexion se fait loin de la batterie, à cause des étincelles.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_auto_8","deckId":"auto","front":"Essence vs diesel","back":"Essence : allumage par bougies. Diesel (gazole) : auto-inflammation par compression. Ne mélange JAMAIS les deux.","hint":"Se tromper de carburant : ne pas démarrer, ne pas redémarrer, faire vidanger.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_auto_9","deckId":"auto","front":"Contrôle technique","back":"Premier contrôle 4 ans après la 1re immatriculation, puis tous les 2 ans. Contre-visite dans les 2 mois en cas de défaut majeur.","hint":"Sans contrôle valide, tu risques une amende.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_auto_10","deckId":"auto","front":"Assurance au tiers vs tous risques","back":"Tiers : couvre uniquement les dégâts causés aux autres (minimum légal). Tous risques : couvre aussi ta voiture.","hint":"Intermédiaire : « tiers étendu » (vol, incendie, bris de glace).","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_auto_11","deckId":"auto","front":"Le bonus-malus","back":"Coefficient de départ 1. Chaque année sans accident responsable : × 0,95, jusqu’à 0,50. Accident responsable : × 1,25.","hint":"Plus ton coefficient est bas, moins tu paies.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_auto_12","deckId":"auto","front":"Cylindrée, puissance, couple","back":"Cylindrée : volume des cylindres (en L). Puissance : vitesse à laquelle le moteur travaille (kW ou ch). Couple : force de « poussée » (Nm).","hint":"Le couple donne la « pêche » à bas régime.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_auto_13","deckId":"auto","front":"CV fiscaux vs chevaux","back":"Les CV fiscaux servent à calculer le prix de la carte grise. Les chevaux (ch) mesurent la puissance réelle.","hint":"1 ch ≈ 0,736 kW.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_auto_14","deckId":"auto","front":"Boîte manuelle vs automatique","back":"Manuelle : tu gères embrayage et vitesses. Automatique : la boîte choisit. Un permis passé en boîte auto ne permet pas de conduire une manuelle.","hint":"Le permis manuel permet les deux.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_auto_15","deckId":"auto","front":"Distance de freinage : ordre de grandeur","back":"(vitesse ÷ 10)² en mètres sur sol sec. À 50 km/h : environ 25 m, à 100 km/h : 100 m.","hint":"À ça s’ajoute la distance de réaction, environ 1 seconde.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_maison_0","deckId":"maison","front":"Où se trouve le disjoncteur général ?","back":"Dans le tableau électrique (souvent à l’entrée). Le baisser coupe tout le logement.","hint":"Repère-le le jour où tu emménages, pas quand il y a un problème.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_maison_1","deckId":"maison","front":"Comment couper l’eau ?","back":"Ferme le robinet d’arrêt général (sous l’évier, près du compteur ou à l’entrée) : tourne dans le sens horaire.","hint":"En cas de fuite : coupe d’abord, cherche ensuite.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_maison_2","deckId":"maison","front":"Sens de vissage","back":"Sens horaire = serrer, sens anti-horaire = desserrer.","hint":"« Droite serre, gauche desserre ». Quelques exceptions existent (filetages inversés).","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_maison_3","deckId":"maison","front":"Vis, boulon, écrou","back":"Vis : filetée, se visse dans une matière. Boulon : tige filetée fixée par un écrou.","hint":"Boulon + écrou = assemblage qui traverse.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_maison_4","deckId":"maison","front":"Quelle cheville choisir ?","back":"Plâtre/placo : cheville à expansion ou à bascule. Brique/béton : cheville nylon. Le foret doit avoir le diamètre de la cheville.","hint":"Regarde toujours le mur avant d’acheter.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_maison_5","deckId":"maison","front":"Percer un mur proprement","back":"Marquer le point (ruban adhésif), foret adapté (béton : foret béton + percussion), percer droit.","hint":"Vérifie avec un détecteur qu’il n’y a pas de câble ou de tuyau.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_maison_6","deckId":"maison","front":"Le niveau à bulle","back":"Quand la bulle est entre les deux traits, la surface est parfaitement horizontale (ou verticale).","hint":"À utiliser avant de percer pour une étagère.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_maison_7","deckId":"maison","front":"Déboucher un évier","back":"Ventouse (bien couvrir l’orifice, un peu d’eau), sinon démonter et nettoyer le siphon.","hint":"Le siphon est la courbe qui retient l’eau et bloque les odeurs.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_maison_8","deckId":"maison","front":"Un robinet qui goutte","back":"Un joint ou une cartouche usé : coupe l’eau, démonte, remplace le joint.","hint":"Une goutte par seconde = plusieurs milliers de litres par an.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_maison_9","deckId":"maison","front":"À quoi sert un multimètre ?","back":"À mesurer la tension (V), le courant (A), la résistance (Ω) et tester la continuité (bip).","hint":"Avant toute intervention, vérifie que le circuit est coupé.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_maison_10","deckId":"maison","front":"Monter un meuble sans galère","back":"Lire toute la notice, trier les pièces, ne serrer à fond qu’à la fin.","hint":"Serrer trop tôt = pièces mal alignées.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_maison_11","deckId":"maison","front":"Détecteur de fumée","back":"Obligatoire dans chaque logement en France (DAAF).","hint":"Test régulier de la pile.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_cuisine_0","deckId":"cuisine","front":"Cuire des pâtes correctement","back":"Eau bouillante salée (environ 10 g de sel par litre), remuer au début, temps du paquet, goûter 1 à 2 min avant.","hint":"Pas d’huile dans l’eau : ça ne sert à rien.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_cuisine_1","deckId":"cuisine","front":"Cuire du riz blanc","back":"1 volume de riz pour 2 volumes d’eau, à couvert, feu doux 10 à 12 min, laisser reposer.","hint":"Rince-le avant pour enlever l’amidon.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_cuisine_2","deckId":"cuisine","front":"Temps de cuisson d’un œuf","back":"Dans l’eau bouillante : coque 3 min, mollet 6 min, dur 9 à 10 min. Puis eau froide.","hint":"L’eau froide arrête la cuisson et facilite l’écalage.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_cuisine_3","deckId":"cuisine","front":"Cuisson du poulet","back":"À cœur, le jus doit être clair (plus de rose), soit environ 74 °C.","hint":"Le poulet insuffisamment cuit risque la salmonelle.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_cuisine_4","deckId":"cuisine","front":"Cuisson d’un steak","back":"Saignant ≈ 50-55 °C à cœur, à point ≈ 55-60 °C, bien cuit ≈ 70 °C. Laisse-le reposer après cuisson.","hint":"Sors la viande du frigo 20 min avant.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_cuisine_5","deckId":"cuisine","front":"Saisir","back":"Cuire à feu vif pour créer une croûte dorée (réaction de Maillard).","hint":"Poêle très chaude, ne pas surcharger.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_cuisine_6","deckId":"cuisine","front":"Mijoter","back":"Cuire longtemps à feu très doux, avec de petits frémissements.","hint":"Typique des ragoûts et sauces.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_cuisine_7","deckId":"cuisine","front":"Rôtir","back":"Cuire au four à chaleur sèche, en arrosant régulièrement.","hint":"Poulet rôti, rôti de bœuf.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_cuisine_8","deckId":"cuisine","front":"Braiser","back":"Saisir puis cuire lentement à couvert avec un peu de liquide.","hint":"Osso buco, joue de bœuf.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_cuisine_9","deckId":"cuisine","front":"Blanchir","back":"Plonger brièvement dans l’eau bouillante puis dans l’eau glacée : fixe la couleur, facilite l’épluchage.","hint":"Exemple : pour peler des tomates.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_cuisine_10","deckId":"cuisine","front":"Réduire","back":"Faire évaporer un liquide pour l’épaissir et concentrer le goût.","hint":"Base des sauces.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_cuisine_11","deckId":"cuisine","front":"Déglacer","back":"Verser un liquide (vin, vinaigre, eau) dans la poêle chaude pour décoller les sucs et en faire une sauce.","hint":"Les sucs, c’est le goût.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_cuisine_12","deckId":"cuisine","front":"Vinaigrette de base","back":"1 part de vinaigre pour 3 parts d’huile, 1 c. à café de moutarde, sel, poivre.","hint":"La moutarde aide à faire l’émulsion.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_cuisine_13","deckId":"cuisine","front":"Pâte à crêpes de base","back":"Environ 250 g de farine, 4 œufs, 50 cl de lait, un peu d’huile.","hint":"Laisse reposer 30 min.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_cuisine_14","deckId":"cuisine","front":"Sauce tomate maison","back":"Suer oignon et ail, ajouter les tomates, sel, une pincée de sucre, mijoter 20 à 30 min.","hint":"Le sucre corrige l’acidité.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_cuisine_15","deckId":"cuisine","front":"Pourquoi ne pas tout cuire à feu vif ?","back":"Le feu vif brûle l’extérieur avant que l’intérieur soit cuit. Il sert à saisir, pas à tout cuire.","hint":"Adapte le feu au produit.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_resto_0","deckId":"resto","front":"Apéritif vs digestif","back":"Apéritif : avant le repas, pour ouvrir l’appétit. Digestif : après le repas (cognac, génépi, eau-de-vie).","hint":"Le mot « apéro » vient d’apéritif.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_resto_1","deckId":"resto","front":"Champagne : brut, sec, demi-sec, doux","back":"Du moins sucré au plus sucré : brut nature < extra-brut < brut < extra-sec < sec < demi-sec < doux.","hint":"Piège classique : « sec » est plus sucré que « brut ».","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_resto_2","deckId":"resto","front":"Accords vins et plats (règle de base)","back":"Blanc avec poisson et fruits de mer. Rouge avec viande rouge et fromage. Rosé pour l’apéro et les grillades.","hint":"Ce n’est qu’un point de départ : beaucoup d’exceptions.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_resto_3","deckId":"resto","front":"« La carte » vs « le menu »","back":"La carte : tout ce qu’on peut commander à la pièce. Le menu : une formule à prix fixe.","hint":"Faux ami avec l’anglais, où « menu » désigne la carte.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_resto_4","deckId":"resto","front":"Pourboire au restaurant en France","back":"Le service est compris dans le prix : le pourboire est facultatif (5 à 10 % si le service était excellent).","hint":"Un simple « merci » suffit toujours.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_resto_5","deckId":"resto","front":"Commander poliment","back":"« Bonjour, je vais prendre… », « s’il vous plaît », « qu’est-ce que vous me conseillez ? ».","hint":"Ne pas claquer des doigts : un regard et un signe de la main.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_resto_6","deckId":"resto","front":"Degrés d’alcool : repères","back":"Bière ≈ 5 %, vin ≈ 12 %, spiritueux ≈ 40 %. Le « degré » est le pourcentage d’alcool en volume.","hint":"Un verre de vin, une bière et un shot ont à peu près la même quantité d’alcool.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_resto_7","deckId":"resto","front":"Règles de base à table","back":"Attendre que tous soient servis, ne pas parler la bouche pleine, poser le téléphone, trinquer en regardant dans les yeux.","hint":"« Bon appétit » : on le dit quand tout le monde est servi.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_resto_8","deckId":"resto","front":"Formule ou à la carte ?","back":"Formule : entrée + plat ou plat + dessert (voire les 3) à prix fixe, souvent plus économique. À la carte : on choisit chaque plat, souvent plus cher.","hint":"Vérifie la formule du midi, elle est souvent avantageuse.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_0","deckId":"ent","front":"Chiffre d’affaires vs bénéfice","back":"CA = total des ventes. Bénéfice = ce qui reste après TOUTES les charges.","hint":"10 M€ de CA peuvent laisser seulement 0,3 M€ de bénéfice.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_1","deckId":"ent","front":"Marge brute","back":"Prix de vente − coût d’achat (ou de production).","hint":"Taux de marge = marge ÷ coût d’achat. Taux de marque = marge ÷ prix de vente.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_2","deckId":"ent","front":"Résultat net","back":"Ce qui reste à la fin : ventes − toutes charges − intérêts − impôts.","hint":"La fameuse « dernière ligne » du compte de résultat.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_3","deckId":"ent","front":"EBITDA (EBE)","back":"Bénéfice avant intérêts, impôts, dépréciations et amortissements : mesure la rentabilité de l’activité elle-même.","hint":"EBITDA = Earnings Before Interest, Taxes, Depreciation and Amortization.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_4","deckId":"ent","front":"Charges fixes vs variables","back":"Fixes : indépendantes du volume (loyer, salaires). Variables : évoluent avec l’activité (matières premières).","hint":"Plus les charges fixes sont hautes, plus il faut vendre pour être rentable.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_5","deckId":"ent","front":"Seuil de rentabilité","back":"Le CA à partir duquel l’entreprise ne perd plus d’argent : elle couvre toutes ses charges.","hint":"Formule : charges fixes ÷ taux de marge sur coûts variables.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_6","deckId":"ent","front":"BFR (besoin en fonds de roulement)","back":"Stocks + créances clients − dettes fournisseurs : l’argent à avancer pour faire tourner l’activité.","hint":"Plus les clients paient tard, plus le BFR augmente.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_7","deckId":"ent","front":"Trésorerie","back":"L’argent réellement disponible (banque, caisse) à un instant donné.","hint":"Une entreprise rentable peut faire faillite faute de trésorerie.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_8","deckId":"ent","front":"Capital social","back":"La somme apportée par les associés à la création, en échange de parts.","hint":"Il ne représente pas la valeur actuelle de l’entreprise.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_9","deckId":"ent","front":"Actionnaire","back":"Propriétaire d’une partie d’une société via des actions. Il gagne des dividendes et une éventuelle plus-value.","hint":"Il perd sa mise si l’entreprise fait faillite, pas plus.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_10","deckId":"ent","front":"Holding","back":"Société qui détient des participations dans d’autres sociétés.","hint":"Sert à piloter un groupe ou à organiser la détention d’un patrimoine professionnel.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_11","deckId":"ent","front":"Filiale vs participation","back":"Filiale : société contrôlée par une autre (plus de 50 % du capital). Participation : de 10 % à 50 %.","hint":"La société contrôlante est la « mère ».","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_12","deckId":"ent","front":"Fusion vs acquisition","back":"Acquisition : une entreprise en rachète une autre. Fusion : deux entreprises s’unissent en une seule.","hint":"M&A = Mergers & Acquisitions.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_13","deckId":"ent","front":"Levée de fonds","back":"Une start-up cède des parts à des investisseurs contre de l’argent (amorçage, série A, série B…).","hint":"Le fondateur est dilué, mais la start-up peut grandir plus vite.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_14","deckId":"ent","front":"Valorisation et « licorne »","back":"Valorisation = prix théorique de toute l’entreprise (prix de l’action × nombre d’actions). Licorne : start-up valorisée plus d’un milliard de dollars.","hint":"Exemple : Doctolib, BlaBlaCar.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_15","deckId":"ent","front":"PME, ETI, grande entreprise","back":"PME : moins de 250 salariés. ETI : de 250 à 4 999 salariés. Grande entreprise : 5 000 salariés ou plus.","hint":"Des critères de chiffre d’affaires s’ajoutent.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_16","deckId":"ent","front":"B2B vs B2C","back":"B2B : une entreprise vend à d’autres entreprises. B2C : elle vend aux particuliers.","hint":"Les cycles de vente B2B sont plus longs.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_ent_17","deckId":"ent","front":"ROI","back":"Retour sur investissement = (gain − coût) ÷ coût.","hint":"Dépenser 1 000 € en pub pour 3 000 € de gain : ROI = 200 %.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_mkt_0","deckId":"mkt","front":"KPI","back":"Indicateur clé de performance : un chiffre suivi pour piloter (taux de conversion, CA, panier moyen, NPS…).","hint":"Choisis peu de KPI, mais les bons.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_mkt_1","deckId":"mkt","front":"CRM","back":"Customer Relationship Management : logiciel ou stratégie pour gérer la relation avec les clients et prospects.","hint":"Exemples de logiciels : Salesforce, HubSpot.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_mkt_2","deckId":"mkt","front":"Prospection","back":"Aller chercher activement de nouveaux clients potentiels : appels, mails, salons, réseaux sociaux.","hint":"Un prospect n’est pas encore un client.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_mkt_3","deckId":"mkt","front":"Pipeline commercial","back":"Vue de toutes les opportunités classées par étape : prospect → contact → devis → négociation → signature.","hint":"Il permet de prévoir le CA à venir.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_mkt_4","deckId":"mkt","front":"Taux de conversion","back":"Le pourcentage de visiteurs ou prospects qui deviennent clients : clients ÷ visiteurs.","hint":"100 visiteurs, 3 achats = 3 %.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_mkt_5","deckId":"mkt","front":"Panier moyen","back":"CA ÷ nombre de commandes.","hint":"Augmenter le panier moyen = ventes additionnelles, packs, seuil de livraison gratuite.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_mkt_6","deckId":"mkt","front":"CAC et LTV","back":"CAC : coût d’acquisition d’un client. LTV : valeur totale d’un client sur sa durée de vie. Un bon ratio : LTV/CAC supérieur à 3.","hint":"Si acquérir un client coûte plus qu’il ne rapporte, le modèle est en danger.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_mkt_7","deckId":"mkt","front":"Le mix marketing (4P)","back":"Produit, Prix, Place (distribution), Promotion.","hint":"Pour les services, on ajoute 3 P : personnes, processus, preuves.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_mkt_8","deckId":"mkt","front":"SWOT","back":"Forces et Faiblesses (internes), Opportunités et Menaces (externes).","hint":"Un état des lieux avant de choisir une stratégie.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_mkt_9","deckId":"mkt","front":"Persona","back":"Un portrait-robot d’un client type (âge, besoins, freins, habitudes).","hint":"Il aide à choisir le message et le canal.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_mkt_10","deckId":"mkt","front":"SEO vs SEA","back":"SEO : référencement naturel, gratuit mais long. SEA : liens sponsorisés payants, immédiats.","hint":"Le SEO se construit, le SEA s’achète.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_mkt_11","deckId":"mkt","front":"Le tunnel de conversion","back":"Découverte → Intérêt → Décision → Achat → Fidélisation.","hint":"À chaque étape, on perd des gens : on cherche où ça fuit.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_banque_0","deckId":"banque","front":"La gestion de patrimoine","back":"Conseiller un client pour organiser, faire fructifier et transmettre l’ensemble de ses biens (immobilier, placements, entreprise).","hint":"Patrimoine = tout ce que tu possèdes moins ce que tu dois.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_banque_1","deckId":"banque","front":"La banque privée","back":"L’offre haut de gamme d’une banque pour une clientèle fortunée : conseil personnalisé, gestion sous mandat, ingénierie patrimoniale.","hint":"Les seuils d’entrée varient selon les établissements.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_banque_2","deckId":"banque","front":"CGP / CGPI","back":"Conseiller en Gestion de Patrimoine (CGPI si indépendant). Profession réglementée, avec plusieurs statuts (conseiller en investissements financiers, courtier en assurance…).","hint":"Il doit être immatriculé à l’ORIAS.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_banque_3","deckId":"banque","front":"Allocation d’actifs","back":"Répartition d’un portefeuille entre classes d’actifs : actions, obligations, immobilier, liquidités.","hint":"Elle explique une grande partie de la performance à long terme.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_banque_4","deckId":"banque","front":"Diversification","back":"Ne pas mettre tous ses œufs dans le même panier : répartir pour réduire le risque.","hint":"Elle réduit le risque sans annuler le rendement moyen.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_banque_5","deckId":"banque","front":"Risque, rendement, horizon","back":"Plus le rendement espéré est élevé, plus le risque l’est. Plus l’horizon est long, plus on peut se permettre du risque.","hint":"Les actions : horizon de 8 ans ou plus.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_banque_6","deckId":"banque","front":"KYC et profil investisseur","back":"Questionnaire sur la situation, les objectifs et la tolérance au risque, obligatoire avant tout conseil. KYC = Know Your Customer.","hint":"C’est aussi un outil de lutte contre le blanchiment.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_banque_7","deckId":"banque","front":"AMF et ACPR","back":"AMF : protège les épargnants et surveille les marchés financiers. ACPR : contrôle banques et assurances (rattachée à la Banque de France).","hint":"Deux régulateurs à ne pas confondre.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_banque_8","deckId":"banque","front":"TMI","back":"Tranche marginale d’imposition : le taux appliqué à ton dernier euro de revenu.","hint":"Plus elle est élevée, plus les dispositifs de défiscalisation ont d’intérêt.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_banque_9","deckId":"banque","front":"PFU (« flat tax »)","back":"Prélèvement forfaitaire unique : taux global unique (autour de 30 %) sur les revenus du capital comme dividendes, intérêts, plus-values.","hint":"Le contribuable peut opter pour le barème progressif.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_banque_10","deckId":"banque","front":"Le PER","back":"Plan d’Épargne Retraite : versements déductibles du revenu imposable, sortie en rente ou en capital à la retraite.","hint":"Intéressant surtout quand la TMI est élevée.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_banque_11","deckId":"banque","front":"Les SCPI","back":"Tu achètes des parts d’un parc immobilier (bureaux, commerces…) géré par une société de gestion, et tu perçois une partie des loyers.","hint":"L’immobilier « sans gérer », mais il y a des frais et un risque de perte.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_banque_12","deckId":"banque","front":"Usufruit et nue-propriété","back":"Usufruit : droit d’utiliser un bien et d’en percevoir les revenus. Nue-propriété : la propriété sans l’usage. Les deux se réunissent au décès de l’usufruitier.","hint":"Outil courant de transmission.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_banque_13","deckId":"banque","front":"Donation : abattement parent-enfant","back":"Chaque parent peut donner jusqu’à 100 000 € à chaque enfant sans droits, renouvelable tous les 15 ans.","hint":"Donner tôt et par étapes permet d’optimiser la transmission.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_banque_14","deckId":"banque","front":"L’IFI","back":"Impôt sur la Fortune Immobilière : dû si le patrimoine immobilier net taxable dépasse 1,3 M€.","hint":"Il remplace l’ISF depuis 2018.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_banque_15","deckId":"banque","front":"Gestion sous mandat vs conseil","back":"Sous mandat : le gérant décide à ta place selon ton profil. Conseil : il te propose, tu décides et tu valides.","hint":"Le mandat suppose une grande confiance et un profil clair.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_banque_16","deckId":"banque","front":"L’effet des frais","back":"1 % de frais par an sur 30 ans peut réduire le capital final d’environ 25 %.","hint":"Les frais mangent le rendement, comme les intérêts composés mais dans l’autre sens.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_info_0","deckId":"info","front":"Wi-Fi, Bluetooth, 4G/5G","back":"Wi-Fi : réseau local sans fil (ta box). Bluetooth : courte portée (~10 m) pour les accessoires. 4G/5G : réseau mobile de ton opérateur.","hint":"Wi-Fi = maison. Bluetooth = casque. 4G/5G = dehors.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_info_1","deckId":"info","front":"Adresse IP","back":"Le numéro d’identification d’un appareil sur un réseau.","hint":"C’est comme une adresse postale pour ton ordinateur.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_info_2","deckId":"info","front":"DNS","back":"L’annuaire d’internet : il traduit un nom (google.com) en adresse IP.","hint":"Sans DNS, il faudrait retenir des suites de chiffres.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_info_3","deckId":"info","front":"Serveur et cloud","back":"Serveur : ordinateur qui fournit un service. Cloud : ressources de serveurs distants accessibles par internet.","hint":"Le cloud, c’est l’ordinateur de quelqu’un d’autre.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_info_4","deckId":"info","front":"Les cookies","back":"De petits fichiers déposés par un site pour te reconnaître (connexion, panier, publicité ciblée).","hint":"Le RGPD impose ton consentement pour les non essentiels.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_info_5","deckId":"info","front":"Un VPN","back":"Il chiffre ta connexion et masque ton IP en passant par un serveur intermédiaire.","hint":"Utile sur un Wi-Fi public, mais pas d’anonymat total.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_info_6","deckId":"info","front":"HTTPS et cadenas","back":"HTTPS : communication chiffrée avec le site. Le cadenas ne prouve PAS que le site est honnête.","hint":"Un site frauduleux peut avoir un cadenas.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_info_7","deckId":"info","front":"Phishing","back":"Arnaque par faux message ou faux site imitant une entité de confiance, pour voler tes identifiants.","hint":"Vérifie l’expéditeur et l’URL. Jamais de mot de passe via un lien reçu.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_info_8","deckId":"info","front":"Malware et ransomware","back":"Malware : logiciel malveillant. Ransomware : chiffre tes fichiers et réclame une rançon.","hint":"Ta meilleure défense : les sauvegardes.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_info_9","deckId":"info","front":"Double authentification (2FA)","back":"Une deuxième preuve en plus du mot de passe : code SMS, application, clé de sécurité.","hint":"Même si ton mot de passe fuit, le compte reste protégé.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_info_10","deckId":"info","front":"Règle de sauvegarde 3-2-1","back":"3 copies de tes données, sur 2 supports différents, dont 1 hors site.","hint":"Ex. : ordinateur + disque externe + cloud.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_info_11","deckId":"info","front":"Un mot de passe solide","back":"Long (12 caractères ou plus), unique pour chaque site, idéalement dans un gestionnaire de mots de passe.","hint":"La longueur compte plus que les symboles compliqués.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_info_12","deckId":"info","front":"IA générative et LLM","back":"IA qui crée du contenu (texte, image…). LLM : grand modèle de l fois par 1 024.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_unit_9","deckId":"unit","front":"Que mesure le kWh ?","back":"L’énergie consommée par un appareil de 1 kW pendant 1 heure.","hint":"Un radiateur de 2 kW allumé 3 h consomme 6 kWh : c’est ce que tu paies sur ta facture.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_unit_10","deckId":"unit","front":"10 % de 250 ? 20 % ? 1 % ?","back":"10 % = 25 (décale la virgule). 20 % = 50. 1 % = 2,5.","hint":"15 % = 10 % + la moitié de 10 %.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_unit_11","deckId":"unit","front":"Prix HT → TTC (TVA 20 %)","back":"× 1,2. Et TTC → HT : ÷ 1,2 (pas −20 %).","hint":"100 € HT = 120 € TTC. 120 € TTC = 100 € HT.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_unit_12","deckId":"unit","front":"Augmentation et baisse en pourcentage","back":"+20 % : × 1,2. −20 % : × 0,8.","hint":"+10 % puis −10 % ne ramène pas au prix d’origine : 100 → 110 → 99.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_unit_13","deckId":"unit","front":"La règle de trois","back":"3 pommes coûtent 2,40 € → 1 pomme = 2,40 ÷ 3 = 0,80 € → 5 pommes = 4 €.","hint":"On ramène toujours à « 1 » d’abord.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_unit_14","deckId":"unit","front":"Milliard, million","back":"1 million = 10⁶. 1 milliard = 10⁹ (1 000 millions).","hint":"Le « billion » français = 10¹² (mille milliards). En anglais, « billion » = 10⁹.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_unit_15","deckId":"unit","front":"Pouce, mile, livre","back":"1 pouce = 2,54 cm. 1 mile ≈ 1,6 km. 1 livre (lb) ≈ 0,45 kg.","hint":"Utile quand tu lis des sources américaines.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_droit_0","deckId":"droit","front":"CDI vs CDD","back":"CDI : contrat sans limite de durée. CDD : contrat à durée limitée, avec un motif obligatoire, 18 mois maximum en règle générale.","hint":"Le CDI est la forme normale du contrat de travail.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_droit_1","deckId":"droit","front":"Période d’essai en CDI","back":"2 mois (ouvriers, employés), 3 mois (techniciens, agents de maîtrise), 4 mois (cadres). Renouvelable une fois.","hint":"Chacune des parties peut rompre sans motif, dans le respect d’un préavis.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_droit_2","deckId":"droit","front":"Démission vs licenciement vs rupture conventionnelle","back":"Démission : à l’initiative du salarié. Licenciement : de l’employeur, pour cause réelle et sérieuse. Rupture conventionnelle : accord des deux, homologué, ouvre droit au chômage.","hint":"La démission n’ouvre pas droit au chômage en principe.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_droit_3","deckId":"droit","front":"Congés payés","back":"2,5 jours ouvrables par mois travaillé : 30 jours ouvrables (5 semaines) par an.","hint":"Jours ouvrables = du lundi au samedi.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_droit_4","deckId":"droit","front":"Arrêt maladie","back":"Certificat d’un médecin. La Sécu verse des indemnités journalières après un délai de carence de 3 jours.","hint":"L’employeur ou la convention collective peut compléter.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_droit_5","deckId":"droit","front":"Sécu vs mutuelle","back":"La Sécurité sociale rembourse une partie des soins. La mutuelle complète ce que la Sécu ne rembourse pas.","hint":"La carte Vitale sert à la Sécu.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_droit_6","deckId":"droit","front":"Responsabilité civile","back":"L’obligation de réparer les dommages causés à autrui. Elle est couverte par une assurance.","hint":"Souvent incluse dans l’assurance habitation.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_droit_7","deckId":"droit","front":"Assurance habitation","back":"Obligatoire pour le locataire (dégâts des eaux, incendie…). Le propriétaire assure le bâtiment.","hint":"Sans attestation, le propriétaire peut résilier le bail.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_droit_8","deckId":"droit","front":"Dépôt de garantie","back":"1 mois de loyer hors charges (logement vide), 2 mois (meublé). Rendu sous 1 mois si l’état des lieux est conforme, 2 mois sinon.","hint":"Ce n’est pas un loyer d’avance.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_droit_9","deckId":"droit","front":"Le bail : durées","back":"3 ans pour un logement vide, 1 an pour un meublé, 9 mois pour un meublé étudiant.","hint":"Préavis du locataire : 3 mois (1 mois en zone tendue ou en meublé).","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_droit_10","deckId":"droit","front":"État des lieux","back":"Un document contradictoire à l’entrée et à la sortie : il décrit l’état du logement.","hint":"Fais des photos datées, elles évitent les litiges.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_droit_11","deckId":"droit","front":"Propriété, usufruit, nue-propriété","back":"Propriété : usage, revenus et droit de vendre. Usufruit : usage et revenus. Nue-propriété : propriété sans usage.","hint":"Se retrouvent en transmission.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_droit_12","deckId":"droit","front":"Testament olographe","back":"Écrit à la main, daté et signé : il est valable.","hint":"Il peut être déposé chez un notaire.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_droit_13","deckId":"droit","front":"PACS vs mariage","back":"Le PACS est un contrat entre deux personnes, plus simple à défaire et sans droit automatique à la succession. Le mariage donne plus de droits et de protection au conjoint.","hint":"Le PACS se conclut devant un notaire ou à la mairie.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_droit_14","deckId":"droit","front":"Séparation de biens vs communauté","back":"Séparation de biens : chacun garde ses biens. Communauté réduite aux acquêts (régime légal) : ce qui est acquis pendant le mariage appartient aux deux.","hint":"Un contrat de mariage permet de changer de régime.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_droit_15","deckId":"droit","front":"Signer = s’engager","back":"Une signature vaut accord : tu es engagé juridiquement par le contenu.","hint":"Toujours lire avant de signer, y compris les petites lignes.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_why_0","deckId":"why","front":"Pourquoi le ciel est bleu ?","back":"La lumière du Soleil se diffuse dans l’atmosphère : le bleu, de courte longueur d’onde, est bien plus diffusé que le rouge (diffusion de Rayleigh).","hint":"Au coucher du soleil, la lumière traverse plus d’atmosphère : le bleu est filtré, il reste le rouge.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_why_1","deckId":"why","front":"Pourquoi les avions volent ?","back":"Grâce à la portance : l’air passe plus vite au-dessus de l’aile qu’en dessous, ce qui crée une force vers le haut.","hint":"La vitesse de l’avion maintient cette force.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_why_2","deckId":"why","front":"Pourquoi y a-t-il des saisons ?","back":"À cause de l’inclinaison de l’axe de la Terre (23,4°), pas de la distance au Soleil.","hint":"Quand ton hémisphère est incliné vers le Soleil : été.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_why_3","deckId":"why","front":"Pourquoi les marées ?","back":"L’attraction gravitationnelle de la Lune (et un peu du Soleil) sur les océans.","hint":"Deux marées hautes par jour, en général.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_why_4","deckId":"why","front":"Pourquoi voit-on l’éclair avant d’entendre le tonnerre ?","back":"La lumière va beaucoup plus vite (≈ 300 000 km/s) que le son (≈ 340 m/s).","hint":"3 secondes entre l’éclair et le tonnerre ≈ 1 km.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_why_5","deckId":"why","front":"L’eau salée bout et gèle à une température différente","back":"Le sel élève la température d’ébullition et abaisse celle de congélation.","hint":"C’est pourquoi on sale les routes en hiver.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_why_6","deckId":"why","front":"Pourquoi le métal paraît plus froid que le bois ?","back":"Le métal conduit mieux la chaleur : il en prélève vite à ta main. Le bois est un isolant.","hint":"Les deux sont pourtant à la même température.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_why_7","deckId":"why","front":"Pourquoi les feuilles changent de couleur ?","back":"En automne, la chlorophylle (verte) disparaît et laisse apparaître d’autres pigments (jaune, orange) déjà présents.","hint":"Le rouge est produit en plus dans certaines feuilles.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_why_8","deckId":"why","front":"Comment fonctionne un GPS ?","back":"Ton récepteur calcule sa position en mesurant le temps de trajet des signaux d’au moins 4 satellites.","hint":"Le GPS reçoit, il n’émet pas.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_why_9","deckId":"why","front":"Moteur thermique vs moteur électrique","back":"Thermique : combustion du carburant qui pousse des pistons. Électrique : champs magnétiques qui font tourner un rotor.","hint":"L’électrique a un rendement bien meilleur.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_why_10","deckId":"why","front":"Pourquoi un bateau flotte ?","back":"Poussée d’Archimède : un corps plongé dans un fluide reçoit une force vers le haut égale au poids du fluide déplacé.","hint":"Un bateau en acier flotte car sa forme déplace beaucoup d’eau.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_why_11","deckId":"why","front":"Pourquoi les objets tombent ?","back":"La gravité : la Terre attire les objets. Accélération ≈ 9,8 m/s².","hint":"Sans air, une plume et un marteau tombent à la même vitesse.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_why_12","deckId":"why","front":"D’où vient le décalage horaire ?","back":"La Terre tourne sur elle-même en 24 h : 360° ÷ 24 = 15° par heure, donc un fuseau horaire tous les 15°.","hint":"Quand il est midi à Paris, il est 6 h du matin à New York.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_why_13","deckId":"why","front":"Éclipse solaire vs éclipse lunaire","back":"Solaire : la Lune passe entre la Terre et le Soleil. Lunaire : la Terre passe entre le Soleil et la Lune.","hint":"Ne regarde jamais le Soleil sans lunettes homologuées.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_why_14","deckId":"why","front":"Pourquoi les avions laissent des traînées blanches ?","back":"La vapeur d’eau émise par les réacteurs se condense et gèle dans l’air froid en altitude : ce sont des traînées de condensation.","hint":"Comme ton haleine par temps froid.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_why_15","deckId":"why","front":"Pourquoi voit-on parfois la Lune en plein jour ?","back":"La Lune tourne autour de la Terre en 27 jours et n’est pas toujours du côté opposé au Soleil : selon sa position, elle est visible le jour.","hint":"Elle est juste moins lumineuse que le Soleil.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_social_0","deckId":"social","front":"Serrer la main","back":"Main ferme mais pas écrasante, regard dans les yeux, sourire, quelques secondes.","hint":"Une main molle donne une impression d’hésitation.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_social_1","deckId":"social","front":"Se présenter","back":"Prénom, nom, et en une phrase ce que tu fais : « Sam Durand, étudiant en marketing digital ».","hint":"Court et clair, tu poses la question à l’autre ensuite.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_social_2","deckId":"social","front":"Présenter quelqu’un","back":"On présente la personne la moins « importante » à la plus importante : « Madame Martin, je vous présente Paul ».","hint":"Ajoute une phrase qui les relie pour lancer la conversation.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_social_3","deckId":"social","front":"Lancer une conversation","back":"Pose une question ouverte (qui commence par « comment », « pourquoi ») sur l’événement, le lieu ou l’activité.","hint":"Évite les questions fermées auxquelles on répond par oui ou non.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_social_4","deckId":"social","front":"L’écoute active","back":"Regarder la personne, ne pas couper la parole, reformuler et poser des questions de suite.","hint":"Les gens retiennent surtout ce qu’ils ont pu raconter.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_social_5","deckId":"social","front":"Ne pas tout ramener à soi","back":"Rebondir sur ce que dit l’autre au lieu de raconter ta propre histoire tout de suite.","hint":"Règle simple : au moins deux questions pour une anecdote.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_social_6","deckId":"social","front":"Faire un compliment naturellement","back":"Précis et sincère : « ta présentation était très claire sur les chiffres » plutôt que « t’es super ».","hint":"Un compliment précis montre que tu as réellement regardé.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_social_7","deckId":"social","front":"S’excuser correctement","back":"Court, sincère, sans « mais » : « Désolé pour le retard, je m’organise mieux la prochaine fois ».","hint":"Une excuse suivie d’un « mais » n’est plus une excuse.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_social_8","deckId":"social","front":"Demander un service","back":"Explique clairement, laisse la possibilité de dire non, remercie ensuite.","hint":"Un « non » ne doit jamais être puni.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_social_9","deckId":"social","front":"Tutoiement ou vouvoiement ?","back":"Vouvoie par défaut les supérieurs, clients, inconnus plus âgés. Attends que l’autre te propose le tutoiement.","hint":"Dans le monde bancaire, le vouvoiement reste la norme avec les clients.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_social_10","deckId":"social","front":"Que faire quand tu ne connais pas un sujet ?","back":"Dis-le simplement : « Je ne connais pas du tout, c’est quoi ? ». Ça donne une meilleure image que de faire semblant.","hint":"Les gens aiment expliquer ce qu’ils connaissent.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_carriere_0","deckId":"carriere","front":"Un CV : la structure de base","back":"État civil, accroche courte, expériences (de la plus récente à la plus ancienne), formation, compétences, centres d’intérêt. Une page, sauf profil très expérimenté.","hint":"Adapte les mots-clés du CV à l’offre : beaucoup sont triés automatiquement avant d’être lus.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_carriere_1","deckId":"carriere","front":"À quoi sert vraiment une lettre de motivation ?","back":"Expliquer pourquoi TOI pour CE poste, pas répéter le CV. Elle doit répondre à « pourquoi cette entreprise » et « pourquoi toi ».","hint":"Une lettre qui pourrait être envoyée telle quelle à une autre entreprise est mal ciblée.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_carriere_2","deckId":"carriere","front":"L’elevator pitch","back":"Se présenter en 30 à 60 secondes : qui tu es, ce que tu fais, ce que tu cherches.","hint":"Nom vient de l’idée de convaincre quelqu’un le temps d’un trajet en ascenseur.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_carriere_3","deckId":"carriere","front":"Répondre à « parlez-moi de vous » en entretien","back":"Présent → passé → futur : ta situation actuelle, ton parcours pertinent, ce que tu recherches. 1 à 2 minutes.","hint":"Pas un résumé de toute ta vie depuis l’enfance.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_carriere_4","deckId":"carriere","front":"La méthode STAR","back":"Situation, Tâche, Action, Résultat : structure pour raconter une expérience concrète en entretien.","hint":"Utile pour répondre à « donne-moi un exemple où… ».","detail":"","tags":[],"repetitions":0,"interval":0,"easeF
