<title>SuperAnki Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Lora:wght@400;600;700&family=Nunito:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;700&family=Playfair+Display:wght@600;700;800&family=Patrick+Hand&family=Press+Start+2P&family=VT323&display=swap">
<style>
/* ============================================================
   SuperAnki Pro - design system
   Every theme redefines the same tokens; components only use tokens.
   ============================================================ */
:root {
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: var(--font);
  --font-card: var(--font);
  --bg: #f5f6fb;
  --bg-accent: radial-gradient(1200px 600px at 100% -10%, color-mix(in srgb, var(--primary) 10%, transparent), transparent 60%);
  --surface: #ffffff;
  --surface-2: #f1f3f9;
  --surface-3: #e7eaf3;
  --border: #e3e6ef;
  --border-strong: #cfd4e2;
  --text: #151a2d;
  --text-muted: #5d6479;
  --text-faint: #8b91a5;
  --primary: #4f46e5;
  --primary-2: #7c3aed;
  --on-primary: #ffffff;
  --primary-soft: color-mix(in srgb, var(--primary) 11%, var(--surface));
  --ring: color-mix(in srgb, var(--primary) 45%, transparent);
  --new: #2563eb;
  --learn: #d97706;
  --due: #e11d48;
  --mature: #059669;
  --again: #e11d48;
  --hard: #d97706;
  --good: #2563eb;
  --easy: #059669;
  --radius: 18px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --border-w: 1px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 4px 16px rgba(16, 24, 40, .06);
  --shadow-lg: 0 10px 40px rgba(16, 24, 40, .16);
  --hero: linear-gradient(135deg, var(--primary), var(--primary-2));
  --on-hero: #ffffff;
  --heading-transform: none;
  --heading-spacing: -0.02em;
  --card-size: 1.35rem;
  color-scheme: light;
}

/* ---------- Dark family ---------- */
[data-theme="nuit"], [data-theme="oled"], [data-theme="foret"], [data-theme="neon"], [data-theme="terminal"], [data-theme="nord"], [data-theme="dracula"], [data-theme="cafe"], [data-theme="luxe"], [data-theme="synthwave"], [data-theme="craie"], [data-theme="contraste"] { color-scheme: dark; }

[data-theme="nuit"] {
  --bg: #0b1020; --surface: #131a2e; --surface-2: #1a2238; --surface-3: #232d47;
  --border: #242e48; --border-strong: #34405f;
  --text: #e8ebf5; --text-muted: #a3abc2; --text-faint: #7580a0;
  --primary: #818cf8; --primary-2: #c084fc; --on-primary: #0b1020;
  --new: #60a5fa; --learn: #fbbf24; --due: #fb7185; --mature: #34d399;
  --again: #fb7185; --hard: #fbbf24; --good: #60a5fa; --easy: #34d399;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25);
  --hero: linear-gradient(135deg, #4f46e5, #7c3aed);
}
[data-theme="oled"] {
  --bg: #000000; --bg-accent: none; --surface: #0b0b0c; --surface-2: #141416; --surface-3: #1d1d20;
  --border: #1f1f23; --border-strong: #2e2e33;
  --text: #f4f4f5; --text-muted: #a1a1aa; --text-faint: #71717a;
  --primary: #f4f4f5; --primary-2: #a1a1aa; --on-primary: #000000;
  --primary-soft: #18181b;
  --new: #60a5fa; --learn: #fbbf24; --due: #fb7185; --mature: #4ade80;
  --again: #fb7185; --hard: #fbbf24; --good: #60a5fa; --easy: #4ade80;
  --shadow: none; --shadow-lg: 0 0 0 1px #2e2e33;
  --hero: #0b0b0c; --on-hero: #f4f4f5;
}
[data-theme="oled"] .hero { border: 1px solid var(--border-strong); }

/* ---------- Papier (sepia, serif, editorial) ---------- */
[data-theme="papier"] {
  --font: 'Lora', Georgia, 'Times New Roman', serif;
  --font-display: 'Lora', Georgia, serif;
  --font-card: 'Lora', Georgia, serif;
  --bg: #efe6d2; --bg-accent: none;
  --surface: #fbf6ea; --surface-2: #f3ead7; --surface-3: #e8dcc2;
  --border: #dccdab; --border-strong: #c7b48b;
  --text: #33271b; --text-muted: #6d5a45; --text-faint: #9a8569;
  --primary: #9a3412; --primary-2: #b45309; --on-primary: #fff8ec;
  --new: #1d4ed8; --learn: #b45309; --due: #b91c1c; --mature: #3f6212;
  --again: #b91c1c; --hard: #b45309; --good: #1d4ed8; --easy: #3f6212;
  --radius: 6px; --radius-sm: 4px; --radius-xs: 3px;
  --shadow: 0 1px 0 rgba(90,60,20,.12), 0 2px 8px rgba(90,60,20,.08);
  --hero: #3b2c1c; --on-hero: #fbf2df;
  --heading-spacing: 0;
}

/* ---------- Forêt ---------- */
[data-theme="foret"] {
  --font: 'Nunito', system-ui, sans-serif;
  --bg: #0d1712; --surface: #14231b; --surface-2: #1a2e23; --surface-3: #22392c;
  --border: #213a2c; --border-strong: #2f4f3d;
  --text: #e3f1e8; --text-muted: #9dbba8; --text-faint: #6f8f7b;
  --primary: #4ade80; --primary-2: #a3e635; --on-primary: #06220f;
  --new: #7dd3fc; --learn: #fcd34d; --due: #fda4af; --mature: #4ade80;
  --again: #fb7185; --hard: #fcd34d; --good: #7dd3fc; --easy: #4ade80;
  --shadow: 0 6px 20px rgba(0,0,0,.3);
  --hero: linear-gradient(135deg, #166534, #3f6212);
  --radius: 22px;
}

/* ---------- Océan ---------- */
[data-theme="ocean"] {
  --bg: #e9f4fb; --surface: #ffffff; --surface-2: #eef7fc; --surface-3: #dcecf7;
  --border: #d3e6f3; --border-strong: #b6d4ea;
  --text: #0b2a3f; --text-muted: #4a6a80; --text-faint: #7d98ab;
  --primary: #0284c7; --primary-2: #0d9488; --on-primary: #fff;
  --hero: linear-gradient(135deg, #0369a1, #0d9488 60%, #14b8a6);
  --radius: 22px;
}

/* ---------- Sakura ---------- */
[data-theme="sakura"] {
  --font: 'Nunito', system-ui, sans-serif;
  --bg: #fff4f6; --surface: #ffffff; --surface-2: #fff0f3; --surface-3: #fde2e8;
  --border: #fbd5de; --border-strong: #f5b3c3;
  --text: #4a1d2c; --text-muted: #8c5566; --text-faint: #b88594;
  --primary: #db2777; --primary-2: #f472b6; --on-primary: #fff;
  --hero: linear-gradient(135deg, #f472b6, #fb7185 55%, #fda4af);
  --radius: 26px; --radius-sm: 18px; --radius-xs: 12px;
  --shadow: 0 4px 18px rgba(219, 39, 119, .08);
}

/* ---------- Lavande ---------- */
[data-theme="lavande"] {
  --font: 'Nunito', system-ui, sans-serif;
  --bg: #f4f1fd; --surface: #ffffff; --surface-2: #f3effd; --surface-3: #e7e0fb;
  --border: #e3dbfa; --border-strong: #cbbdf5;
  --text: #251a45; --text-muted: #625887; --text-faint: #978db8;
  --primary: #7c3aed; --primary-2: #a78bfa; --on-primary: #fff;
  --hero: linear-gradient(135deg, #7c3aed, #a78bfa);
  --radius: 22px;
}

/* ---------- Néon (cyberpunk) ---------- */
[data-theme="neon"] {
  --font: 'Space Grotesk', system-ui, sans-serif;
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --bg: #07000f; --bg-accent: radial-gradient(900px 500px at 0% 0%, rgba(255,43,214,.16), transparent 60%), radial-gradient(900px 500px at 100% 100%, rgba(0,229,255,.12), transparent 60%);
  --surface: #120823; --surface-2: #1a0d31; --surface-3: #25133f;
  --border: #3a1a5c; --border-strong: #5b2a8a;
  --text: #f5e9ff; --text-muted: #c4a8e6; --text-faint: #8f74b3;
  --primary: #ff2bd6; --primary-2: #00e5ff; --on-primary: #12001c;
  --new: #00e5ff; --learn: #ffd500; --due: #ff3d71; --mature: #39ff88;
  --again: #ff3d71; --hard: #ffd500; --good: #00e5ff; --easy: #39ff88;
  --shadow: 0 0 0 1px rgba(255,43,214,.18), 0 0 24px rgba(255,43,214,.12);
  --shadow-lg: 0 0 0 1px rgba(255,43,214,.35), 0 0 40px rgba(255,43,214,.25);
  --hero: linear-gradient(120deg, #ff2bd6, #7b2bff 50%, #00e5ff);
  --on-hero: #fff;
  --radius: 14px;
  --heading-transform: uppercase; --heading-spacing: 0.04em;
}
[data-theme="neon"] .btn-primary { box-shadow: 0 0 18px rgba(255,43,214,.55); }
[data-theme="neon"] .logo-mark { box-shadow: 0 0 16px rgba(255,43,214,.7); }
[data-theme="neon"] .panel { backdrop-filter: blur(6px); }

/* ---------- Terminal (retro) ---------- */
[data-theme="terminal"] {
  --font: 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, monospace;
  --font-display: var(--font); --font-card: var(--font);
  --bg: #020a03; --bg-accent: none;
  --surface: #031205; --surface-2: #062009; --surface-3: #0a2c0e;
  --border: #0f4a18; --border-strong: #1a7a2a;
  --text: #4dff7a; --text-muted: #2fbf55; --text-faint: #1f8a3c;
  --primary: #4dff7a; --primary-2: #4dff7a; --on-primary: #021004;
  --primary-soft: #06260b;
  --new: #5ee6ff; --learn: #ffe066; --due: #ff6b6b; --mature: #4dff7a;
  --again: #ff6b6b; --hard: #ffe066; --good: #5ee6ff; --easy: #4dff7a;
  --radius: 0; --radius-sm: 0; --radius-xs: 0;
  --shadow: none; --shadow-lg: 0 0 0 1px var(--border-strong);
  --hero: #031205; --on-hero: #4dff7a;
  --heading-transform: uppercase; --heading-spacing: 0.06em;
  --card-size: 1.2rem;
}
[data-theme="terminal"] body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 200;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
}
[data-theme="terminal"] .hero { border: 1px solid var(--border-strong); }
[data-theme="terminal"] .hero-title::before { content: "> "; }
[data-theme="terminal"] .hero-title::after { content: "_"; animation: blink 1s steps(1) infinite; }
[data-theme="terminal"] * { text-shadow: 0 0 6px rgba(77,255,122,.25); }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- Brutaliste ---------- */
[data-theme="brutal"] {
  --font: 'Space Grotesk', system-ui, sans-serif;
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --bg: #fff8e7; --bg-accent: none;
  --surface: #ffffff; --surface-2: #fff1c7; --surface-3: #ffe58a;
  --border: #111111; --border-strong: #111111;
  --text: #111111; --text-muted: #333333; --text-faint: #555555;
  --primary: #ffd400; --primary-2: #ff5c8a; --on-primary: #111111;
  --primary-soft: #fff1b0;
  --new: #2d5bff; --learn: #ff8a00; --due: #ff2e4d; --mature: #00a86b;
  --again: #ff2e4d; --hard: #ff8a00; --good: #2d5bff; --easy: #00a86b;
  --radius: 0; --radius-sm: 0; --radius-xs: 0;
  --border-w: 2.5px;
  --shadow: 5px 5px 0 #111; --shadow-lg: 8px 8px 0 #111;
  --hero: #ff5c8a; --on-hero: #111;
  --heading-transform: uppercase; --heading-spacing: 0;
}
[data-theme="brutal"] .btn { border: 2.5px solid #111; box-shadow: 3px 3px 0 #111; }
[data-theme="brutal"] .btn:active { transform: translate(3px, 3px); box-shadow: none; }
[data-theme="brutal"] .hero { border: 2.5px solid #111; }
[data-theme="brutal"] .hero .btn-hero { background: #ffd400; color: #111; }

/* ============================================================
   Base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  font-family: var(--font); color: var(--text);
  background: var(--bg-accent), var(--bg); background-attachment: fixed;
  font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; letter-spacing: var(--heading-spacing); text-transform: var(--heading-transform); line-height: 1.2; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
img { max-width: 100%; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--primary) 30%, transparent); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }

.i { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
.i-fill { fill: currentColor; stroke: none; }

/* ============================================================
   Layout
   ============================================================ */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter: saturate(160%) blur(12px); -webkit-backdrop-filter: saturate(160%) blur(12px);
  border-bottom: var(--border-w) solid var(--border);

.grade-btn:hover { background: color-mix(in srgb, var(--c) 20%, var(--surface)); }
.grade-btn:active { transform: scale(.97); }
.grade-btn small { font-size: .72rem; font-weight: 700; opacity: .8; }
.grade-btn.suggested { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 45%, transparent); }
.grade-btn kbd { display: none; }
@media (hover: hover) and (pointer: fine) { .grade-btn kbd { display: inline; font: 700 .62rem var(--font); opacity: .5; } }
[data-theme="brutal"] .grade-btn { border: 2.5px solid #111; box-shadow: 3px 3px 0 #111; }

.type-box { margin-top: 18px; }
.type-result { margin-top: 14px; border-radius: var(--radius-sm); padding: 14px 16px; border: var(--border-w) solid; font-size: .92rem; text-align: left; }
.type-result.ok { border-color: color-mix(in srgb, var(--mature) 40%, transparent); background: color-mix(in srgb, var(--mature) 10%, var(--surface)); }
.type-result.close { border-color: color-mix(in srgb, var(--learn) 40%, transparent); background: color-mix(in srgb, var(--learn) 10%, var(--surface)); }
.type-result.bad { border-color: color-mix(in srgb, var(--due) 40%, transparent); background: color-mix(in srgb, var(--due) 8%, var(--surface)); }
.type-result .verdict { font-weight: 800; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.type-result.ok .verdict { color: var(--mature); } .type-result.close .verdict { color: var(--learn); } .type-result.bad .verdict { color: var(--due); }
.typed-diff .miss { color: var(--due); text-decoration: line-through; }
.typed-diff .hit { color: var(--mature); font-weight: 700; }

/* Quiz */
.quiz-options { display: grid; gap: 10px; margin-top: 16px; }
.quiz-opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; min-height: 58px; border-radius: var(--radius-sm); background: var(--surface); border: var(--border-w) solid var(--border); box-shadow: var(--shadow); font-weight: 600; font-size: .95rem; transition: border-color .15s, background .15s, transform .08s; overflow-wrap: anywhere; }
.quiz-opt:hover { border-color: var(--primary); }
.quiz-opt:active { transform: scale(.99); }
.quiz-opt .k { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); font-size: .8rem; font-weight: 800; color: var(--text-muted); flex: none; }
.quiz-opt.correct { border-color: var(--mature); background: color-mix(in srgb, var(--mature) 12%, var(--surface)); }
.quiz-opt.correct .k { background: var(--mature); color: #fff; }
.quiz-opt.wrong { border-color: var(--due); background: color-mix(in srgb, var(--due) 10%, var(--surface)); }
.quiz-opt.wrong .k { background: var(--due); color: #fff; }
.quiz-opt.dim { opacity: .55; }
.quiz-options.locked .quiz-opt { pointer-events: none; }
.chrono-hud { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.chrono-num { font-size: 1.6rem; font-weight: 800; font-family: var(--font-display); line-height: 1; }
.chrono-num.low { color: var(--due); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .5; } }
.float-pts { position: fixed; pointer-events: none; font-weight: 800; font-size: 1.2rem; animation: floatUp .8s ease forwards; z-index: 100; }
@keyframes floatUp { to { transform: translateY(-40px); opacity: 0; } }

/* Summary */
.summary { max-width: 640px; margin: 0 auto; text-align: center; }
.summary-emoji { font-size: 3.2rem; line-height: 1; }
.summary-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 22px 0; }
.summary-stats div { padding: 14px 8px; }
.summary-stats b { display: block; font-size: 1.5rem; font-family: var(--font-display); }
.summary-stats span { font-size: .75rem; color: var(--text-muted); font-weight: 700; }
.missed-list { text-align: left; }
.missed-item { padding: 12px 16px; border-bottom: var(--border-w) solid var(--border); font-size: .9rem; }
.missed-item:last-child { border-bottom: 0; }
.missed-item .a { color: var(--text-muted); margin-top: 2px; font-size: .85rem; }

/* ============================================================
   Card rich content
   ============================================================ */
.rich img { display: block; max-width: 100%; max-height: 320px; object-fit: contain; border-radius: var(--radius-xs); margin: 10px auto; }
.rich ul, .rich ol { text-align: left; display: inline-block; margin: 6px 0; padding-left: 1.3em; }
.rich p { margin: .3em 0; }
.rich [style*="background-color"], .rich mark { color: #1a1a1a; border-radius: 3px; padding: 0 2px; }
.rich mark { background: #fde047; }
.rich a { color: var(--primary); }
.card-row .rich img, .missed-item .rich img, .quiz-opt .rich img { display: inline-block; max-height: 48px; margin: 0 4px; }
.card-row .rich ul, .card-row .rich ol { display: inline; padding: 0; }
.card-row .rich li { display: inline; } .card-row .rich li + li::before { content: " · "; }

/* ============================================================
   Rich text editor
   ============================================================ */
.editor { border: var(--border-w) solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); overflow: hidden; transition: border-color .15s, box-shadow .15s; }
.editor:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); background: var(--surface); }
.toolbar { display: flex; flex-wrap: wrap; gap: 2px; padding: 5px; border-bottom: var(--border-w) solid var(--border); background: var(--surface); }
.tb-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: var(--radius-xs); color: var(--text-muted); font-weight: 800; font-size: .95rem; }
.tb-btn:hover { background: var(--surface-2); color: var(--text); }
.tb-btn.on { background: var(--primary-soft); color: var(--primary); }
.tb-sep { width: 1px; background: var(--border); margin: 6px 4px; }
.editor-area { min-height: 90px; max-height: 320px; overflow-y: auto; padding: 12px 14px; outline: none; font-size: 16px; line-height: 1.55; overflow-wrap: anywhere; }
.editor-area:empty::before { content: attr(data-placeholder); color: var(--text-faint); pointer-events: none; }
.editor-area img { max-height: 180px; border-radius: 8px; display: block; margin: 6px 0; cursor: pointer; }
.editor-area img.selected { outline: 3px solid var(--primary); }
.editor-area ul, .editor-area ol { padding-left: 1.4em; margin: 4px 0; }
.editor-area [style*="background-color"] { color: #1a1a1a; }
.editor.sm .editor-area { min-height: 60px; }

/* ============================================================
   Modals, toasts, confirm
   ============================================================ */
.modal-back { position: fixed; inset: 0; z-index: 80; background: rgba(8, 10, 20, .55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeBg .18s ease; }
@keyframes fadeBg { from { opacity: 0; } }
.modal { background: var(--surface-solid, var(--surface)) !important; width: 100%; max-width: 560px; max-height: calc(100dvh - 32px); display: flex; flex-direction: column; background: var(--surface); border: var(--border-w) solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); animation: pop .2s ease; overflow: hidden; }
.modal.wide { max-width: 720px; }
.modal.narrow { max-width: 420px; }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-bottom: var(--border-w) solid var(--border); }
.modal-head h3 { font-size: 1.1rem; font-weight: 800; }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: var(--border-w) solid var(--border); flex-wrap: wrap; background: var(--surface); }
@media (max-width: 560px) {
  .modal-back { align-items: flex-end; padding: 0; }
  .modal { max-width: none; border-radius: var(--radius) var(--radius) 0 0; max-height: 94dvh; border-bottom: 0; animation: sheet .25s ease; }
  .modal-foot { padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .modal-foot .btn { flex: 1; }
  @keyframes sheet { from { transform: translateY(40px); opacity: 0; } }
}
.pick-list { display: grid; gap: 6px; max-height: 300px; overflow-y: auto; padding: 2px; }
.pick-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); border: var(--border-w) solid var(--border); background: var(--surface-2); text-align: left; font-weight: 600; font-size: .92rem; width: 100%; }
.pick-item.active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
.pick-item .ct { margin-left: auto; font-size: .78rem; color: var(--text-faint); font-weight: 700; }
.emoji-row { display: flex; flex-wrap: wrap; gap: 6px; }
.emoji-row button { width: 40px; height: 40px; border-radius: var(--radius-xs); font-size: 1.25rem; background: var(--surface-2); border: var(--border-w) solid var(--border); }
.emoji-row button.active { border-color: var(--primary); background: var(--primary-soft); }

.toasts { position: fixed; z-index: 120; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: calc(100% - 32px); max-width: 420px; }
@media (max-width: 767px) { body:not(.in-session) .toasts { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); } }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: var(--radius-sm); background: var(--text); color: var(--bg); font-weight: 600; font-size: .9rem; box-shadow: var(--shadow-lg); animation: toastIn .25s ease; max-width: 100%; }
.toast.out { animation: toastOut .25s ease forwards; }
.toast .i { flex: none; }
.toast.success .i { color: var(--mature); } .toast.warning .i { color: var(--learn); } .toast.error .i { color: var(--due); }
.toast button { margin-left: auto; font-weight: 800; color: var(--primary); padding-left: 8px; }
[data-theme="nuit"] .toast .i, [data-theme="oled"] .toast .i, [data-theme="foret"] .toast .i, [data-theme="neon"] .toast .i, [data-theme="terminal"] .toast .i { filter: brightness(.7); }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(12px); } }

/* ============================================================
   Stats
   ============================================================ */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.kpi { padding: 16px 18px; }
.kpi span { font-size: .75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
.kpi b { display: block; font-size: 1.6rem; font-weight: 800; margin-top: 4px; font-family: var(--font-display); }
.kpi em { font-style: normal; font-size: .75rem; color: var(--text-faint); font-weight: 600; }
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 860px) { .chart-grid { grid-template-columns: 1fr; } }
.chart-card h4 { font-size: .95rem; font-weight: 800; margin-bottom: 14px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--text-faint); font-size: 10px; font-family: var(--font); }
.chart .val { fill: var(--text-muted); font-weight: 700; }
.donut-wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; justify-content: center; }
.donut-wrap svg { width: 180px; height: 180px; }
.legend { display: grid; gap: 8px; font-size: .88rem; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend b { margin-left: auto; padding-left: 16px; }
.heatmap-scroll { overflow-x: auto; padding-bottom: 4px; }
.heatmap { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 13px); grid-auto-columns: 13px; gap: 3px; width: max-content; }
.heatmap i { border-radius: 3px; background: var(--surface-2); }
.heatmap i.l1 { background: color-mix(in srgb, var(--primary) 30%, var(--surface-2)); }
.heatmap i.l2 { background: color-mix(in srgb, var(--primary) 55%, var(--surface-2)); }
.heatmap i.l3 { background: color-mix(in srgb, var(--primary) 80%, var(--surface-2)); }
.heatmap i.l4 { background: var(--primary); }
.heatmap i.today { outline: 2px solid var(--text-faint); outline-offset: 1px; }
.deck-progress-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px 44px; gap: 12px; align-items: center; padding: 8px 0; font-size: .88rem; font-weight: 600; }
.deck-progress-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deck-progress-row b { text-align: right; font-size: .8rem; color: var(--text-muted); }

/* ============================================================
   Settings
   ============================================================ */
.settings { max-width: 860px; }
.set-section h3 { font-size: 1rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.set-section > p { margin-top: 4px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0; border-top: var(--border-w) solid var(--border); flex-wrap: wrap; }
.set-row:first-of-type { margin-top: 12px; }
.set-row .txt { flex: 1; min-width: 200px; }
.set-row .txt b { display: block; font-size: .95rem; }
.set-row .txt span { font-size: .82rem; color: var(--text-muted); }
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
.theme-opt { text-align: left; border-radius: 14px; border: 2px solid var(--border); padding: 0; overflow: hidden; background: var(--surface); transition: border-color .15s, transform .15s; }
.theme-opt:hover { transform: translateY(-2px); }
.theme-opt.active { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
.theme-prev { height: 86px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.theme-prev .tp-bar { height: 14px; border-radius: 4px; }
.theme-prev .tp-row { display: flex; gap: 6px; flex: 1; }
.theme-prev .tp-card { flex: 1; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.theme-prev .tp-line { height: 5px; border-radius: 3px; opacity: .8; }
.theme-name { padding: 8px 10px; font-size: .82rem; font-weight: 800; display: flex; align-items: center; justify-content: space-between; color: var(--text); }
.theme-name small { font-weight: 600; color: var(--text-faint); font-size: .7rem; }
.kbd-list { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: .88rem; margin-top: 12px; }
kbd.k { display: inline-block; min-width: 26px; text-align: center; padding: 2px 7px; border-radius: 6px; border: var(--border-w) solid var(--border-strong); border-bottom-width: 3px; font: 700 .78rem var(--font); background: var(--surface-2); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

details > summary { list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary .i { transition: transform .2s; }
details[open] > summary .i { transform: rotate(180deg); }
code { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: .85em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }

@media (max-width: 560px) {
  .toolbar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .toolbar::-webkit-scrollbar { display: none; }
  .tb-btn { flex: none; }
  .session-top { gap: 4px; }
  .session-top .icon-btn { width: 36px; height: 36px; }
  .session-title p { display: none; }
  .modal-foot .btn.hide-mobile { display: none; }
}

/* ============================================================
   Additional themes
   ============================================================ */

[data-theme="luxe"] {

/* Theme picker */
.theme-group { margin-top: 18px; }
.theme-group h5 { margin: 0 0 10px; font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); }
.theme-group .theme-grid { margin-top: 0; }
.theme-prev { height: 104px; }
.theme-prev .tp-bar { height: 12px; border-radius: 4px; display: flex; align-items: center; padding: 0 5px; }
.theme-prev .tp-bar span { width: 18px; height: 4px; border-radius: 2px; }
.theme-prev .tp-hero { height: 22px; border-radius: 6px; }
.theme-prev .tp-btn { height: 10px; width: 70%; border-radius: 4px; margin-top: auto; }
.theme-name { position: relative; flex-direction: column; align-items: flex-start; gap: 1px; }
.theme-name > span:first-child { font-size: .95rem; }
.theme-check { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 99px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
.theme-check .i { width: 14px; height: 14px; }

/* ============================================================
   Search
   ============================================================ */
.search-field { position: relative; }
.search-field .input { padding-right: 44px; }
.search-field input::-webkit-search-cancel-button { display: none; }
.search-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 99px; display: none; place-items: center; color: var(--text-muted); background: var(--surface-3); }
.search-clear:hover { color: var(--text); }
.search-clear .i { width: 16px; height: 16px; }
.search-field.has-value .search-clear { display: grid; }
.search-help { grid-column: 1 / -1; font-size: .75rem; color: var(--text-faint); padding: 0 4px; }
.search-help code { font-size: .72rem; }
mark.hl { background: color-mix(in srgb, #facc15 55%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.result-line { display: flex; align-items: center; gap: 8px; padding: 10px 20px; font-size: .85rem; color: var(--text-muted); border-bottom: var(--border-w) solid var(--border); background: var(--surface-2); }
.result-line .link { font-size: .85rem; }
.dl-item.dim { opacity: .45; }
.card-row.is-susp { opacity: .6; }

/* ============================================================
   Popovers & tooltips
   ============================================================ */
.popover { position: fixed; z-index: 90; width: min(320px, calc(100vw - 20px)); background: var(--surface-solid, var(--surface)); border: var(--border-w) solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); padding: 16px; animation: pop .16s ease; }
.pop-head { display: flex; align-items: center; gap: 12px; }
.pop-head b { font-size: 1rem; }
.pop-flame, .pop-cloud { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, #f97316 15%, var(--surface)); color: #f97316; }
.pop-flame .i, .pop-cloud .i { width: 24px; height: 24px; }
.pop-flame.cold { color: var(--text-faint); background: var(--surface-2); }
.pop-cloud { color: var(--text-faint); background: var(--surface-2); }
.pop-cloud.ok { color: var(--mature); background: color-mix(in srgb, var(--mature) 14%, var(--surface)); }
.pop-cloud.busy { color: var(--learn); } .pop-cloud.err { color: var(--due); background: color-mix(in srgb, var(--due) 12%, var(--surface)); }
.week-dots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 14px; text-align: center; }
.week-dots div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .7rem; font-weight: 700; color: var(--text-faint); }
.week-dots i { width: 30px; height: 30px; border-radius: 99px; background: var(--surface-2); border: 2px solid var(--border); display: grid; place-items: center; }
.week-dots .on i { background: #f97316; border-color: #f97316; color: #fff; }
.week-dots .on i .i { width: 15px; height: 15px; stroke-width: 3; }
.week-dots .today span { color: var(--text); }
.week-dots .today i { border-color: var(--text-faint); }
.pop-freeze { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius-xs); background: var(--surface-2); font-size: .85rem; }
.pop-freeze > .i { color: #38bdf8; margin-top: 2px; }
.pop-actions { display: flex; gap: 8px; margin-top: 12px; }
.pop-actions .btn { flex: 1; }
.chart-tip { position: fixed; z-index: 150; pointer-events: none; display: none; max-width: 260px; background: var(--surface-solid, var(--surface)); color: var(--text); border: var(--border-w) solid var(--border-strong); border-radius: 10px; padding: 8px 11px; font-size: .8rem; line-height: 1.45; box-shadow: var(--shadow-lg); }
.chart-tip b { display: block; margin-bottom: 3px; font-size: .82rem; }
.tip-row { display: flex; align-items: center; gap: 7px; }
.tip-row em { margin-left: auto; padding-left: 14px; font-style: normal; font-weight: 800; }
.tip-foot { margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: .75rem; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }

/* ============================================================
   Stats (Anki-like)
   ============================================================ */
.stats-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.stats-scope { min-width: 260px; }
@media (max-width: 560px) { .stats-scope { min-width: 0; width: 100%; } }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.stats-grid .stat-card.wide { grid-column: 1 / -1; }
@media (max-width: 900px) { .stats-grid { grid-template-columns: 1fr; } }
.stat-card { min-width: 0; }
.stat-title { font-size: 1.05rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.stat-sub { font-size: .8rem; color: var(--text-muted); margin-top: 3px; }
.stat-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 16px; margin-bottom: 12px; }
.stat-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.seg-sm { padding: 3px; }
.seg-sm button { min-height: 30px; padding: 5px 10px; font-size: .78rem; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 700; color: var(--text-muted); cursor: pointer; }
.check input { accent-color: var(--primary); width: 16px; height: 16px; }
.stat-text p + p { margin-top: 6px; }
.stat-text { font-size: .92rem; }
.chart { width: 100%; min-height: 60px; }
.chart svg { display: block; overflow: visible; max-width: 100%; height: auto; }
.chart text { fill: var(--text-faint); font-size: 11px; font-family: var(--font); }
.chart .grid { stroke: var(--border); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .axis { stroke: var(--border-strong); }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .hit.on { fill: color-mix(in srgb, var(--text) 7%, transparent); }
.chart .slice { cursor: pointer; transition: opacity .15s; }
.chart .slice.on { opacity: .8; }
.chart .donut-num { font-size: 26px; font-weight: 800; fill: var(--text); }
.chart.donut { width: auto; flex: none; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chart-legend button, .chart-legend > span { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; color: var(--text-muted); padding: 4px 9px; border-radius: 99px; border: var(--border-w) solid var(--border); background: var(--surface-2); }
.chart-legend button.off { opacity: .45; text-decoration: line-through; }
.chart-legend.static > span { background: none; border: 0; padding: 2px 6px; }
.stat-facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 14px 0 0; font-size: .85rem; }
.stat-facts dt { color: var(--text-muted); text-align: right; }
.stat-facts dd { margin: 0; font-weight: 700; }
.no-data { display: grid; place-items: center; min-height: 140px; color: var(--text-faint); font-weight: 700; font-size: .85rem; letter-spacing: .02em; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); text-align: center; padding: 16px; }
.donut-wrap { display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap; margin-top: 10px; }
.stat-table { border-collapse: collapse; font-size: .85rem; }
.stat-table td, .stat-table th { padding: 5px 10px; text-align: right; white-space: nowrap; }
.stat-table td:first-child, .stat-table th:first-child { text-align: left; }
.legend-table td:first-child { display: flex; align-items: center; gap: 8px; }
.legend-table tr.total td { border-top: 1px solid var(--border); font-weight: 800; }
.table-scroll { overflow-x: auto; margin-top: 10px; }
.retention { width: 100%; }
.retention thead th { font-size: .78rem; border-bottom: 1px solid var(--border-strong); }
.retention tbody th { font-weight: 700; }
.retention tbody tr + tr { border-top: 1px solid var(--border); }
.retention .c-young { color: color-mix(in srgb, var(--mature) 70%, var(--text)); }
.retention .c-mature { color: var(--mature); }
.year-nav { display: flex; align-items: center; gap: 6px; }
.year-nav b { min-width: 44px; text-align: center; }
.year-nav button:disabled { opacity: .3; }
.cal-wrap { display: flex; gap: 6px; }
.cal-days { display: grid; grid-template-rows: repeat(7, 13px); gap: 3px; font-size: .62rem; color: var(--text-faint); font-weight: 700; padding-top: 0; }
.cal-days span { line-height: 13px; }
.heatmap.year { grid-template-rows: repeat(7, 13px); grid-auto-columns: 13px; }
.heatmap i.pad { background: transparent; }
.heatmap i.future { opacity: .4; }
.heatmap i:not(.pad):hover, .heatmap i.on { outline: 2px solid var(--text); outline-offset: 0; }
.cal-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; }
.cal-scale { display: inline-flex; align-items: center; gap: 3px; font-size: .7rem; color: var(--text-faint); }
.cal-scale i { width: 11px; height: 11px; border-radius: 3px; background: var(--surface-2); display: inline-block; }
.cal-scale i.l1 { background: color-mix(in srgb, var(--primary) 30%, var(--surface-2)); }
.cal-scale i.l2 { background: color-mix(in srgb, var(--primary) 55%, var(--surface-2)); }
.cal-scale i.l3 { background: color-mix(in srgb, var(--primary) 80%, var(--surface-2)); }
.cal-scale i.l4 { background: var(--primary); }
button.deck-progress-row { width: 100%; text-align: left; border-radius: var(--radius-xs); padding: 8px 6px; }
button.deck-progress-row:hover { background: var(--surface-2); }

/* ============================================================
   Notes, flags, menus, bulk edit, options
   ============================================================ */
.cloze { color: var(--primary); font-weight: 800; background: color-mix(in srgb, var(--primary) 14%, transparent); border-radius: 5px; padding: 0 5px; }
.tb-cloze { display: none; }
.cloze-on .tb-cloze { display: grid; }
.tb-sep.tb-cloze { display: none; }
.cloze-on .tb-sep.tb-cloze { display: block; }
.tb-wide { width: auto; padding: 0 9px; font-family: var(--font); font-size: .85rem; color: var(--primary); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .two-col { grid-template-columns: 1fr; } }
.type-static { display: flex; align-items: center; font-weight: 700; }
kbd.k { white-space: nowrap; }
.head-tools { display: flex; gap: 2px; }
@media (min-width: 961px) { .dl-item { padding-left: calc(10px + var(--d, 0) * 16px); } }
@media (max-width: 960px) { .dl-item[style*="--d:1"], .dl-item[style*="--d:2"], .dl-item[style*="--d:3"] { opacity: .92; } }
.fc-badges { display: inline-flex; align-items: center; gap: 6px; }
.fc-badges .i { width: 1.05em; height: 1.05em; }
.card-row.selected { background: var(--primary-soft); }
.row-check { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--border-strong); display: grid; place-items: center; flex: none; margin-top: 2px; color: var(--on-primary); }
.row-check.on { background: var(--primary); border-color: var(--primary); }
.row-check .i { width: 14px; height: 14px; stroke-width: 3; }
.card-row .meta .i { width: 1em; height: 1em; vertical-align: -.15em; }
.bulk-bar { position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 20; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px; margin: 0; background: var(--surface-solid, var(--surface)); border-top: var(--border-w) solid var(--border-strong); box-shadow: 0 -8px 24px rgba(0,0,0,.12); }
.bulk-bar > span { margin-right: auto; font-size: .9rem; }
@media (max-width: 767px) { .bulk-bar { bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); } }

.popover.menu { padding: 6px; width: min(300px, calc(100vw - 20px)); max-height: min(78vh, 560px); overflow-y: auto; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: var(--radius-xs); font-size: .9rem; font-weight: 600; text-align: left; color: var(--text); min-height: 40px; }
.menu-item:hover { background: var(--surface-2); }
.menu-item.danger { color: var(--due); }
.menu-item .i { color: var(--text-muted); }
.menu-item.danger .i { color: var(--due); }
.menu-item > span:not(.i) { flex: 1; }
.menu-item kbd.k { margin-left: auto; opacity: .7; }
.menu-sep { height: 1px; background: var(--border); margin: 4px 6px; }
.menu-flags { display: flex; justify-content: space-between; padding: 6px 8px; }
.menu-flags button { width: 34px; height: 34px; border-radius: 99px; display: grid; place-items: center; color: var(--c); border: 2px solid transparent; }
.menu-flags button:hover { background: color-mix(in srgb, var(--c) 15%, transparent); }
.menu-flags button.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }

.info-q { padding: 12px 14px; border-radius: var(--radius-sm); background: var(--surface-2); font-weight: 700; margin-bottom: 14px; }
.info-grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; font-size: .88rem; }
.info-grid dt { color: var(--text-muted); }
.info-grid dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.info-log td, .info-log th { text-align: left; font-size: .8rem; }
.info-log .g1 { color: var(--again); font-weight: 800; } .info-log .g2 { color: var(--hard); font-weight: 800; }
.info-log .g3 { color: var(--good); font-weight: 800; } .info-log .g4 { color: var(--easy); font-weight: 800; }

.opt-row { align-items: center; }
.opt-ctl { flex: none; }
.opt-ctl .select { min-width: 220px; }
.opt-short { width: 110px; text-align: right; }
.opt-num { display: flex; align-items: center; gap: 8px; }
.opt-num .input { width: 100px; text-align: right; }
.opt-num span { color: var(--text-muted); font-weight: 700; }
@media (max-width: 560px) { .opt-ctl { width: 100%; } .opt-ctl .select, .opt-ctl .input { width: 100%; } .opt-short, .opt-num .input { width: 100%; } }
.backup-list { margin-top: 10px; display: grid; gap: 6px; }
.backup-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: var(--radius-xs); background: var(--surface-2); font-size: .82rem; flex-wrap: wrap; }
.backup-row > span:last-child { display: inline-flex; align-items: center; gap: 4px; }

.i-flag { fill: currentColor; stroke: currentColor; stroke-width: 1.5; }
.menu-flags .i { width: 20px; height: 20px; }
.switch { display: inline-block; }

details.search-help summary { cursor: pointer; font-weight: 700; color: var(--text-muted); list-style: none; }
details.search-help p { margin-top: 6px; line-height: 1.9; }

.opt-sec { font-size: 1.05rem; font-weight: 800; margin: 26px 0 2px; padding-bottom: 8px; border-bottom: var(--border-w) solid var(--border-strong); }
.opt-sec:first-child { margin-top: 12px; }
.opt-block { flex-direction: column; align-items: stretch; gap: 10px; }
.opt-block .opt-ctl { width: 100%; }
.limit-tabs { display: flex; width: 100%; margin-bottom: 8px; }
.limit-tabs button { flex: 1; }
.opt-block [data-lim] { width: 100%; }
.preset-bar { display: flex; gap: 8px; align-items: center; }
.preset-bar .select { flex: 1; min-width: 0; }
.days-grid { display: grid; grid-template-columns: 1fr repeat(3, 70px); gap: 4px 6px; align-items: center; font-size: .82rem; font-weight: 700; color: var(--text-muted); text-align: center; }
.days-grid .dname { text-align: left; color: var(--text); font-weight: 600; }
.dradio { position: relative; display: grid; place-items: center; cursor: pointer; padding: 6px; }
.dradio input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; }
.dradio i { width: 22px; height: 22px; border-radius: 99px; border: 2px solid var(--border-strong); display: block; }
.dradio input:checked + i { border-color: var(--primary); background: radial-gradient(circle, var(--primary) 0 45%, transparent 50%); }
.dradio input:focus-visible + i { box-shadow: 0 0 0 3px var(--ring); }

</style>

moji":"🏠","description":""},{"id":"stats","name":"Statistiques & données","emoji":"📊","description":""}];
const SEED_CARDS_RAW = [{"id":"seed_eco_0","deckId":"eco","front":"Brut, net, net imposable : quelle différence ?","back":"Brut = avant cotisations. Net = après cotisations. Net imposable = la base sur laquelle l’impôt est calculé.","hint":"Depuis 2019, l’impôt est prélevé à la source : ce qui arrive sur ton compte s’appelle le « net payé après impôt ».","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_1","deckId":"eco","front":"Le SMIC, c’est quoi ?","back":"Le salaire minimum légal : aucun salarié à temps plein ne peut être payé en dessous.","hint":"SMIC = Salaire Minimum Interprofessionnel de Croissance. Il suit l’inflation et est revalorisé au moins chaque 1er janvier.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_2","deckId":"eco","front":"Comment passer du brut annuel au net mensuel, en gros ?","back":"Net ≈ brut × 0,78 (non-cadre), puis ÷ 12. Pour un cadre, compte plutôt × 0,75.","hint":"Exemple : 2 000 € brut/mois ≈ 1 560 € net/mois. Règle du pouce, pas un calcul exact.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_3","deckId":"eco","front":"Barème progressif de l’impôt sur le revenu : que faut-il comprendre ?","back":"Chaque tranche est taxée à son propre taux. Passer dans la tranche supérieure ne te fait PAS perdre d’argent.","hint":"Seule la part de revenu au-dessus du seuil est taxée au taux supérieur, pas tout ton revenu.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_4","deckId":"eco","front":"TVA, impôt, cotisation sociale : trois choses différentes","back":"TVA = taxe sur la consommation payée à chaque achat. Impôt = finance l’État en général. Cotisation = finance ta protection sociale (retraite, chômage, santé).","hint":"Le taux normal de TVA en France est de 20 %.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_5","deckId":"eco","front":"CSG et CRDS","back":"Contributions prélevées sur les revenus pour financer la Sécu (CSG) et rembourser sa dette (CRDS).","hint":"Elles frappent les salaires mais aussi les revenus du capital (intérêts, dividendes, loyers).","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_6","deckId":"eco","front":"Taux nominal vs TAEG","back":"Le TAEG est le coût TOTAL du crédit (intérêts + frais + assurance). Le taux nominal ne compte que les intérêts.","hint":"Pour comparer deux crédits, regarde toujours le TAEG.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_7","deckId":"eco","front":"Taux d’usure","back":"Le taux maximum légal qu’un prêteur a le droit d’appliquer à un crédit.","hint":"Il protège l’emprunteur contre les prêts abusifs.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_8","deckId":"eco","front":"L’inflation","back":"La hausse générale et durable des prix : ta monnaie achète moins qu’avant.","hint":"Si l’inflation est de 3 % et que ton livret rapporte 2 %, tu perds 1 % de pouvoir d’achat.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_9","deckId":"eco","front":"Taux d’intérêt réel","back":"Taux nominal − inflation : ce que tu gagnes vraiment en pouvoir d’achat.","hint":"Un placement à 4 % avec 2 % d’inflation rapporte 2 % réels.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_10","deckId":"eco","front":"Pourquoi une hausse des taux de la BCE rend les crédits plus chers ?","back":"Les banques se refinancent plus cher auprès de la BCE, donc elles prêtent plus cher. Ça freine la consommation et donc l’inflation.","hint":"Les taux directeurs, c’est « le prix de l’argent ».","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_11","deckId":"eco","front":"Crédit immobilier, crédit conso, découvert : l’ordre du coût ?","back":"Immobilier (le moins cher) < consommation < découvert (le plus cher).","hint":"Plus la durée est longue et la garantie solide (le bien acheté), plus le taux est bas.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_12","deckId":"eco","front":"Le Livret A","back":"Épargne sans risque, disponible à tout moment, intérêts exonérés d’impôt, plafond de 22 950 €.","hint":"Le taux est fixé par l’État et révisé le 1er février et le 1er août.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_13","deckId":"eco","front":"LDDS et LEP","back":"LDDS : comme le Livret A, plafond 12 000 €. LEP : meilleur taux, réservé aux revenus modestes, plafond 10 000 €.","hint":"Les deux sont sans risque et exonérés d’impôt.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_14","deckId":"eco","front":"PEL et CEL","back":"PEL : épargne logement à taux fixe garanti à l’ouverture, 4 à 10 ans, un retrait avant 4 ans clôture le plan. CEL : plus souple, plafond 15 300 €.","hint":"Plan (PEL) = engagement dans la durée. Compte (CEL) = plus libre.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_15","deckId":"eco","front":"Le PEA","back":"Plan d’Épargne en Actions : investir en actions européennes, versements plafonnés à 150 000 €, fiscalité allégée après 5 ans.","hint":"Retirer avant 5 ans clôture le plan (sauf cas particuliers).","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_16","deckId":"eco","front":"L’assurance-vie","back":"Une enveloppe d’épargne (pas seulement une assurance décès) : fonds en euros garanti ou unités de compte plus risquées. Fiscalité avantageuse après 8 ans.","hint":"C’est aussi un outil de transmission : les capitaux transmis aux bénéficiaires ont un cadre fiscal favorable.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_17","deckId":"eco","front":"Action vs obligation","back":"Action = tu deviens propriétaire d’une petite part d’une entreprise. Obligation = tu prêtes de l’argent à une entreprise ou un État.","hint":"Action = potentiel de gain plus élevé, plus risqué. Obligation = revenus plus prévisibles.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_18","deckId":"eco","front":"ETF vs fonds","back":"ETF = panier d’actifs coté en bourse qui copie un indice (frais faibles). Fonds = panier géré activement par un professionnel (frais plus élevés).","hint":"ETF = Exchange Traded Fund, appelé aussi « tracker ».","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_19","deckId":"eco","front":"Le dividende","back":"La part du bénéfice qu’une entreprise verse à ses actionnaires.","hint":"Le prix de l’action baisse en général du montant du dividende le jour du détachement.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_20","deckId":"eco","front":"Les intérêts composés","back":"Les intérêts génèrent eux-mêmes des intérêts : l’effet « boule de neige ».","hint":"1 000 € à 5 % par an valent environ 1 629 € au bout de 10 ans.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_21","deckId":"eco","front":"Épargner vs investir","back":"Épargner = mettre de côté avec un risque faible. Investir = accepter un risque pour viser un rendement plus élevé.","hint":"Plus de rendement potentiel = plus de risque. On ne peut pas avoir l’un sans l’autre.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_22","deckId":"eco","front":"Le CAC 40","back":"L’indice des 40 plus grandes entreprises cotées à la Bourse de Paris.","hint":"Un indice est un thermomètre du marché. Tu ne l’achètes pas directement, mais un ETF peut le copier.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_23","deckId":"eco","front":"BCE, Banque de France, banques commerciales","back":"BCE : fixe la politique monétaire de la zone euro. Banque de France : relais national et supervision. Banques commerciales : gèrent ton compte et te prêtent de l’argent.","hint":"La BCE est à Francfort, elle ne gère pas les comptes des particuliers.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_24","deckId":"eco","front":"Une récession","back":"Une baisse du PIB pendant au moins deux trimestres consécutifs (définition usuelle).","hint":"Le contraire d’une période de croissance.","detail":"","tags":[],"repetitions":0,"interval":0,"easeFactor":2.5,"dueDate":"2026-09-24T15:36:26.785Z","laps":0},{"id":"seed_eco_25","deckId":"eco","front":"PIB vs PIB par habitant","back":"PIB = richesse produite par un pays en un an. PIB par habitant = PIB ÷ population, une mesure grossière du niveau de vie.","hint":"L’Inde a un très gros PIB mais un PIB par habitant bien plus faible que la France.
