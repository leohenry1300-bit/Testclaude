                <h4 class="stat-title" style="margin-bottom:8px">Maîtrise par paquet</h4>
                ${deckRows.map(r => `
                <button class="deck-progress-row" data-action="stats-deck" data-deck="${esc(r.dk.id)}" data-tip="${esc(tipRows(`${esc(r.dk.emoji)} ${esc(this.deckPath(r.dk.id))}`, ['new', 'learn', 'due', 'mature'].map(k => ({ label: STATUS[k].label, value: r.c[k], color: STATUS[k].color }))))}">
                    <span class="nm">${esc(r.dk.emoji)} ${esc(this.deckPath(r.dk.id))}</span>
                    <div class="progress"><i style="width:${r.n ? r.c.mature / r.n * 100 : 0}%;background:var(--mature)"></i><i style="width:${r.n ? r.c.learn / r.n * 100 : 0}%;background:var(--learn)"></i><i style="width:${r.n ? r.c.due / r.n * 100 : 0}%;background:var(--due)"></i></div>
                    <b>${r.pct}%</b>
                </button>`).join('') || '<p class="small muted">Aucun paquet.</p>'}
            </div>
        </div>`;
        this.drawCharts();
    },
    drawCharts(onlyId) {
        $$('[data-chart-box]').forEach(box => {
            const id = box.dataset.chartBox, def = this.chartDefs && this.chartDefs[id];
            if (!def || (onlyId && id !== onlyId)) return;
            const W = Math.max(260, Math.floor(box.clientWidth));
            box.innerHTML = def(W);
        });
    },

    /* ---------- Aujourd'hui ---------- */
    statToday({ revlog }) {
        const t0 = startOfDay();
        const today = revlog.filter(r => r[0] >= t0);
        let body;
        if (!today.length) body = `<p class="muted">Aucune carte étudiée aujourd'hui.</p>`;
        else {
            const secs = today.reduce((a, r) => a + (r[6] || 0), 0) / 1000;
            const graded = today.filter(r => r[2]);
            const again = graded.filter(r => r[2] === 1).length;
            const k = { learn: 0, young: 0, mature: 0, relearn: 0, cram: 0 };
            today.forEach(r => { k[revKind(r)]++; });
            const mat = today.filter(r => r[3] === 1 && (r[5] || 0) >= MATURE_IVL);
            const matOk = mat.filter(r => r[2] >= 2).length;
            body = `<p>Étudié <b>${plural(today.length, 'carte')}</b> en <b>${fmtDuration(secs)}</b> aujourd'hui (${fmtNum(secs / today.length)} s/carte).</p>
                <p>Nombre de « Raté » : <b>${again}</b> (${pctStr(graded.length - again, graded.length)} de réponses correctes).</p>
                <p>Apprentissage : <b>${k.learn}</b> · Révision : <b>${k.young + k.mature}</b> · Réapprentissage : <b>${k.relearn}</b> · Entraînement : <b>${k.cram}</b></p>
                ${mat.length ? `<p>Cartes matures : <b>${matOk}/${mat.length}</b> réussies (${pctStr(matOk, mat.length)}).</p>` : ''}`;
        }
        return `<section class="panel panel-pad stat-card"><h4 class="stat-title">Aujourd'hui</h4><div class="stat-text">${body}</div></section>`;
    },

    /* ---------- Charge de travail (prévisions) ---------- */
    statForecast({ cards }) {
        const ui = this.statsUi, today = dayKey(), todayStart = startOfDay();
        const items = cards.filter(c => c.state !== 'new' && !c.suspended).map(c => {
            const idx = Math.max(0, daysBetweenKeys(today, dayKey(c.due)));
            const key = c.state === 'review' ? (c.interval >= MATURE_IVL ? 'mature' : 'young') : 'learn';
            return { idx, key, overdue: c.due < todayStart, ivl: c.interval, review: c.state === 'review' };
        });
        const maxIdx = items.reduce((a, x) => Math.max(a, x.idx), 0);
        const days = ui.fcRange === 'all' ? Math.max(31, maxIdx + 1) : Number(ui.fcRange);
        const inRange = items.filter(x => x.idx < days);
        const total = inRange.length, tomorrow = items.filter(x => x.idx === 1).length, overdue = items.filter(x => x.overdue).length;
        const load = Math.round(items.filter(x => x.review).reduce((a, x) => a + 1 / Math.max(1, x.ivl), 0));
        const series = [
            { key: 'learn', label: 'En apprentissage', color: 'var(--learn)' },
            { key: 'young', label: 'Récentes', color: YOUNG_COLOR },
            { key: 'mature', label: 'Matures', color: 'var(--mature)' }
        ];
        this.chartDefs.forecast = W => {
            const k = Math.max(1, Math.ceil(days / Math.floor((W - 90) / 5)));
            const n = Math.ceil(days / k);
            const hidden = ui.hidden.forecast || new Set();
            const ser = series.map(s => ({ ...s, values: new Array(n).fill(0) }));
            inRange.forEach(x => { ser.find(s => s.key === x.key).values[Math.floor(x.idx / k)]++; });
            let run = 0;
            const cumul = ui.fcCumul ? Array.from({ length: n }, (_, i) => (run += ser.filter(s => !hidden.has(s.key)).reduce((a, s) => a + s.values[i], 0))) : null;
            const dayT = i => addDays(Date.now(), i * k);
            return barsSVG(W, {
                n, series: ser, hidden, minMax: 4,
                line: cumul ? { values: cumul, color: 'var(--text-faint)', label: 'Cumul' } : null,
                xLabel: i => (i === 0 ? 'Auj.' : k === 1 && days <= 31 ? shortDate(dayT(i)) : `+${i * k} j`),
                tooltip: i => {
                    const title = k === 1 ? (i === 0 ? "Aujourd'hui" : i === 1 ? 'Demain' : longDate(dayT(i))) : `Du ${shortDate(dayT(i))} au ${shortDate(dayT(i + 1) - DAY)}`;
                    const tot = ser.reduce((a, s) => a + s.values[i], 0);
                    return tipRows(title, ser.map(s => ({ label: s.label, value: s.values[i], color: s.color })), `Total : ${tot}${cumul ? ` · cumul : ${cumul[i]}` : ''}${i === 0 && overdue ? ` · dont ${overdue} en retard` : ''}`);
                }
            });
        };
        return `<section class="panel panel-pad stat-card wide">
            <div class="stat-head"><div><h4 class="stat-title">Charge de travail</h4><p class="stat-sub">Nombre de cartes à réviser selon leur jour d'échéance et leur statut.</p></div>
            <div class="stat-opts"><label class="check"><input type="checkbox" data-input="stats-check" data-key="fcCumul" ${ui.fcCumul ? 'checked' : ''}> cumul</label>${this.statSeg('fcRange', [[31, '1 mois'], [90, '3 mois'], [365, '1 an'], ['all', 'Tout']])}</div></div>
            ${this.chartBox('forecast')}${this.legend('forecast', series)}
            <dl class="stat-facts"><dt>Total</dt><dd>${plural(total, 'révision')}</dd><dt>Moyenne</dt><dd>${fmtNum(total / days)} révision/jour</dd><dt>Prévues pour demain</dt><dd>${plural(tomorrow, 'révision')}</dd><dt>Charge journalière</dt><dd>${load} révision/jour</dd>${overdue ? `<dt>En retard</dt><dd>${plural(overdue, 'carte')}</dd>` : ''}</dl>
        </section>`;
    },

    /* ---------- Calendrier ---------- */
    statCalendar({ revlog, all }) {
        const ui = this.statsUi, year = ui.calYear;
        const counts = {};
        if (all) Object.assign(counts, this.data.stats.history);
        else revlog.forEach(r => { const k = dayKey(r[0]); counts[k] = (counts[k] || 0) + 1; });
        const vals = Object.values(counts).filter(v => v > 0).sort((a, b) => a - b);
        const q = p => vals.length ? vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] : 1;
        const [q1, q2, q3] = [q(0.25), q(0.5), q(0.75)];
        const first = new Date(year, 0, 1), lead = (first.getDay() + 6) % 7;
        const today = dayKey();
        let cells = '';
        for (let i = 0; i < lead; i++) cells += '<i class="pad"></i>';
        let yearTotal = 0, activeDays = 0;
        for (let d = new Date(year, 0, 1); d.getFullYear() === year; d.setDate(d.getDate() + 1)) {
            const k = dateKey(d), v = counts[k] || 0;
            yearTotal += v; if (v) activeDays++;
            const lvl = !v ? '' : v <= q1 ? 'l1' : v <= q2 ? 'l2' : v <= q3 ? 'l3' : 'l4';
            cells += `<i class="${lvl}${k === today ? ' today' : ''}${k > today ? ' future' : ''}" data-tip="${esc(`<b>${longDate(d.getTime())}</b><div>${v ? plural(v, 'révision') : 'Aucune révision'}</div>`)}"></i>`;
        }
        const years = Object.keys(counts).map(k => Number(k.slice(0, 4)));
        const minYear = Math.min(new Date().getFullYear(), ...years);
        return `<section class="panel panel-pad stat-card wide">
            <div class="stat-head"><h4 class="stat-title">Calendrier</h4>
                <div class="year-nav">
                    <button class="icon-btn icon-btn-sm" data-action="cal-year" data-delta="-1" ${year <= minYear ? 'disabled' : ''} aria-label="Année précédente">${ic('arrowLeft')}</button>
                    <b>${year}</b>
                    <button class="icon-btn icon-btn-sm" data-action="cal-year" data-delta="1" ${year >= new Date().getFullYear() ? 'disabled' : ''} aria-label="Année suivante" style="transform:scaleX(-1)">${ic('arrowLeft')}</button>
                </div>
            </div>
            <div class="cal-wrap">
                <div class="cal-days"><span>L</span><span></span><span>M</span><span></span><span>V</span><span></span><span>D</span></div>
                <div class="heatmap-scroll"><div class="heatmap year">${cells}</div></div>
            </div>
            <div class="cal-foot"><span class="small muted">${plural(yearTotal, 'révision')} · ${plural(activeDays, 'jour actif', 'jours actifs')} en ${year}</span>
                <span class="cal-scale">Moins <i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> Plus</span></div>
        </section>`;
    },

    /* ---------- Révisions (passé) ---------- */
    statReviews({ revlog, all }) {
        const ui = this.statsUi, today = dayKey();
        const history = this.data.stats.history;
        const firstKeys = [...revlog.map(r => dayKey(r[0])), ...(all ? Object.keys(history) : [])].sort();
        const span = firstKeys.length ? daysBetweenKeys(firstKeys[0], today) + 1 : 1;
        const days = ui.rvRange === 'all' ? Math.max(31, span) : Number(ui.rvRange);
        const useTime = ui.rvTime;
        const series = [
            { key: 'learn', label: 'Apprentissage', color: 'var(--learn)' },
            { key: 'young', label: 'Récentes', color: YOUNG_COLOR },
            { key: 'mature', label: 'Matures', color: 'var(--mature)' },
            { key: 'relearn', label: 'Réapprentissage', color: 'var(--due)' },
            { key: 'cram', label: 'Entraînement', color: PRACTICE_COLOR }
        ];
        const perDay = {}, logCount = {};
        revlog.forEach(r => {
            const k = dayKey(r[0]), ago = daysBetweenKeys(k, today);
            if (ago < 0 || ago >= days) return;
            (perDay[ago] = perDay[ago] || { learn: 0, young: 0, mature: 0, relearn: 0, cram: 0, legacy: 0 })[revKind(r)] += useTime ? (r[6] || 0) / 60000 : 1;
            logCount[k] = (logCount[k] || 0) + 1;
        });
        let legacyTotal = 0;
        if (all && !useTime) {
            Object.entries(history).forEach(([k, v]) => {
                const extra = v - (logCount[k] || 0), ago = daysBetweenKeys(k, today);
                if (extra > 0 && ago >= 0 && ago < days) { (perDay[ago] = perDay[ago] || { learn: 0, young: 0, mature: 0, relearn: 0, cram: 0, legacy: 0 }).legacy += extra; legacyTotal += extra; }
            });
        }
        const allSeries = legacyTotal ? [...series, { key: 'legacy', label: 'Avant le suivi détaillé', color: 'var(--text-faint)' }] : series;
        const dayTotals = Object.values(perDay).map(o => Object.values(o).reduce((a, b) => a + b, 0));
        const studied = dayTotals.filter(v => v > 0).length, total = dayTotals.reduce((a, b) => a + b, 0);
        const unit = v => (useTime ? fmtDuration(v * 60) : plural(Math.round(v), 'révision'));
        this.chartDefs.reviews = W => {
            const k = Math.max(1, Math.ceil(days / Math.floor((W - 90) / 5)));
            const n = Math.ceil(days / k), hidden = ui.hidden.reviews || new Set();
            const ser = allSeries.map(s => ({ ...s, values: new Array(n).fill(0) }));
            Object.entries(perDay).forEach(([ago, o]) => {
                const b = n - 1 - Math.floor(Number(ago) / k);
                if (b < 0) return;
                ser.forEach(s => { s.values[b] += o[s.key] || 0; });
            });
            let run = 0;
            const cumul = Array.from({ length: n }, (_, i) => (run += ser.filter(s => !hidden.has(s.key)).reduce((a, s) => a + s.values[i], 0)));
            const dayT = i => addDays(Date.now(), -((n - 1 - i) * k));
            return barsSVG(W, {
                n, series: ser, hidden, minMax: useTime ? 5 : 4,
                yFmt: v => (useTime ? `${fmtNum(v)} min` : fmtNum(v)),
                line: { values: cumul, color: 'var(--text-faint)', fmt: v => (useTime ? `${Math.round(v)}m` : fmtNum(v)) },
                xLabel: i => (i === n - 1 ? 'Auj.' : k === 1 && days <= 31 ? shortDate(dayT(i)) : `-${(n - 1 - i) * k} j`),
                tooltip: i => {
                    const title = k === 1 ? (i === n - 1 ? "Aujourd'hui" : longDate(dayT(i))) : `Du ${shortDate(dayT(i) - (k - 1) * DAY)} au ${shortDate(dayT(i))}`;
                    const tot = ser.reduce((a, s) => a + s.values[i], 0);
                    return tipRows(title, ser.filter(s => s.values[i] > 0).map(s => ({ label: s.label, value: useTime ? fmtDuration(s.values[i] * 60) : s.values[i], color: s.color })), `Total : ${unit(tot)}`);
                }
            });
        };
        return `<section class="panel panel-pad stat-card wide">
            <div class="stat-head"><div><h4 class="stat-title">Révisions</h4><p class="stat-sub">Le nombre de révisions (ou le temps passé) par jour, selon le statut de la carte.</p></div>
            <div class="stat-opts">${this.statSeg('rvTime', [[false, 'Nombre'], [true, 'Durée']])}${this.statSeg('rvRange', [[30, '1 mois'], [90, '3 mois'], [365, '1 an'], ['all', 'Tout']])}</div></div>
            ${total ? this.chartBox('reviews') + this.legend('reviews', allSeries) : '<div class="no-data">Pas encore de données : révise quelques cartes !</div>'}
            <dl class="stat-facts"><dt>Jours étudiés</dt><dd>${studied} sur ${days} (${pctStr(studied, days)})</dd><dt>Total</dt><dd>${unit(total)}</dd><dt>Moyenne (jours étudiés)</dt><dd>${unit(studied ? total / studied : 0)}/jour</dd><dt>Moyenne sur la période</dt><dd>${unit(total / days)}/jour</dd></dl>
        </section>`;
    },

    /* ---------- Nombre de cartes ---------- */
    statCounts({ cards }) {
        const k = { new: 0, learning: 0, relearning: 0, young: 0, mature: 0, suspended: 0 };
        cards.forEach(c => {
            if (c.suspended) k.suspended++;
            else if (c.state === 'review') k[c.interval >= MATURE_IVL ? 'mature' : 'young']++;
            else k[c.state]++;
        });
        const segs = [
            { key: 'new', label: 'Inédites', color: 'var(--new)', value: k.new },
            { key: 'learning', label: 'À repasser', color: 'var(--learn)', value: k.learning },
            { key: 'relearning', label: 'Réapprentissage', color: 'var(--due)', value: k.relearning },
            { key: 'young', label: 'Récentes', color: YOUNG_COLOR, value: k.young },
            { key: 'mature', label: 'Matures', color: 'var(--mature)', value: k.mature },
            { key: 'suspended', label: 'Suspendues', color: '#eab308', value: k.suspended }
        ];
        const total = cards.length;
        this.chartDefs.counts = W => donutSVGi(Math.min(210, W), segs, total, 'cartes');
        return `<section class="panel panel-pad stat-card">
            <h4 class="stat-title">Nombre de cartes</h4><p class="stat-sub">La répartition de tes cartes selon leur statut.</p>
            <div class="donut-wrap">${this.chartBox('counts', 'donut')}
                <table class="stat-table legend-table"><tbody>${segs.map(s => `<tr><td><span class="sw" style="background:${s.color}"></span>${s.label}</td><td>${s.value}</td><td>${total ? Math.round(s.value / total * 100) : 0}%</td></tr>`).join('')}
                <tr class="total"><td>Total</td><td>${total}</td><td></td></tr></tbody></table>
            </div>
        </section>`;
    },

    /* ---------- Intervalles ---------- */
    statIntervals({ cards }) {
        const ui = this.statsUi;
        const ivls = cards.filter(c => (c.state === 'review' || c.state === 'relearning') && !c.suspended).map(c => Math.max(1, c.interval)).sort((a, b) => a - b);
        const med = median(ivls);
        const sub = `<p class="stat-sub">Le nombre de cartes selon leur intervalle de révision (temps avant leur prochaine apparition).</p>`;
        if (!ivls.length) return `<section class="panel panel-pad stat-card"><h4 class="stat-title">Intervalles de révision</h4>${sub}<div class="no-data">Pas encore de cartes en révision.</div></section>`;
        const pctCut = p => ivls[Math.min(ivls.length - 1, Math.ceil(p * ivls.length) - 1)];
        const maxIvl = ui.ivRange === '1m' ? 31 : ui.ivRange === 'p50' ? pctCut(0.5) : ui.ivRange === 'p95' ? pctCut(0.95) : ivls[ivls.length - 1];
        this.chartDefs.intervals = W => {
            const k = Math.max(1, Math.ceil((maxIvl + 1) / Math.min(60, Math.floor((W - 90) / 8))));
            const n = Math.max(1, Math.ceil((maxIvl + 1) / k));
            const vals = new Array(n).fill(0);
            ivls.forEach(v => { if (v <= maxIvl) vals[Math.floor(v / k)]++; });
            let run = 0;
            const cum = vals.map(v => (run += v) / ivls.length * 100);
            const range = i => (k === 1 ? fmtDays(i) : `${fmtDays(Math.max(1, i * k))} à ${fmtDays(i * k + k - 1)}`);
            return barsSVG(W, {
                n, series: [{ key: 'c', label: 'Cartes', color: 'var(--primary)', values: vals }], minMax: 4,
                line: { values: cum, max: 100, color: 'var(--text-faint)', fmt: v => `${Math.round(v)}%` },
                xLabel: i => (i === 0 && k === 1 ? '' : fmtDays(Math.max(1, i * k))),
                tooltip: i => (vals[i] ? tipRows(range(i), [{ label: 'Cartes', value: vals[i], color: 'var(--primary)' }], `${fmtNum(cum[i])} % des cartes ont un intervalle plus court`) : '')
            });
        };
        return `<section class="panel panel-pad stat-card">
            <div class="stat-head"><div><h4 class="stat-title">Intervalles de révision</h4>${sub}</div>
            <div class="stat-opts">${this.statSeg('ivRange', [['1m', '1 mois'], ['p50', '50%'], ['p95', '95%'], ['all', 'Tout']])}</div></div>
            ${this.chartBox('intervals')}
            <dl class="stat-facts"><dt>Intervalle médian</dt><dd>${fmtDays(Math.round(med))}</dd><dt>Intervalle le plus long</dt><dd>${fmtDays(ivls[ivls.length - 1])}</dd></dl>
        </section>`;
    },

    /* ---------- Facilité ---------- */
    statEase({ cards }) {
        const eases = cards.filter(c => (c.state === 'review' || c.state === 'relearning') && !c.suspended).map(c => Math.round(c.ease * 100));
        const sub = `<p class="stat-sub">Moins une carte est facile, plus souvent elle apparaîtra.</p>`;
        if (!eases.length) return `<section class="panel panel-pad stat-card"><h4 class="stat-title">Facilité des cartes</h4>${sub}<div class="no-data">Pas encore de cartes en révision.</div></section>`;
        const lo = 130, hi = Math.max(300, Math.ceil(Math.max(...eases) / 10) * 10 + 10), step = 10;
        const n = (hi - lo) / step, vals = new Array(n).fill(0);
        eases.forEach(e => { vals[clamp(Math.floor((e - lo) / step), 0, n - 1)]++; });
        const color = i => `color-mix(in srgb, var(--due) ${Math.round(100 - i / (n - 1) * 100)}%, var(--mature))`;
        this.chartDefs.ease = W => barsSVG(W, {
            n, series: [{ key: 'c', label: 'Cartes', color: 'var(--primary)', values: vals, colorAt: color }], minMax: 4,
            xLabel: i => `${lo + i * step}%`, labelWidth: 44,
            tooltip: i => (vals[i] ? tipRows(`Facilité ${lo + i * step} à ${lo + i * step + step - 1} %`, [{ label: 'Cartes', value: vals[i], color: color(i) }]) : '')
        });
        return `<section class="panel panel-pad stat-card">
            <h4 class="stat-title">Facilité des cartes</h4>${sub}
            ${this.chartBox('ease')}
            <dl class="stat-facts"><dt>Facilité médiane</dt><dd>${Math.round(median(eases))} %</dd><dt>Cartes « difficiles » (&lt; 200 %)</dt><dd>${eases.filter(e => e < 200).length}</dd></dl>
        </section>`;
    },

    /* ---------- Rétention réelle ---------- */
    statRetention({ revlog }) {
        const reviews = revlog.filter(r => r[3] === 1 && r[2]);
        const t0 = startOfDay();
        const periods = [
            ["Aujourd'hui", t0, Infinity], ['Hier', t0 - DAY, t0], ['Semaine dernière', t0 - 6 * DAY, Infinity],
            ['Mois dernier', t0 - 29 * DAY, Infinity], ['Année passée', t0 - 364 * DAY, Infinity], ['Depuis le début', 0, Infinity]
        ];
        const rows = periods.map(([label, a, b]) => {
            const inP = reviews.filter(r => r[0] >= a && r[0] < b);
            const y = inP.filter(r => (r[5] || 0) < MATURE_IVL), m = inP.filter(r => (r[5] || 0) >= MATURE_IVL);
            const ok = arr => arr.filter(r => r[2] >= 2).length;
            return `<tr><th>${label}</th><td class="c-young">${pctStr(ok(y), y.length)}</td><td class="c-mature">${pctStr(ok(m), m.length)}</td><td>${pctStr(ok(inP), inP.length)}</td><td class="faint">${inP.length}</td></tr>`;
        }).join('');
        return `<section class="panel panel-pad stat-card">
            <h4 class="stat-title">Rétention réelle</h4><p class="stat-sub">Taux de réussite des cartes révisées avec un intervalle ≥ 1 jour (tout sauf « Raté »).</p>
            <div class="table-scroll"><table class="stat-table retention"><thead><tr><th></th><th class="c-young">Récentes</th><th class="c-mature">Matures</th><th>Total</th><th class="faint">Nombre</th></tr></thead><tbody>${rows}</tbody></table></div>
        </section>`;
    },

    /* ---------- Répartition horaire ---------- */
    statHourly({ revlog }) {
        const ui = this.statsUi, since = startOfDay() - (Number(ui.hrRange) - 1) * DAY;
        const cnt = new Array(24).fill(0), ok = new Array(24).fill(0);
        revlog.forEach(r => {
            if (r[0] < since || !r[2]) return;
            const h = new Date(r[0]).getHours();
            cnt[h]++; if (r[2] >= 2) ok[h]++;
        });
        const rate = cnt.map((c, i) => (c ? ok[i] / c * 100 : null));
        const total = cnt.reduce((a, b) => a + b, 0);
        const best = total ? cnt.map((c, i) => [c >= 3 ? rate[i] : -1, i]).sort((a, b) => b[0] - a[0])[0] : null;
        this.chartDefs.hourly = W => barsSVG(W, {

        this.change('déplacement', cards.map(c => c.id), () => { cards.forEach(c => { c.deckId = deckId; }); });
        this.render();
        this.undoToast(`${plural(cards.length, 'carte')} déplacée${cards.length > 1 ? 's' : ''}`, ic('folder'));
    },
    opTags(ids, add, remove) {
        const cards = this.cardsByIds(this.expandNotes(ids)), rm = remove.map(fold);
        this.change('tags', cards.map(c => c.id), () => { cards.forEach(c => { c.tags = [...c.tags.filter(t => !rm.includes(fold(t))), ...add.filter(t => !c.tags.some(x => fold(x) === fold(t)))]; }); });
        this.render();
        this.undoToast(`Tags modifiés (${plural(cards.length, 'carte')})`, ic('tag'));
    },
    opReplace(ids, find, repl, scope, caseSens) {
        const cards = this.cardsByIds(this.expandNotes(ids));
        let n = 0;
        this.change('chercher / remplacer', cards.map(c => c.id), () => {
            const seen = new Set();
            cards.forEach(c => {
                const key = c.nid || c.id;
                if (c.nf && seen.has(key)) return;
                seen.add(key);
                const sibs = this.noteSiblings(c), f = noteFieldsOf(c);
                const nf = { front: f.front, back: f.back };
                if (scope !== 'back') nf.front = replaceInHtml(f.front, find, repl, caseSens);
                if (scope !== 'front') nf.back = replaceInHtml(f.back, find, repl, caseSens);
                if (nf.front !== f.front || nf.back !== f.back) {
                    n++;
                    if (c.nf) sibs.forEach(x => { x.nf = c.kind === 'cloze' ? { ...x.nf, text: nf.front, extra: nf.back } : { ...x.nf, front: nf.front, back: nf.back }; materializeCard(x); });
                    else { c.front = nf.front; c.back = nf.back; }
                }
            });
        });
        this.render();
        this.undoToast(n ? `${plural(n, 'note modifiée', 'notes modifiées')}` : 'Aucune occurrence trouvée', ic('check'));
    },
    async opDelete(ids, note = true) {
        const all = note ? this.expandNotes(ids) : ids, cards = this.cardsByIds(all);
        if (!cards.length) return false;
        const ok = await this.confirm({
            title: cards.length > 1 ? `Supprimer ${cards.length} cartes ?` : 'Supprimer la carte ?',
            message: cards.length > 1 ? `Ces ${cards.length} cartes seront supprimées. Tu pourras annuler juste après.` : `« ${esc(truncate(stripHtml(cards[0].front), 90))} » sera supprimée${cards[0].nid && all.length > 1 ? ' avec ses cartes liées' : ''}. Tu pourras annuler juste après.`,
            ok: 'Supprimer', danger: true
        });
        if (!ok) return false;
        const set = new Set(all);
        this.change('suppression', all, () => { this.data.cards = this.data.cards.filter(c => !set.has(c.id)); });
        this.ui.sel = new Set([...this.ui.sel].filter(id => !set.has(id)));
        const s = this.session;
        if (s) {
            s.queue = s.queue.filter(id => !set.has(id));
            if (s.learning) s.learning = s.learning.filter(l => !set.has(l.id));
            if (set.has(s.current)) this.nextCard(); else if (set.has(s.quizCard)) this.nextQuestion();
        } else this.render();
        this.undoToast(`${plural(cards.length, 'carte supprimée', 'cartes supprimées')}`, ic('trash'));
        return true;
    },

    /* ---------- Small dialogs ---------- */
    askText({ title, label, value = '', help = '', ok = 'Valider', placeholder = '', multi = false }) {
        return new Promise(resolve => {
            let done = false;
            const m = this.openModal({
                title, size: 'narrow',
                body: `<div class="field"><label class="label" for="ask-in">${label}</label>${multi ? `<textarea class="textarea" id="ask-in" placeholder="${esc(placeholder)}">${esc(value)}</textarea>` : `<input class="input" id="ask-in" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off">`}${help ? `<p class="help">${help}</p>` : ''}</div>`,
                foot: `<button class="btn btn-soft" data-close>Annuler</button><button class="btn btn-primary" id="ask-ok">${ok}</button>`,
                onClose: () => { if (!done) resolve(null); }
            });
            const input = $('#ask-in', m), go = () => { done = true; this.closeModal(m); resolve(input.value); };
            $('#ask-ok', m).addEventListener('click', go);
            input.addEventListener('keydown', e => { if (e.key === 'Enter' && !multi) { e.preventDefault(); go(); } });
            setTimeout(() => { input.focus(); input.select && input.select(); }, 40);
        });
    },
    async promptDue(ids) {
        const v = await this.askText({ title: 'Date d\'échéance', label: 'Dans combien de jours ?', value: '1', placeholder: '3  ou  3-7', help: 'Un nombre (<b>0</b> = aujourd\'hui) ou une plage (<b>3-7</b>, tirée au hasard). Ajoute <b>!</b> (ex. <b>10!</b>) pour changer aussi l\'intervalle.', ok: 'Valider' });
        if (v === null) return;
        const spec = parseDueSpec(v);
        if (!spec) { this.toast('Format invalide : écris par exemple 5 ou 3-7', 'warning'); return; }
        this.opDue(ids, spec);
    },

            title: 'Déplacer vers un paquet', size: 'narrow',

        });

                   <div class="field"><label class="label" for="tg-rm">Retirer</label><input class="input" id="tg-rm" placeholder="ancien-tag" autocomplete="off"></div>
                   <p class="help">Tags existants : ${[...new Set(this.data.cards.flatMap(c => c.tags))].slice(0, 20).map(t => `<code>${esc(t)}</code>`).join(' ') || 'aucun'}</p>`,
            foot: `<button class="btn btn-soft" data-close>Annuler</button><button class="btn btn-primary" id="tg-ok">${ic('check')}Appliquer</button>`
        });

    promptReplace(ids) {
        const m = this.openModal({
            title: 'Chercher et remplacer', size: 'narrow',
            body: `<p class="small muted" style="margin-bottom:12px">Sur les ${plural(ids.length, 'carte sélectionnée', 'cartes sélectionnées')}.</p>
                   <div class="field"><label class="label" for="rp-find">Chercher</label><input class="input" id="rp-find" autocomplete="off"></div>
                   <div class="field"><label class="label" for="rp-repl">Remplacer par</label><input class="input" id="rp-repl" autocomplete="off"></div>
                   <div class="field"><label class="label" for="rp-scope">Dans</label><select class="select" id="rp-scope"><option value="both">Recto et verso</option><option value="front">Recto seulement</option><option value="back">Verso seulement</option></select></div>
                   <label class="check"><input type="checkbox" id="rp-case"> Respecter la casse</label>`,
            foot: `<button class="btn btn-soft" data-close>Annuler</button><button class="btn btn-primary" id="rp-ok">${ic('check')}Remplacer</button>`

    /* ---------- Generic popover menu ---------- */
    showMenu(anchor, items, { flagCur = null, onFlag = null } = {}) {
        if (this.popover && this.popoverAnchor === anchor) { this.closePopover(); return; }
        this.closePopover();
        const pop = document.createElement('div');
        pop.className = 'popover menu';
        pop.dataset.kind = 'menu';
        pop.innerHTML = items.map((it, i) => {
            if (it.sep) return '<div class="menu-sep"></div>';
            if (it.flags) return `<div class="menu-flags">${FLAGS.slice(1).map((f, k) => `<button data-flag="${k + 1}" class="${flagCur === k + 1 ? 'on' : ''}" title="${f.name}" style="--c:${f.color}">${ic('flag', 'i-flag')}</button>`).join('')}</div>`;
            return `<button class="menu-item ${it.danger ? 'danger' : ''}" data-mi="${i}">${it.icon ? ic(it.icon) : '<span class="i"></span>'}<span>${it.label}</span>${it.kbd ? `<kbd class="k">${it.kbd}</kbd>` : ''}</button>`;
        }).join('');
        document.body.appendChild(pop);
        this.popover = pop; this.popoverAnchor = anchor; this.popoverY = scrollY;
        const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
        pop.style.left = `${clamp(r.right - w, 10, innerWidth - w - 10)}px`;
        pop.style.top = `${r.bottom + 8 + h > innerHeight - 10 ? Math.max(10, r.top - h - 8) : r.bottom + 8}px`;
        pop.addEventListener('click', e => {
            const f = e.target.closest('[data-flag]');
            if (f) { this.closePopover(); onFlag && onFlag(Number(f.dataset.flag)); return; }
            const b = e.target.closest('[data-mi]');
            if (b) { const it = items[Number(b.dataset.mi)]; this.closePopover(); it.fn && it.fn(); }
        });
    },
    cardMenuItems(ids, { inSession = false } = {}) {
        const cards = this.cardsByIds(ids), c = cards[0], single = cards.length === 1;
        const allSusp = cards.every(x => x.suspended), allBur = cards.every(x => x.buriedUntil > Date.now());
        const items = [];
        if (single) {
            items.push({ icon: 'pencil', label: 'Modifier', kbd: 'E', fn: () => this.openCardModal(c.id) });
            items.push({ icon: 'info', label: 'Informations sur la carte', kbd: 'I', fn: () => this.openCardInfo(c.id) });
            items.push({ sep: true });
        }
        items.push({ flags: true });
        items.push({ icon: 'star', label: cards.every(x => x.marked) ? 'Retirer la marque' : 'Marquer la note', kbd: '*', fn: () => this.opMark(ids) });
        items.push({ sep: true });
        items.push({ icon: 'pause', label: allSusp ? 'Réactiver la carte' : 'Suspendre la carte', kbd: '@', fn: () => this.opSuspend(ids, false) });
        if (cards.some(x => x.nid)) items.push({ icon: 'pause', label: 'Suspendre la note (toutes ses cartes)', kbd: '!', fn: () => this.opSuspend(ids, true) });
        items.push({ icon: 'eyeOff', label: allBur ? 'Déterrer la carte' : 'Enfouir jusqu\'à demain', kbd: '-', fn: () => this.opBury(ids, false) });
        if (cards.some(x => x.nid)) items.push({ icon: 'eyeOff', label: 'Enfouir la note', kbd: '=', fn: () => this.opBury(ids, true) });
        items.push({ sep: true });
        items.push({ icon: 'calendar', label: 'Définir la date d\'échéance…', fn: () => this.promptDue(ids) });
        items.push({ icon: 'reset', label: 'Réinitialiser (remettre à zéro)', fn: () => this.opReset(ids) });
        if (!inSession) {
            items.push({ icon: 'folder', label: 'Déplacer vers un paquet…', fn: () => this.promptMove(ids) });
            items.push({ icon: 'tag', label: 'Modifier les tags…', fn: () => this.promptTags(ids) });
            items.push({ icon: 'refresh', label: 'Chercher / remplacer…', fn: () => this.promptReplace(ids) });
        }
        items.push({ sep: true });
        items.push({ icon: 'trash', label: single ? 'Supprimer la note' : `Supprimer ${cards.length} cartes`, danger: true, fn: () => this.opDelete(ids, true) });
        return items;
    },
    sessionMenu(anchor) {
        const s = this.session;
        if (!s || !s.current) return;
        const ids = [s.current], c = this.card(s.current);
        this.showMenu(anchor, this.cardMenuItems(ids, { inSession: true }), { flagCur: c.flag, onFlag: n => this.opFlag(ids, n) });
    },

    /* ============================================================
       Card information
       ============================================================ */
    openCardInfo(id) {
        const c = this.card(id);
        if (!c) return;
        const cfg = this.cfgFor(c), fsr = cfg.scheduler === 'fsrs', now = Date.now();
        const log = this.data.revlog.filter(r => r[1] === id);
        const fmt = t => (t ? new Date(t).toLocaleString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-');
        const first = log.length ? log[0][0] : null, last = c.lastReview || (log.length ? log[log.length - 1][0] : null);
        const fs = fsrsFromCard(c), R = fsrsRetrievability(c, now);
        const total = log.reduce((a, r) => a + (r[6] || 0), 0) / 1000;
        const typeName = ['Apprentissage', 'Révision', 'Réapprentissage', 'Entraînement'];
        const btn = ['', 'Raté', 'Difficile', 'Bien', 'Facile'];
        const stateName = { new: 'Nouvelle', learning: 'En apprentissage', review: c.interval >= MATURE_IVL ? 'Maîtrisée' : 'En révision', relearning: 'Réapprentissage' }[c.state];
        const rows = [
            ['Paquet', esc(this.deckPath(c.deckId))],
            ['Type de note', NOTE_TYPES[c.kind] || 'Basique'],
            ['État', stateName + (c.suspended ? ' · suspendue' : '') + (c.buriedUntil > now ? ' · enfouie' : '')],
            ['Ajoutée le', fmt(c.created)],
            ['Première révision', fmt(first)], ['Dernière révision', fmt(last)],
            ['Prochaine révision', c.state === 'new' ? '-' : fmt(c.due) + ` (${fmtRelativeFuture(c.due)})`],
            ['Intervalle', c.state === 'review' || c.state === 'relearning' ? fmtDays(Math.max(1, c.interval)) : '-'],
            fsr && fs ? ['Stabilité', `${fmtNum(fs.s)} jours`] : ['Facilité', `${Math.round(c.ease * 100)} %`],
            fsr && fs ? ['Difficulté', `${fmtNum(fs.d)} / 10`] : null,
            fsr && R !== null ? ['Probabilité de souvenir', `${Math.round(R * 100)} %`] : null,
            ['Révisions', c.reps], ['Oublis', c.lapses], ['Erreurs en cours', c.errors],
            ['Temps total', fmtDuration(total)], ['Tags', c.tags.length ? esc(c.tags.join(', ')) : '-']
        ].filter(Boolean);
        this.openModal({
            title: 'Informations sur la carte', size: 'wide',
            body: `<div class="rich info-q">${c.front}</div>
                <dl class="info-grid">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
                <h4 class="stat-title" style="margin:18px 0 8px">Historique des révisions</h4>
                ${log.length ? `<div class="table-scroll"><table class="stat-table info-log"><thead><tr><th>Date</th><th>Type</th><th>Réponse</th><th>Intervalle</th><th>Durée</th></tr></thead><tbody>
                    ${[...log].reverse().slice(0, 60).map(r => `<tr><td>${fmt(r[0])}</td><td>${typeName[r[3]] || ''}</td><td class="g${r[2]}">${btn[r[2]] || '-'}</td><td>${r[4] ? fmtDays(r[4]) : '-'}</td><td>${r[6] ? fmtDuration(r[6] / 1000) : '-'}</td></tr>`).join('')}
                    </tbody></table></div>` : '<p class="muted small">Pas encore d\'historique pour cette carte.</p>'}`,
            foot: `<button class="btn btn-soft" data-close>Fermer</button>`
        });
    },

    /* ============================================================
       Custom study
       ============================================================ */
    openCustomStudy(presetDeck) {
        const modes = [
            ['ahead', 'Réviser en avance', 'Les cartes qui ne sont pas encore à revoir mais le seront bientôt.', 'jours', 3],
            ['forgot', 'Réviser les cartes oubliées', 'Les cartes que tu as ratées récemment.', 'derniers jours', 3],
            ['new', 'Apprendre plus de nouvelles cartes', 'Dépasse la limite quotidienne.', 'cartes', 10],
            ['hard', 'Les cartes les plus difficiles', 'Celles que tu rates le plus (sans impact sur le planning).', 'cartes', 20],
            ['tag', 'Réviser par tag', 'Toutes les cartes portant un tag (sans impact sur le planning).', 'cartes max', 30],
            ['all', 'Tout réviser (bachotage)', 'Un échantillon aléatoire, idéal avant un examen (sans impact sur le planning).', 'cartes', 50]
        ];
        let mode = 'ahead';
        const m = this.openModal({
            title: `${ic('sliders')} Révisions personnalisées`,
            body: `<div class="field"><label class="label" for="cs-deck">Paquet</label><select class="select" id="cs-deck"><option value="">Tous les paquets</option>${this.sortedDecks().map(d => `<option value="${esc(d.id)}" ${d.id === presetDeck ? 'selected' : ''}>${esc(d.emoji)} ${esc(this.deckPath(d.id))}</option>`).join('')}</select></div>
                <div class="field"><span class="label">Que veux-tu faire ?</span>
                <div class="pick-list" id="cs-modes" style="max-height:none">${modes.map(([k, t, d]) => `<button class="pick-item ${k === mode ? 'active' : ''}" data-mode="${k}" style="flex-direction:column;align-items:flex-start;gap:2px"><b>${t}</b><span class="small muted" style="font-weight:500">${d}</span></button>`).join('')}</div></div>
                <div class="field" id="cs-tag-wrap" style="display:none"><label class="label" for="cs-tag">Tag</label><input class="input" id="cs-tag" placeholder="chapitre1" autocomplete="off"></div>
                <div class="field"><label class="label" for="cs-n" id="cs-n-label">Nombre</label><input class="input" id="cs-n" type="number" min="1" max="9999" value="3" inputmode="numeric"></div>
                <p class="help" id="cs-count"></p>`,
            foot: `<button class="btn btn-soft" data-close>Annuler</button><button class="btn btn-primary" id="cs-go">${ic('play')}Commencer</button>`
        });
        const deckIds = () => { const v = $('#cs-deck', m).value; return v ? [v] : null; };
        const pool = () => { const set = deckIds() ? new Set(deckIds().flatMap(id => this.descendantIds(id))) : null; return this.data.cards.filter(c => !c.suspended && (!set || set.has(c.deckId))); };
        const select = () => {
            const meta = modes.find(x => x[0] === mode);
            $('#cs-n-label', m).textContent = `Nombre de ${meta[3]}`;
            $('#cs-n', m).value = meta[4];
            $('#cs-tag-wrap', m).style.display = mode === 'tag' ? '' : 'none';
            $$('[data-mode]', m).forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
            count();
        };
        const pick = () => {
            const n = Math.max(1, Math.round(Number($('#cs-n', m).value) || 1)), now = Date.now(), eod = endOfDay(now), cards = pool();
            if (mode === 'ahead') return cards.filter(c => c.state === 'review' && c.due > eod && c.due <= eod + n * DAY);
            if (mode === 'forgot') { const since = now - n * DAY, ids = new Set(this.data.revlog.filter(r => r[0] >= since && r[2] === 1 && r[3] !== 3).map(r => r[1])); return cards.filter(c => ids.has(c.id)); }
            if (mode === 'new') return cards.filter(c => c.state === 'new').slice(0, n);
            if (mode === 'hard') return [...cards].filter(c => c.state !== 'new').sort((a, b) => b.errors - a.errors || b.lapses - a.lapses || a.ease - b.ease).slice(0, n);
            if (mode === 'tag') { const t = fold($('#cs-tag', m).value.trim()); return t ? shuffle(cards.filter(c => c.tags.some(x => fold(x) === t))).slice(0, n) : []; }
            return shuffle([...cards]).slice(0, n);
        };
        const count = () => { const k = pick().length; $('#cs-count', m).textContent = `${plural(k, 'carte trouvée')}.`; $('#cs-go', m).disabled = !k; };
        $('#cs-modes', m).addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b) { mode = b.dataset.mode; select(); } });
        ['#cs-deck', '#cs-n', '#cs-tag'].forEach(sel => $(sel, m).addEventListener('input', count));
        $('#cs-go', m).addEventListener('click', () => {
            const cards = pick();
            if (!cards.length) return;
            const ids = cards.map(c => c.id), title = `${modes.find(x => x[0] === mode)[1]}`;
            this.closeModal(m);
            if (mode === 'ahead' || mode === 'forgot') this.startSrsIds(title, ids);
            else if (mode === 'new') this.startStudy(deckIds() ? deckIds()[0] : null, ids.length);
            else this.startPractice(null, 'flip', 9999, title, ids);
        });
        select();
    },

                if (t > Math.max(l.mod, r.mod)) { localChanged = remoteChanged = true; return; }
                if (sig(l) === sig(r)) { out.push(l); return; }
                const pick = l.mod !== r.mod ? (l.mod > r.mod ? 'l' : 'r') : newer;
                if (pick === 'l') { out.push(l); remoteChanged = true; } else { out.push(r); localChanged = true; }
            } else if (l) {
                if (t > 0 && t >= l.mod) localChanged = true; else { out.push(l); remoteChanged = true; }
            } else if (t > 0 && t >= r.mod) remoteChanged = true;
            else { out.push(r); localChanged = true; }
        });
        return out;
    };
    const decks = mergeList(L.decks, R.decks, deckSig), cards = mergeList(L.cards, R.cards, cardSig), presets = mergeList(L.presets || [], R.presets || [], presetSig);
    const stats = mergeStats(L.stats, R.stats);
    if (JSON.stringify(stats) !== JSON.stringify(L.stats)) localChanged = true;
    if (JSON.stringify(stats) !== JSON.stringify(R.stats)) remoteChanged = true;
    const settings = { ...L.settings };
    if ((R.settings.settingsMod || 0) > (L.settings.settingsMod || 0)) {
        Object.keys(R.settings).forEach(k => { if (!DEVICE_ONLY_SETTINGS.includes(k) && settings[k] !== R.settings[k]) { settings[k] = R.settings[k]; localChanged = true; } });
        settings.settingsMod = R.settings.settingsMod;
    } else if ((L.settings.settingsMod || 0) > (R.settings.settingsMod || 0)) remoteChanged = true;
    const seen = new Set(), revlog = [];
    [...L.revlog, ...R.revlog].forEach(r => { const k = `${r[0]}|${r[1]}`; if (!seen.has(k)) { seen.add(k); revlog.push(r); } });
    revlog.sort((a, b) => a[0] - b[0]);
    if (revlog.length > L.revlog.length) localChanged = true;
    if (revlog.length > R.revlog.length) remoteChanged = true;
    const data = normalizeState({ version: 6, decks, cards, presets, stats, settings, revlog, deleted: tomb, updatedAt: Math.max(L.updatedAt || 0, R.updatedAt || 0) });
    return { data, localChanged, remoteChanged };
}

const Cloud = {
    client: null, status: 'off', timer: null, busy: false, pending: false, lastPull: 0, lastSync: 0, deferred: false, lastError: '',
    async ensure() {
        if (this.client) return true;
        try {
            if (!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js');
            if (!window.supabase || !window.supabase.createClient) return false;
            this.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            return true;
        } catch { return false; }
    },
    setStatus(s, err = '') {
        this.status = s; this.lastError = err;
        if (typeof app !== 'undefined' && app) { app.renderSyncIndicator(); if (app.popover && app.popover.dataset.kind === 'sync') app.refreshPopover(); }
    },
    key() { return app.data.settings.syncKey || ''; },
    async pull() {
        if (!(await this.ensure())) throw new Error('hors ligne');
        const id = await SyncCrypto.rowId(this.key());
        const res = await this.client.from('game_state').select('data, updated_at').eq('id', id).maybeSingle();
        if (res.error) throw new Error(res.error.message);
        this.lastPull = Date.now();
        return res.data;
    },
    async decode(row) {
        let raw = row.data;
        if (raw && raw.enc) {
            if (!this.key()) throw new Error('Données chiffrées : entre ta clé de synchronisation');
            try { raw = await SyncCrypto.decrypt(raw, this.key()); } catch { throw new Error('Clé de synchronisation incorrecte'); }
        }
        const st = normalizeState(raw);
        if (!st) throw new Error('Données distantes illisibles');
        st.updatedAt = Math.max(st.updatedAt, Date.parse(row.updated_at) || 0);
        return st;
    },
    schedulePush() {
        if (!app.data.settings.cloudSync) return;
        clearTimeout(this.timer);
        this.timer = setTimeout(() => this.push(), 2500);
    },
    async push() {
        if (!app.data.settings.cloudSync) return;
        if (this.busy) { this.pending = true; return; }
        this.busy = true; this.setStatus('busy');
        try {
            if (!(await this.ensure())) throw new Error('hors ligne');
            if (this.key() && !SyncCrypto.available()) throw new Error('Chiffrement indisponible (ouvre l\'app en https)');
            const payload = JSON.parse(app.serialize()), id = await SyncCrypto.rowId(this.key());
            const data = this.key() ? await SyncCrypto.encrypt(payload, this.key()) : payload;
            const res = await this.client.from('game_state').upsert({ id, data, updated_at: new Date(app.data.updatedAt || Date.now()).toISOString() });
            if (res.error) throw new Error(res.error.message);
            this.lastSync = Date.now();
            this.setStatus('ok');
        } catch (e) {
            console.warn('Sync cloud:', e.message);
            this.setStatus('err', e.message);
        } finally {
            this.busy = false;
            if (this.pending) { this.pending = false; this.schedulePush(); }
        }
    },
    async sync(manual = false) {
        if (!app.data.settings.cloudSync) { this.setStatus('off'); return; }
        if (app.session) { this.deferred = true; return; }
        this.setStatus('busy');
        try {
            if (this.key() && !SyncCrypto.available()) throw new Error('Chiffrement indisponible (ouvre l\'app en https)');
            const row = await this.pull();
            if (!row || !row.data) { await this.push(); if (manual) app.toast('Sauvegarde envoyée dans le cloud', 'success'); return; }
            const remote = await this.decode(row);
            if (app.session) { this.deferred = true; this.setStatus('ok'); return; }
            const m = mergeStates(app.data, remote);
            if (m.localChanged) {
                m.data.settings.syncKey = app.data.settings.syncKey; m.data.settings.cloudSync = app.data.settings.cloudSync;
                app.applyMerged(m.data);
                app.toast('Progression synchronisée depuis le cloud', 'success', ic('cloud'));
            }
            if (m.remoteChanged) await this.push();
            else { this.lastSync = Date.now(); this.setStatus('ok'); if (manual && !m.localChanged) app.toast('Déjà à jour', 'success'); }
        } catch (e) {
            console.warn('Sync cloud:', e.message);
            this.setStatus('err', e.message);
            if (manual) app.toast(/clé|chiffr/i.test(e.message) ? e.message : 'Synchronisation impossible (hors ligne ?)', 'error');
        }
    }
};

const app = new SuperAnki();
window.app = app;
app.init().catch(err => {
    console.error(err);
    const boot = document.getElementById('boot');
    if (boot) boot.innerHTML = `Oups, le chargement a échoué : ${esc(err.message)}. <br><button class="btn btn-primary" style="margin-top:12px" onclick="location.reload()">Recharger</button>`;
});

</script>
